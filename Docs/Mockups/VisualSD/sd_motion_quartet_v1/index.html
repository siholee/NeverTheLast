<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD 모션 · 세이 / 시 / 수르트 / 스카디</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;background:#101a29;color:#ecf1f8}*{box-sizing:border-box}body{max-width:1840px;margin:auto;padding:30px}h1{font-size:28px;letter-spacing:-.8px;margin:8px 0}p{color:#b4c2d6;line-height:1.65}.eyebrow{color:#dfc28e;font-size:12px;letter-spacing:2.5px}.top{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{font-size:13px;color:#dfc28e}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:23px 0}button,select{font:inherit;background:#23344c;color:inherit;border:1px solid #3c526f;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{background:#314b6c}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e6c68f;outline-offset:3px}label{color:#c0cddd;font-size:13px}input{accent-color:#dfbf88}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#18263a;border:1px solid #293e58;border-radius:16px;overflow:hidden}.card header{padding:17px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.card h2{margin:0;font-size:20px}.count{font-size:12px;color:#c2cfe0;font-variant-numeric:tabular-nums}.stage{aspect-ratio:600/624;background:#24344b;position:relative}.stage.light{background:#e8e1d7}.stage.checker{background-color:#34455a;background-image:conic-gradient(#40536a 25%,transparent 0 50%,#40536a 0 75%,transparent 0);background-size:24px 24px}canvas{width:100%;height:100%;display:block}.scrub{padding:13px 17px 5px}.scrub input{width:100%;margin:0}.caption{padding:7px 18px 18px;min-height:74px;color:#bbc9db;font-size:13px;line-height:1.65}.note{font-size:13px;margin-top:21px}footer{margin-top:25px;border-top:1px solid #2c3f57;padding-top:18px;color:#8599b2;font-size:12px;line-height:1.8}a{color:#bfdbff}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){body{padding:18px}.grid{grid-template-columns:1fr}.controls{gap:9px}.card h2{font-size:18px}}
</style>
<div class="top"><div><div class="eyebrow">NEVERTHELAST · SD MOTION STUDY</div><h1>준비에서 시전으로</h1><p>몸의 크기를 유지하며 준비에서 시전으로 이어지는 네 캐릭터의 전투 리듬.</p></div><div class="status" id="status">0 / 320 프레임</div></div>
<div class="controls"><button id="toggle">일시정지</button><button id="reset">처음부터</button><label>보기 <select id="mode"><option value="sequence">대기 → 준비 → 시전 → 대기</option><option value="idle">대기</option><option value="windup">준비</option><option value="strike">시전</option><option value="hit">피격</option><option value="down">쓰러짐</option></select></label><label>속도 <select id="speed"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label>배경 <select id="bg"><option value="">군청</option><option value="light">밝은 바탕</option><option value="checker">투명도 확인</option></select></label><label><input type="checkbox" id="repeat" checked> 반복</label></div>
<main class="grid" id="grid"></main>
<p class="note">각 모션은 16프레임입니다. 준비의 마지막 자세를 시전의 첫 자세로 공유하며 중간에 대기를 넣지 않습니다. 슬라이더를 움직이면 재생이 멈추고 해당 프레임을 보여줍니다.</p>
<footer>2026-10-29 · 크기·접지 보정 / 시의 칼집 고정 / 풍압 제거 검수본. 내장 이미지 생성 및 모션 리그 사용.<br>Unity 전투 적용 전입니다. <a href="../../../../Logs/SDMotionCorrection20261029/report.json">수정·검수 기록</a></footer>
<script>
const NAMES={idle:'대기',windup:'준비',strike:'시전',hit:'피격',down:'쓰러짐'},KEYS=Object.keys(NAMES),W=600,H=624;
const DEFINITIONS=[{id:'SEI',name:'세이',text:'한 손을 뻗은 뒤, 정면 바람에 머리 끝이 흐르며 손을 거둡니다.',times:{idle:1600,windup:800,strike:1120,hit:640,down:1120}},{id:'SHI',name:'시',text:'침착한 제자리 발도. 칼집을 고정하고 검을 짧게 뽑았다가 거둡니다.',times:{idle:1600,windup:640,strike:960,hit:640,down:1120}},{id:'SURTR',name:'수르트',text:'뒤로 당길 때 커지는 대검의 원근. 내려찍은 뒤 무게를 잠시 유지합니다.',times:{idle:1600,windup:800,strike:1280,hit:640,down:1280}},{id:'SKADI',name:'스카디',text:'몸은 조용히 두고 지팡이를 가볍게 들어올렸다가 내립니다.',times:{idle:1600,windup:800,strike:1120,hit:640,down:1120}}];
const TIMING={SURTR:[80,80,100,70,50,30,30,120,100,120,100,80,80,80,80,80],SHI:[80,80,30,30,30,30,40,100,100,80,80,60,60,60,50,50]};
let playing=true,time=0,last=0,loaded=0;const errors=[];
const cards=DEFINITIONS.map(d=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<header><h2>${d.name}</h2><span class="count">대기 · 01 / 16</span></header><div class="stage"><canvas width="600" height="624" aria-label="${d.name} 모션"></canvas></div><div class="scrub"><input type="range" min="0" max="31" value="0" step="1" aria-label="${d.name} 프레임"></div><div class="caption">${d.text}</div>`;document.querySelector('#grid').append(el);const c={...d,el,ctx:el.querySelector('canvas').getContext('2d'),slider:el.querySelector('input'),count:el.querySelector('.count'),images:{},current:{key:'idle',frame:0},manual:null};for(const key of KEYS)c.images[key]=Array.from({length:16},(_,i)=>{const im=new Image();im.onload=()=>{loaded++;document.querySelector('#status').textContent=`${loaded} / 320 프레임 준비`;if(loaded===320)render(time);};im.onerror=()=>errors.push(im.src);im.src=`${d.id}/frames/${key}/${String(i+1).padStart(2,'0')}.png?v=scale-sheath-20261029`;return im;});c.slider.oninput=()=>{const f=Number(c.slider.value),mode=document.querySelector('#mode').value;pause();c.manual=mode==='sequence'?{key:f<16?'windup':'strike',frame:f%16}:{key:mode,frame:f};draw(c,c.manual.key,c.manual.frame);};return c;});
function durations(c,key){return key==='strike'&&TIMING[c.id]?TIMING[c.id]:Array(16).fill(c.times[key]/16)}
function frameAt(ms,ds){let sum=0;for(let i=0;i<16;i++){sum+=ds[i];if(ms<sum)return i;}return 15}
function draw(c,key,f){c.current={key,frame:f};const ctx=c.ctx,im=c.images[key][f];ctx.clearRect(0,0,W,H);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,W,H);c.count.textContent=`${NAMES[key]} · ${String(f+1).padStart(2,'0')} / 16`;const mode=document.querySelector('#mode').value;c.slider.value=mode==='sequence'?(key==='strike'?16+f:key==='windup'?f:0):f;}
function state(c,ms){const mode=document.querySelector('#mode').value,repeat=document.querySelector('#repeat').checked;if(mode!=='sequence'){const t=mode==='idle'?ms%c.times.idle:repeat?ms%(c.times[mode]+650):ms;return{key:mode,frame:frameAt(t,durations(c,mode))}}const x=repeat?ms%3200:ms;if(x<400)return{key:'idle',frame:Math.floor(x/100)%16};if(x<400+c.times.windup)return{key:'windup',frame:frameAt(x-400,durations(c,'windup'))};if(x<400+c.times.windup+c.times.strike)return{key:'strike',frame:frameAt(x-400-c.times.windup,durations(c,'strike'))};return{key:'idle',frame:Math.floor((x-400-c.times.windup-c.times.strike)/100)%16}}
function render(ms){time=ms;for(const c of cards){const p=c.manual||state(c,ms);draw(c,p.key,p.frame)}}function pause(){playing=false;document.querySelector('#toggle').textContent='재생';render(time)}function reset(){time=0;cards.forEach(c=>c.manual=null);last=performance.now();render(0)}document.querySelector('#toggle').onclick=()=>{playing=!playing;cards.forEach(c=>c.manual=null);document.querySelector('#toggle').textContent=playing?'일시정지':'재생';last=performance.now()};document.querySelector('#reset').onclick=reset;document.querySelector('#mode').onchange=()=>{const seq=document.querySelector('#mode').value==='sequence';cards.forEach(c=>c.slider.max=seq?31:15);reset()};document.querySelector('#bg').onchange=e=>document.querySelectorAll('.stage').forEach(el=>el.className='stage '+e.target.value);function tick(now){if(!last)last=now;const dt=Math.min(now-last,100);last=now;if(playing)render(time+dt*Number(document.querySelector('#speed').value));requestAnimationFrame(tick)}requestAnimationFrame(tick);
window.quartetPreview={cards,errors,get loaded(){return loaded},pause,setTime:render,showFrame(key,f){pause();cards.forEach(c=>{c.manual={key,frame:f};draw(c,key,f)})}};
</script></html>
