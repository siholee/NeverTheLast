<title>NeverTheLast SD 최종 검토</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&family=Rajdhani:wght@600;700&display=swap">
<style>
/* 레이아웃: 위는 캐릭터 한 명의 샘플 전투(무대)와 판정 패널, 아래는 89종 로스터 격자. 무대 안 색은 게임 화면이라 테마와 무관하게 고정. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --sunken:#E4EAF2; --ink:#121A2E; --muted:#55657A; --line:rgba(33,54,92,.14);
  --accent:#21365C; --ok:#1F8A63; --okbg:rgba(31,138,99,.12); --fix:#B5482F; --fixbg:rgba(181,72,47,.12); --wait:#8A94A6; --redo:#8A5A00; --redobg:rgba(196,140,20,.14);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --f-num:"Rajdhani","IBM Plex Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#141C2F; --sunken:#0F1626; --ink:#E6ECF5; --muted:#93A1B8; --line:rgba(170,195,235,.14);
  --accent:#9DB4E2; --ok:#53C795; --okbg:rgba(83,199,149,.14); --fix:#F08A6C; --fixbg:rgba(240,138,108,.14); --wait:#6F7B91; --redo:#E8B84A; --redobg:rgba(232,184,74,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C2F; --sunken:#0F1626; --ink:#E6ECF5; --muted:#93A1B8; --line:rgba(170,195,235,.14);
  --accent:#9DB4E2; --ok:#53C795; --okbg:rgba(83,199,149,.14); --fix:#F08A6C; --fixbg:rgba(240,138,108,.14); --wait:#6F7B91; --redo:#E8B84A; --redobg:rgba(232,184,74,.16); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font:900 clamp(26px,3.4vw,38px)/1.2 var(--f-disp)}
h2{font:700 20px/1.3 var(--f-body)}
p{margin:0}
.muted{color:var(--muted)}
.head{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.head p{max-width:68ch}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:600 13px/1 var(--f-body);background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip b{font:700 15px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.fix{background:var(--fixbg);color:var(--fix)}
.chip.redo{background:var(--redobg);color:var(--redo)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);padding:4px;gap:4px;border-radius:10px}
.seg button,.btn{font:600 14px/1 var(--f-body);border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.btn{background:var(--surface);color:var(--ink)}
button:focus-visible,textarea:focus-visible,figure:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.main>*{min-width:0}
.panel{background:var(--surface);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.strip figure{margin:0;background:var(--sunken);border-radius:8px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:2px solid transparent}
.strip figure[aria-pressed="true"]{border-color:var(--accent)}
.strip .spr{display:block;width:100%;aspect-ratio:4/5}
.spr{background-repeat:no-repeat;background-size:500% 100%;background-position:0 0}
.strip figcaption{font:700 11px/1 var(--f-num);letter-spacing:.08em;color:var(--muted)}
.idrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.idrow code{font:500 12px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.note{background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:14px}
.note b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.decide{display:flex;flex-direction:column;gap:8px}
.decide .row{display:flex;gap:8px}
.decide .row button{flex:1;padding:11px 10px;font-size:15px}
.btn.b-ok{background:var(--okbg);color:var(--ok)} .btn.b-ok[aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.btn.b-fix{background:var(--fixbg);color:var(--fix)} .btn.b-fix[aria-pressed="true"]{background:var(--fix);color:var(--surface)}
textarea{font:14px/1.5 var(--f-body);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:68px;resize:vertical;width:100%;box-sizing:border-box}
.save{font-size:13px;color:var(--muted);min-height:1.2em}
.nav{display:flex;gap:8px}.nav .btn{flex:1}

/* ===== 샘플 전투 무대(게임 화면 고정색) ===== */
.mock{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#0E1628;border-radius:12px;max-width:100%}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:#F4F7FB;font-family:var(--f-body);
  background:#BFD6EE url(art/stage_sky_citadel.jpg) center/cover no-repeat}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,40,.25) 0%,rgba(14,22,40,0) 16%,rgba(14,22,40,0) 72%,rgba(14,22,40,.45) 100%)}
.top{position:absolute;left:24px;right:24px;top:16px;height:56px;border-radius:12px;background:rgba(244,247,251,.84);color:#21365C;display:flex;align-items:center;gap:28px;padding:0 26px;font:600 20px/1 var(--f-body);z-index:9000}
.top .r{margin-left:auto;font:700 19px/1 var(--f-num);letter-spacing:.06em}
.cap{position:absolute;left:50%;top:96px;transform:translateX(-50%);padding:12px 26px;border-radius:12px;background:rgba(14,22,40,.78);font:700 26px/1.3 var(--f-body);white-space:nowrap;z-index:9000;text-align:center}
.cap small{display:block;font:500 17px/1.4 var(--f-body);color:#B9C9DF}
.u{position:absolute;left:0;top:0;width:0;height:0}
.u .spr{position:absolute;display:block;user-select:none;pointer-events:none}
.u .sh{position:absolute;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(28,40,72,.4),rgba(28,40,72,0));transform:translate(-50%,-50%)}
.u .hp{position:absolute;height:8px;border-radius:4px;background:rgba(0,0,0,.45);transform:translateX(-50%)}
.u .hp i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#1FAE98,#39DCC1)}
.u.enemy .hp i{background:linear-gradient(90deg,#C8414F,#F06B78)}
.u.clone .spr{filter:sepia(.2) hue-rotate(118deg) saturate(.85) brightness(1.12)}
.u.focus .sh{background:radial-gradient(closest-side,rgba(255,214,120,.6),rgba(255,214,120,0))}
.dmg{position:absolute;font:700 54px/1 var(--f-num);color:#fff;-webkit-text-stroke:3px #14203A;paint-order:stroke fill;text-shadow:0 2px 0 #14203A;transform:translate(-50%,-50%) skewX(-8deg);white-space:nowrap;z-index:9500;pointer-events:none}
.dmg.sup{font:700 28px/1 var(--f-body);color:#BFF2DE;-webkit-text-stroke:0;text-shadow:0 1px 0 #14203A,0 0 10px rgba(20,32,58,.7);transform:translate(-50%,-50%)}
.posetag{position:absolute;left:24px;bottom:22px;z-index:9000;font:700 22px/1 var(--f-num);letter-spacing:.14em;padding:10px 14px;border-radius:10px;background:rgba(14,22,40,.72)}

/* ===== 로스터 ===== */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{background:var(--surface);border:2px solid transparent;border-radius:10px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative}
.card[aria-current="true"]{border-color:var(--accent)}
.card .spr{display:block;width:100%;aspect-ratio:4/5;background-color:var(--sunken);border-radius:7px}
.card .nm{font:600 13px/1.25 var(--f-body);overflow-wrap:anywhere}
.card .st{position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--wait);box-shadow:0 0 0 2px var(--surface)}
.card .st.ok{background:var(--ok)} .card .st.fix{background:var(--fix)} .card .st.redo{background:var(--redo)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font:700 15px/1.3 var(--f-body);color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border-radius:12px}
</style>

<div class="wrap">
  <header class="head">
    <div style="display:flex;flex-direction:column;gap:6px">
      <h1>SD 최종 검토</h1>
      <p class="muted">게임에 등록된 완성 SD 124종을 한 명씩 샘플 전투로 확인합니다. 캐릭터는 대기 → 행동 준비 → 행동 → 피격 → 쓰러짐을 반복하고, 소환술사는 소환수와 함께 나옵니다. 오른쪽에서 승인하거나 수정할 점을 남기면 Claude가 그대로 읽어 반영합니다. 노란 점 "재검토"는 이전 수정 요청을 반영한 캐릭터입니다.</p>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>

  <div class="bar">
    <span class="seg" role="group" aria-label="분류" id="grp"></span>
    <span class="seg" role="group" aria-label="판정" id="stf"></span>
  </div>

  <div class="main">
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="mock" id="mock"><div class="stage" id="stage">
        <div class="grade"></div>
        <div class="top"><span id="tStage">1-1</span><span id="tTheme"></span><span>전투 중</span><span class="r" id="tSpd">×1</span></div>
        <div class="cap" id="cap"></div>
        <div id="units"></div>
        <div class="posetag" id="posetag">IDLE</div>
      </div></div>
      <div class="ctl">
        <button class="btn" id="bPlay">일시정지</button>
        <button class="btn" id="bSpd">배속 ×1</button>
        <span class="muted" style="font-size:13px">오른쪽 포즈 그림을 누르면 그 포즈로 멈추고, 다시 누르면 재생합니다.</span>
      </div>
    </div>

    <aside class="panel" aria-label="판정">
      <div class="idrow"><h2 id="pName">-</h2><code id="pId"></code></div>
      <div class="muted" id="pGroup" style="font-size:14px;margin-top:-8px"></div>
      <div class="strip" id="strip"></div>
      <div class="note" id="pNote" hidden><b>Claude 검수 메모</b><span></span></div>
      <div class="decide">
        <div class="row">
          <button class="btn b-ok" id="bOk" aria-pressed="false">승인</button>
          <button class="btn b-fix" id="bFix" aria-pressed="false">수정 요청</button>
        </div>
        <label for="fixNote" class="muted" style="font-size:13px">수정할 점(수정 요청일 때 필수)</label>
        <textarea id="fixNote" placeholder="예: STRIKE에서 칼을 더 앞으로, 머리를 조금 크게"></textarea>
        <div class="save" id="saveMsg"></div>
      </div>
      <div class="nav"><button class="btn" id="bPrev">← 이전</button><button class="btn" id="bNext">다음 →</button></div>
    </aside>
  </div>

  <div id="rosterWrap" class="sec"></div>
</div>

  for(const s of SUMS){
    if(SP.hp){pose(s,'windup');setPoseTag('windup');await wait(140);pose(s,'strike');setPoseTag('strike');pop(s,'치유',true);await wait(360);pose(s,'idle');continue;}
    const x0=s.hx,y0=s.hy, tx=O.x-dir*120, ty=O.y+4;
    pose(s,'windup'); setPoseTag('windup'); await wait(100);
    if(SP.above){pose(s,'strike');setPoseTag('strike');pose(O,'hit');pop(O,String(400+Math.floor(Math.random()*300)));await wait(300);pose(O,'idle');pose(s,'idle');await wait(80);continue;}
    await tween(SP.kind==='comp'?160:200,k=>{const e=ease(k);s.x=x0+(tx-x0)*e;s.y=y0+(ty-y0)*e-(SP.kind==='comp'?50*Math.sin(Math.PI*k):0);place(s);});
    pose(s,'strike'); setPoseTag('strike'); pose(O,'hit'); pop(O,String(500+Math.floor(Math.random()*500))); await wait(260);
    pose(O,'idle'); pose(s,'idle'); await tween(220,k=>{const e=ease(k);s.x=tx+(x0-tx)*e;s.y=ty+(y0-ty)*e;place(s);});
    s.x=x0;s.y=y0;place(s); await wait(120);}
}
async function loop(){
  const tk=++token, dir=build(), c=BY[cur], owner=OWNER[cur]||cur, sup=SUPPORT.has(owner);
  if(lock){const target=OWNER[cur]?SUMS.find(s=>s.id===cur):F; pose(target,lock); setPoseTag(lock); cap(c.name,'포즈 고정 · 그림을 다시 누르면 재생'); return;}
  try{ for(;;){
    cap(c.name, c.g==='summon'?`${BY[owner].name}의 소환수`:(c.theme?`${c.theme} · 적`:'아군'));
    pose(F,'idle'); setPoseTag('idle'); await wait(1000);
    await attack(F,O,dir,sup); await wait(260);
    await summonsAct(dir); await wait(320);
    // 상대의 공격 → 주인만 피격(소환수는 피격 판정이 따로라 함께 맞지 않는다)
    await attack(O,F,-dir,false); setPoseTag('hit'); await wait(300);
    if(c.g==='summon'&&!SP.display){const s=SUMS.find(x=>x.id===cur); pose(s,'hit'); setPoseTag('hit'); await wait(420); pose(s,'idle'); await wait(200);}
    setPoseTag('down'); pose(F,'down'); SUMS.forEach(s=>pose(s,'down'));
    if(FADE_DOWN.has(owner)){await tween(600,k=>{F.img.style.opacity=String(1-.65*k);}); await wait(900);} else await wait(1300);
    F.img.style.opacity=''; SUMS.forEach(s=>pose(s,'idle')); pose(F,'idle'); await wait(500);
  }}catch(e){if(e!==STOP)console.error(e);}
}

// ---------- 패널 ----------
function renderPanel(){
  const c=BY[cur];
  $('#pName').textContent=c.name; $('#pId').textContent=c.id;
  $('#pGroup').textContent=c.g==='ally'?'아군':c.g==='summon'?`소환수 · ${BY[OWNER[c.id]].name}`:`적 · ${c.theme}`;
  $('#strip').innerHTML=POSES.map(p=>`<figure role="button" tabindex="0" data-p="${p}" aria-pressed="${lock===p}">${spr(c.id,p)}<figcaption>${p.toUpperCase()}</figcaption></figure>`).join('');
  const n=NOTE[c.id]; $('#pNote').hidden=!n; if(n) $('#pNote span').textContent=n;
  const r=REV[c.id]||{}, st=stOf(c.id); $('#bOk').setAttribute('aria-pressed',String(st==='approved')); $('#bFix').setAttribute('aria-pressed',String(st==='fix'));
  const ta=$('#fixNote'); if(document.activeElement!==ta) ta.value=st==='redo'?'':(r.note||'');
  $('#saveMsg').textContent=db?(st==='redo'?`수정 반영됨 · 다시 판정해 주세요 (이전 요청: ${r.note})`:st!=='wait'?`저장됨 · ${ST_L[st]}`:'아직 판정 전'):'판정을 저장하려면 claude.ai에 로그인한 상태로 열어 주세요. 지금은 보기만 됩니다.';
}
$('#strip').addEventListener('click',e=>{const f=e.target.closest('figure');if(!f)return;lock=lock===f.dataset.p?null:f.dataset.p;renderPanel();loop();});
$('#strip').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.closest('figure')?.click();}});

// ---------- 로스터 ----------
const THEMES=['콜로세움','로마 군단','메히코','공허 괴수','아스완','노르드','노르드 북부','노르드 중부','오디세이'];
const GROUPS=[['all','전체'],['ally','아군'],['summon','소환수'],...THEMES.map(t=>[t,t])];
const STF=[['all','모두'],['wait','미검토'],['redo','재검토'],['approved','승인'],['fix','수정 요청']];
function seg(el,list,val,on){el.innerHTML=list.map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===val}">${l}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;on(b.dataset.k);};}
function visible(c){const okG=grp==='all'||c.g===grp||c.theme===grp; const s=stOf(c.id); return okG&&(stf==='all'||s===stf);}
function renderRoster(){
  seg($('#grp'),GROUPS,grp,k=>{grp=k;renderRoster();});
  seg($('#stf'),STF,stf,k=>{stf=k;renderRoster();});
  const sections=[['아군','ally'],['소환수','summon'],...THEMES.map(t=>[t,t])];
  let html='';
  for(const [title,key] of sections){const list=C.filter(c=>(c.g===key||c.theme===key)&&visible(c)); if(!list.length) continue;
    html+=`<section class="sec"><h3>${title} · ${list.length}</h3><div class="roster">`+list.map(c=>{const s=stOf(c.id);
      return `<button class="card" data-id="${c.id}" aria-current="${c.id===cur}"><span class="st ${s==='approved'?'ok':s==='fix'?'fix':s==='redo'?'redo':''}" title="${ST_L[s]}"></span>${spr(c.id,'idle')}<span class="nm">${c.name}</span></button>`;}).join('')+`</div></section>`;}
  $('#rosterWrap').innerHTML=html||'<div class="empty">이 조건에 맞는 캐릭터가 없습니다.</div>';
  const n=k=>C.filter(c=>stOf(c.id)===k).length, a=n('approved'), f=n('fix'), rd=n('redo');
  $('#tally').innerHTML=`<span class="chip">전체 <b>${C.length}</b></span><span class="chip ok">승인 <b>${a}</b></span><span class="chip redo">재검토 <b>${rd}</b></span><span class="chip fix">수정 요청 <b>${f}</b></span><span class="chip">미검토 <b>${C.length-a-f-rd}</b></span>`;
}
$('#rosterWrap').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;select(b.dataset.id,true);});
function order(){const l=C.filter(visible);return l.length?l:C;}
function select(id,scroll){cur=id;lock=null;renderPanel();renderRoster();loop();
  try{history.replaceState(null,'','#'+id.toLowerCase().replace(/_/g,'-'));}catch(e){}
  if(scroll) mock.scrollIntoView({behavior:'smooth',block:'nearest'});}
function step(d){const l=order();let i=l.findIndex(c=>c.id===cur);i=(i+d+l.length)%l.length;select(l[i].id,false);}
$('#bPrev').onclick=()=>step(-1); $('#bNext').onclick=()=>step(1);
$('#bPlay').onclick=()=>{paused=!paused;$('#bPlay').textContent=paused?'재생':'일시정지';};
$('#bSpd').onclick=()=>{speed=speed===1?2:speed===2?.5:1;$('#bSpd').textContent=`배속 ×${speed}`;$('#tSpd').textContent=`×${speed}`;};

// ---------- 판정 저장(db: sdReview/{prefix}) ----------
async function save(status){
  if(!db){$('#saveMsg').textContent='판정을 저장하려면 claude.ai에 로그인한 상태로 열어 주세요.';return;}
  const note=$('#fixNote').value.trim();
  if(status==='fix'&&!note){$('#saveMsg').textContent='수정할 점을 한 줄 이상 적어 주세요.';$('#fixNote').focus();return;}
  const id=cur; REV[id]={status,note,at:Date.now()}; renderPanel(); renderRoster();
  $('#saveMsg').textContent='저장 중…';
  try{await db.doc('sdReview/'+id).set({status,note,name:BY[id].name,at:Date.now()});
    $('#saveMsg').textContent=`저장됨 · ${ST_L[status]}`;
    if(status==='approved') setTimeout(()=>{if(cur===id) step(1);},500);}
  catch(e){$('#saveMsg').textContent='저장하지 못했습니다. 이 페이지에 쓸 권한이 있는지 확인해 주세요.';}
}
$('#bOk').onclick=()=>save('approved'); $('#bFix').onclick=()=>save('fix');

// ---------- 시작 ----------
const fromHash=()=>{const h=(location.hash||'').slice(1).toUpperCase().replace(/-/g,'_');return BY[h]?h:null;};
cur=fromHash()||cur;
window.addEventListener('hashchange',()=>{const h=fromHash();if(h&&h!==cur)select(h,false);});
renderPanel(); renderRoster(); loop();
(async()=>{try{db=await window.claude?.use?.('db');}catch(e){db=null;}
  if(!db){renderPanel();return;}
  try{db.collection('sdReview').onSnapshot(snap=>{for(const d of snap.docs){const v=d.data()||{};REV[d.id]={status:v.status,note:v.note||'',at:v.at};}renderPanel();renderRoster();},()=>{});}catch(e){}
  renderPanel();})();
})();
</script>
