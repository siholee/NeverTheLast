<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD 모션 2회차</title>
<style>:root{color-scheme:dark;font:15px system-ui,'Malgun Gothic';background:#101a29;color:#eaf1f8}*{box-sizing:border-box}body{margin:0;padding:28px}h1{font-size:27px;margin:8px 0}p{color:#bac9db;line-height:1.7}button,select{font:inherit;padding:9px;border:1px solid #40536c;border-radius:8px;background:#25374d;color:inherit}button{cursor:pointer}label{white-space:nowrap}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin:24px 0}.grid{display:flex;gap:18px;flex-wrap:wrap;align-items:start}.card{background:#19283c;border:1px solid #30435e;border-radius:13px;overflow:hidden;flex:none;max-width:100%}header{padding:14px 16px;display:flex;justify-content:space-between;gap:20px}h2{font-size:18px;margin:0}.badge{font-size:11px;color:#f7c984}.stage{background:#24344b;overflow:auto;max-width:100%}.light .stage{background:#ece5da}.checker .stage{background-color:#34455a;background-image:conic-gradient(#40536a 25%,transparent 0 50%,#40536a 0 75%,transparent 0);background-size:24px 24px}canvas{display:block}.scrub{padding:12px 14px;width:100%}.scrub input{width:100%;accent-color:#dfbf88}.counter{font-size:12px;color:#bfd0e2}.note{font-size:12px;max-width:1100px}a{color:#bcd9ff}:focus-visible{outline:2px solid #e6c78c;outline-offset:3px}</style>
<h1>SD 모션 2회차</h1><p>시 · 세이 · 프레이아 · 수르트 · 스카디 / 대기 · 공격 · 피격 · 사망</p>
<nav><button id="play">일시정지</button><button id="reset">처음부터</button><label>모션 <select id="motion"><option value="idle">대기</option><option value="attack">공격</option><option value="hit">피격</option><option value="death">사망</option><option value="sequence">4모션 이어 보기</option></select></label><label>크기 <select id="size"><option value="battle">전투 크기 · 몸 높이 250px</option><option value="original">원본 1024 × 1280</option></select></label><label>속도 <select id="speed"><option value=".25">0.25배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label>배경 <select id="bg"><option value="">군청</option><option value="light">밝은 바탕</option><option value="checker">투명도</option></select></label><label><input id="repeat" type="checkbox" checked> 반복</label><span id="status"></span></nav>
<main class="grid" id="grid"></main><p class="note">슬라이더를 움직이면 해당 프레임에서 멈춥니다. 사망은 마지막 자세를 유지합니다. 공격·피격 반복 사이에는 500ms, 사망 반복 사이에는 1000ms를 유지합니다. 몸 높이 250px는 대기 키의 정수리–접지 거리 기준이며 무기는 포함하지 않습니다. FAIL 표시는 자체 검수 미통과이며 게임에 적용되지 않은 목업입니다. <a href="../../../../Logs/SDMotionV2_20261029/report.md">결과 보고서</a></p>
<script src="viewer_data.js"></script><script>
const $=s=>document.querySelector(s),N={idle:'대기',attack:'공격',hit:'피격',death:'사망'},M=Object.keys(N);let playing=true,time=0,last=0,loaded=0,errors=[];
const cards=(window.SD_MOTION_DATA||[]).map(d=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<header><h2>${d.name}</h2><span class="badge">${d.review||'검수 대기'}</span></header><div class="stage"><canvas width="1024" height="1280" aria-label="${d.name} 모션"></canvas></div><div class="scrub"><span class="counter"></span><input type="range" min="0" max="27" value="0" step="1" aria-label="${d.name} 프레임"></div>`;$('#grid').append(el);const c={...d,el,canvas:el.querySelector('canvas'),ctx:el.querySelector('canvas').getContext('2d'),slider:el.querySelector('input'),counter:el.querySelector('.counter'),images:{},manual:null};for(const key of M)c.images[key]=d.manifest.motions[key].files.map(file=>{let im=new Image();im.onload=()=>{loaded++;$('#status').textContent=`${loaded} 프레임 준비`;drawAll()};im.onerror=()=>{errors.push(file);$('#status').textContent=`로드 실패 ${errors.length}`};im.src=`${d.id}/${file}`;return im});c.slider.oninput=()=>{playing=false;$('#play').textContent='재생';c.manual={key:$('#motion').value==='sequence'?'attack':$('#motion').value,frame:+c.slider.value};drawAll()};return c});
function frameAt(ms,ds){let sum=0;for(let i=0;i<ds.length;i++){sum+=ds[i];if(ms<sum)return i}return ds.length-1}
function state(c){if(c.manual)return c.manual;let key=$('#motion').value,t=time;if(key==='sequence'){let cycle=M.reduce((s,k)=>s+c.manifest.motions[k].durationMs,0)+1000;if($('#repeat').checked)t%=cycle;for(let k of M){let m=c.manifest.motions[k];if(t<m.durationMs)return{key:k,frame:frameAt(t,m.frameMs)};t-=m.durationMs}return{key:'death',frame:c.manifest.motions.death.count-1}}let m=c.manifest.motions[key];if(key==='idle')t%=m.durationMs;else if($('#repeat').checked)t%=m.durationMs+(key==='death'?1000:500);return{key,frame:frameAt(t,m.frameMs)}}
function drawAll(){for(const c of cards){let s=state(c),m=c.manifest.motions[s.key],im=c.images[s.key][s.frame];c.ctx.clearRect(0,0,1024,1280);if(im.complete&&im.naturalWidth)c.ctx.drawImage(im,0,0);c.counter.textContent=`${N[s.key]} · ${s.frame+1} / ${m.count}${m.impactFrame===s.frame+1?' · 정점':''}${m.sheatheFrame===s.frame+1?' · 납도 완료':''}`;c.slider.max=m.count-1;c.slider.value=s.frame;c.current=s}}
function resize(){for(const c of cards){let scale=$('#size').value==='original'?1:250/c.bodyHeight;c.canvas.style.width=1024*scale+'px';c.canvas.style.height=1280*scale+'px';c.el.style.width=Math.max(280,1024*scale)+'px'}}
function reset(){time=0;cards.forEach(c=>c.manual=null);drawAll()}$('#play').onclick=()=>{playing=!playing;cards.forEach(c=>c.manual=null);$('#play').textContent=playing?'일시정지':'재생'};$('#reset').onclick=reset;$('#motion').onchange=reset;$('#size').onchange=resize;$('#bg').onchange=()=>document.body.className=$('#bg').value;function tick(now){if(last&&playing)time+=Math.min(now-last,100)*+$('#speed').value;last=now;drawAll();requestAnimationFrame(tick)}resize();requestAnimationFrame(tick);
window.sdMotionV2={cards,errors,get loaded(){return loaded},get time(){return time},pause(){playing=false;$('#play').textContent='재생'},setTime(ms){time=ms;cards.forEach(c=>c.manual=null);drawAll()},show(key,frame){playing=false;$('#motion').value=key;cards.forEach(c=>c.manual={key,frame});drawAll()}};
</script></html>
