<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세이 · 고요한 초월자</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;color:#edf2f8;background:#101a29}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1700px;margin-inline:auto}header{display:flex;gap:20px;justify-content:space-between;align-items:end;flex-wrap:wrap}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{color:#b6c4d6;line-height:1.7;margin:8px 0}.eyebrow{color:#e4c48a;font-size:12px;letter-spacing:3px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 25px}button,select{font:inherit;color:inherit;background:#23334a;border:1px solid #40536d;border-radius:9px;padding:9px 14px;cursor:pointer}button:hover{background:#314765}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f0ce90;outline-offset:3px}label{font-size:13px;color:#c6d0de}input{accent-color:#e2c591}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#18263a;border:1px solid #2a3e57;border-radius:16px;overflow:hidden}.card h2{margin:0;font-size:18px}.card header{padding:18px 18px 8px;gap:4px}.count{font-size:12px;font-variant-numeric:tabular-nums;color:#aebdd1}.stage{background:#24344b;overflow:hidden;aspect-ratio:4/5}.stage.light{background:#e6dfd2}.stage.checker{background-color:#354355;background-image:linear-gradient(45deg,#425268 25%,transparent 25%),linear-gradient(-45deg,#425268 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#425268 75%),linear-gradient(-45deg,transparent 75%,#425268 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{display:block;width:100%;height:100%;object-fit:contain}.scrub{padding:12px 16px}.scrub input{width:100%;margin:0}.caption{font-size:12px;min-height:58px;padding:0 18px 16px;color:#b5c3d5;line-height:1.6}details{margin-top:25px;border-top:1px solid #30415a;padding-top:18px}summary{cursor:pointer;color:#e4c48a}.poses{width:100%;border-radius:12px;margin-top:18px}.status{font-size:13px;color:#d3c09b}.note{margin-top:20px;font-size:13px}a{color:#c3dcff}footer{padding:25px 0;color:#8294ac;font-size:12px;line-height:1.8}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:690px){body{padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card header{padding:12px}.caption{padding-inline:12px}.card h2{font-size:16px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
<header><div><div class="eyebrow">NEVERTHELAST · SEI</div><h1>고요한 초월자</h1><p>차분히 내려오는 머리카락, 부드러운 눈빛, 검지 하나의 작은 시전.</p></div><div class="status" id="status">이미지 불러오는 중…</div></header>
<div class="controls"><button id="toggle">일시정지</button><button id="reset">처음부터</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label>배경 <select id="bg"><option value="">군청</option><option value="light">밝은 바탕</option><option value="checker">투명도 확인</option></select></label><label><input type="checkbox" id="repeat" checked> 동작 반복</label></div>
<main class="grid" id="grid"></main>
<p class="note">슬라이더로 각 동작의 16프레임을 하나씩 확인할 수 있습니다. 대기는 이어지고, 나머지 동작은 끝 자세를 잠깐 유지한 뒤 반복합니다. 반복을 끄면 마지막 자세에서 멈춥니다.</p>
<details><summary>5개 기준 포즈 보기</summary><img class="poses" src="poses_overview.png" alt="세이의 대기, 준비, 시전, 피격, 쓰러짐 포즈"></details>
<footer>2026-10-29 · SD 모션 시안. Unity 적용과 전투 콜백 연동 전입니다.<br>참고 조사: <a href="https://news.fate-go.jp/2026/2026_f_s_f_cp_pu/">FGO 공식 엘키두 일러스트</a> · <a href="https://fate-strange-fake.com/character/">Fate/strange Fake 공식 캐릭터</a></footer>
<script>
const defs=[{key:'idle',name:'대기',ms:1600,loop:true,desc:'두 팔을 내린 채 작은 호흡과 눈 깜빡임.'},{key:'windup',name:'준비',ms:800,desc:'한 손을 느리게 올리고 검지를 준비.'},{key:'strike',name:'시전',ms:960,desc:'검지 하나를 살짝 내밀고 손을 내림.'},{key:'hit',name:'피격',ms:640,desc:'작게 움찔한 뒤 침착한 자세로 회복.'},{key:'down',name:'쓰러짐',ms:1120,desc:'조용히 무릎을 꿇고 고개를 숙임.'}];
let playing=true,last=0,time=0,loaded=0;const errors=[];
const cards=defs.map(d=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<header><h2>${d.name}</h2><span class="count">01 / 16</span></header><div class="stage"><canvas width="320" height="400" aria-label="세이 ${d.name} 애니메이션"></canvas></div><div class="scrub"><input type="range" min="0" max="15" step="1" value="0" aria-label="${d.name} 프레임"></div><div class="caption">${d.desc}<br>${(d.ms/1000).toFixed(2)}초 · 16프레임</div>`;document.querySelector('#grid').append(el);const ctx=el.querySelector('canvas').getContext('2d'),slider=el.querySelector('input'),count=el.querySelector('.count');const images=Array.from({length:16},(_,i)=>{const im=new Image();im.onload=()=>{loaded++;document.querySelector('#status').textContent=`${loaded} / 80 프레임 준비`;if(loaded===80)setTime(time);};im.onerror=()=>{errors.push(im.src);document.querySelector('#status').textContent='이미지를 불러오지 못했습니다.';};im.src=`frames/${d.key}/SEI_${d.key.toUpperCase()}_${String(i+1).padStart(2,'0')}.png`;return im;});const card={...d,el,ctx,slider,count,images,frame:0,manual:null};slider.oninput=()=>{playing=false;document.querySelector('#toggle').textContent='재생';card.manual=Number(slider.value);draw(card,card.manual);};return card;});
function draw(c,f){c.frame=f;c.ctx.clearRect(0,0,320,400);if(c.images[f].complete&&c.images[f].naturalWidth)c.ctx.drawImage(c.images[f],0,0);c.slider.value=f;c.count.textContent=`${String(f+1).padStart(2,'0')} / 16`;}
function setTime(ms){time=ms;for(const c of cards){const repeat=document.querySelector('#repeat').checked;const t=c.loop?ms%c.ms:repeat?ms%(c.ms+600):ms;draw(c,Math.min(15,Math.floor(t/c.ms*16)));}}
document.querySelector('#toggle').onclick=()=>{playing=!playing;for(const c of cards)c.manual=null;document.querySelector('#toggle').textContent=playing?'일시정지':'재생';last=performance.now();};
document.querySelector('#reset').onclick=()=>{for(const c of cards)c.manual=null;setTime(0);last=performance.now();};
document.querySelector('#bg').onchange=e=>document.querySelectorAll('.stage').forEach(el=>el.className='stage '+e.target.value);
function tick(now){if(!last)last=now;const dt=Math.min(now-last,100);last=now;if(playing)setTime(time+dt*Number(document.querySelector('#speed').value));else for(const c of cards)if(c.manual!==null)draw(c,c.manual);requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.seiPreview={cards,defs,errors,get loaded(){return loaded},pause(){playing=false;setTime(time);document.querySelector('#toggle').textContent='재생'},setTime,showFrame(i){playing=false;cards.forEach(c=>draw(c,i))}};
</script>
</html>
