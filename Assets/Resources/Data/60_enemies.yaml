# 적 데이터
#
# 스탯 규격 (2026-08 개편):
#   · 공격력/방어력 스탯은 존재하지 않는다. 모든 전투 수치는 5스탯에서 파생된다.
#       피해     = 스킬 위력 × 주스탯 × 0.2   (포켓몬식 — 위력은 스킬마다 고정)
#       최대체력 = CON × 100
#       방어력   = STR × 1      (롤 방식: 받는 피해 배율 = 기준값 / (기준값 + 방어력))
#     기준값은 레벨에 비례해 커지므로 감소율은 레벨과 무관하게 일정하다.
#   · 스탯 = base + incrementLvl × (Level − 1)
#   · 적의 Level은 현재 스테이지와 같다. 즉 1스테이지 = Level 1 = 성장분 0.
#   · mainStat ×1.2 / subStat ×1.1 배율은 아군과 동일하게 적용된다.
#
# 현재는 콜로세움(로마) 테마만 운영한다.
# 노르드·아즈텍·일본 테마의 적은 전용 스프라이트가 없어 제거되었다.
# 새 테마를 추가할 때는 초상화 자산을 먼저 확보한 뒤 등록할 것.

