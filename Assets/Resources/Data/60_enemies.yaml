# 적 데이터
#
# 스탯 규격은 아군과 같다(10_units.yaml 머리말, Detail_03 §2). 적의 레벨은 스테이지와 같다.
#   스탯 = 기초값 + 성장치 × (레벨 − 1)
#
# tier: normal / elite / boss.  archetype은 배치 열만 정한다(7·8·9 전열, 그 외 후열 — 70_rounds.yaml).
# codes는 1000번대 공용 블록을 쓴다(Detail_11 §1.5).
#   일반행동  1001 돌격(카드 후퇴·부분 전진 뒤 대상 피격) · 1002 사격(방향성 시전광 뒤 대상 단일 피격)
#   궁극기    1001 강타 · 1002 연사 · 1003 대지 분쇄 · 1004 공허의 숨결
#
# 2026-10-12: 기존 시험장5/범용20을 보존하고 오리지널154종을 현행8스탯으로 이관했다.
# 복구 개체의 스킬은 reworkKit 명시 사양이며 원본ID는 originalId에 보존한다.

