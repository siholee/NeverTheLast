# 내구(durability): 받는 피해에서 고정으로 깎는 값.
#   방어력(비율 감소)과 달리 방어 무시·관통의 영향을 받지 않는다.
#   방어구 계열에만 부여한다.
#   T1 기준 — 의복 2 / 경갑 5 / 방패 6 / 중갑 10 / 판금 16
#   상위 티어는 `T1 값 × (1 + (rarity-1) × 0.6)`을 기준으로 올린다.
#   (고정값이므로 티어를 따라 올리지 않으면 후반에 무의미해진다)
#
# themeIds: 테마 전용 보상. 비어 있으면 모든 테마의 보상 풀에 등장한다.
#   값은 80_stages.yaml의 stageThemes[].id다 (적 themeId가 아니다).
