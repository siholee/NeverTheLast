# 장비 규격 — 상세 기획서 Detail_14 §1~§2가 원본이다.
#
# 장비 한 점은 네 가지로 정의된다.
#   분류(category)  · 스탯(statBonuses) · 무게(weight) · 착용 조건(requiredProficiency, 없을 수도 있음)
#
# 1) 스탯은 <무엇을 올릴지>만 고르고 <얼마나>는 티어가 정한다.
#      티어 계수 P = T1:1 · T2:3 · T3:5 · T4:7 · T5:9
#      5스탯(STR/DEX/CON/INT/LUK) = +P
#      CritRate(치명타 확률) · CritDamage(치명타 피해) · Durability(내구) = +2P
#    한 장비는 스탯을 하나만 갖는다.
#
# 2) 무게는 분류가 정한다. 같은 분류면 티어가 올라도 무게가 그대로다.
#      1: 단검 · 지팡이 · 보주 · 목걸이 · 반지
#      2: 한손검 · 단궁 · 단창 · 경갑 · 투구 · 신발
#      3: 창 · 둔기 · 장궁 · 방패
#      4: 대검 · 쇠뇌 · 평갑
#      6: 중갑
#      의복은 1.
#
# 3) 착용 조건은 분류와 같은 이름의 숙련이다.
#    의복·투구·목걸이·반지·신발은 조건이 없어 누구나 효과를 받는다.
#    숙련이 없으면 무게만 남고 statBonuses·codeGrants·내구가 전부 죽는다.
#
# 4) T3 이상은 codeGrants를 하나 갖는다. T1·T2는 스탯과 내구만 준다.
#
# 5) 방어구(방패·갑옷·투구·의복)는 스탯과 별개로 <티어 x 분류> 고정 내구를 갖는다.
#    내구는 받는 피해에서 고정으로 깎는 값이라 방어 무시·관통의 영향을 받지 않는다.
#      배수 M = T1:1 · T2:2 · T3:3.25 · T4:4.75 · T5:6.5   (T1 값 x M, 반올림)
#
#      분류   T1   T2   T3   T4   T5
#      의복    2    4    7   10   13
#      투구    3    6   10   14   20
#      경갑    5   10   16   24   33
#      방패    6   12   20   29   39
#      평갑   10   20   33   48   65
#      중갑   16   32   52   76  104
#
# themeIds: 테마 전용 보상. 비어 있으면 모든 테마의 보상 풀에 등장한다.
#   값은 80_stages.yaml의 stageThemes[].id다 (적 themeId가 아니다).
