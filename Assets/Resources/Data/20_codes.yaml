    - { id: 43, verbalName: 태산부군제, codeName: SeimeiHeavenEarthReversal, description: "아군 전체에게 3턴간 턴 시작 시 최대 체력의 1/8을 회복하는 재생과, 다음 자기 행동이 끝날 때까지 공격한 적에게 봉인부를 부착하는 부적을 부여한다." }
