      description: "<마나 120> 가장 공격력이 높은 아군에게 3턴 동안 대상 공격력의 10% + 찬드라 최대 체력의 10%만큼 공격력을 부여하고, 월광 1중첩을 얻는다."
    - id: 122
      verbalName: 미운 놈 한 대 더 때리기
      codeName: BastetOneMoreHit
      description: "<상시> 다른 아군의 반격이 적에게 실제 피해를 주면 바스테트가 같은 대상에게 공격력100% 냥냥펀치를 우선 추가행동으로 한 번 사용한다. 턴당 제한은 없고 같은 반격 행동 하나당 한 번만 발동한다. 이 공격은 일반행동과 추가행동으로 함께 판정하며 초월기 자원을 충전하거나 소모하지 않는다. 후속 공격을 마치면 본타가 실제로 깎은 체력·보호막 피해의50%만큼 이 후속을 유발한 반격 요원을 치유한다. 치유 출처는 바스테트이며 공통 치유 보정을 적용한다. 파생 추가 피해는 제외하고, 취소·무피해·사망/이탈한 반격자는 치유하지 않는다. #단일 #일반 #추가행동 #접촉 #물리"
