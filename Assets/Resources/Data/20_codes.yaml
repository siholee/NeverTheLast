    - { id: 262, verbalName: 영원히 타오르는 불꽃, codeName: AgniEternalFlame, description: "필드의 불 원소 아군이 가하는 피해 +20%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다. <고유 패시브>" }
    - { id: 62, verbalName: 대마법사, codeName: AgniArchmage, description: "필드의 보주 숙련 아군이 가하는 특수 피해의 치명타 피해 +25%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다." }
    - { id: 263, verbalName: 뇌정 각인, codeName: IndraThunderMark, description: "<전수 불가능> 적을 타격할 때마다 2턴간 유지되는 표식을 남긴다. 표식이 4가 되면 INT의 40%에 해당하는 고정 피해를 입힌다. 치명타가 적용되지 않는다. <고유 패시브>" }
    - { id: 63, verbalName: 선두주자, codeName: IndraFrontrunner, description: "전투 종료 후 획득하는 EXP +30%." }
    - { id: 64, verbalName: 천재, codeName: IndraGenius, description: "메인으로 훈련받을 때 어느 훈련이든 INT 상승량 +10%(부 스탯 몫 포함)." }
