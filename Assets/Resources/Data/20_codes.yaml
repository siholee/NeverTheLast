    - { id: 12, verbalName: 처녀 여왕, codeName: ElizabethVirginQueen, description: "아군 전체가 보유한 방어막 총량에 비례해 적 전체에게 피해를 입힌다. 방어막은 소모하지 않는다. #특수 #비접촉" }
