    # ── 스카디 ──
    - { id: 283, verbalName: 북방의 수호자, codeName: SkadiNorthernGuardian, description: "고유 중첩을 최대 3개 보관한다. 중첩이 있을 때 적에게 피격되면 1중첩을 소비해 반격을 예약하고, 공격자에게 고정 위력 80 + STR×0.5 피해를 입힌 뒤 얼음 원소를 부착한다. #접촉 #물리 #추가행동 #반격 <고유 패시브> <전수 불가능>" }
    - { id: 284, verbalName: 맹세, codeName: SigurdOath, description: "브륀힐드와 함께 서면 일반행동마다 공명이 1씩 쌓이고, 3에서 다음 일반행동이 협동행동 협공이 된다. 궁극기를 쓰면 공명과 무관하게 협공이 한 번 따라붙는다. 둘이 같은 열이면 협공 위력 ×1.3. 짝이 쓰러지면 복수 상태가 되어 공명이 2씩 쌓이고 죽은 짝의 몫까지 맡되 받는 피해가 25% 증가한다. <고유 패시브> <전수 불가능>" }
    - { id: 285, verbalName: 맹세, codeName: BrynhildOath, description: "시구르드와 함께 서면 일반행동마다 공명이 1씩 쌓이고, 3에서 다음 일반행동이 협동행동 협공이 된다. 궁극기를 쓰면 공명과 무관하게 협공이 한 번 따라붙는다. 둘이 같은 열이면 협공 위력 ×1.3. 짝이 쓰러지면 복수 상태가 되어 공명이 2씩 쌓이고 죽은 짝의 몫까지 맡되 받는 피해가 25% 증가한다. <고유 패시브> <전수 불가능>" }
    - { id: 3001, verbalName: 공허와의 계약, codeName: OdinVoidPact, description: "공격이 적중하면 대상의 받는 치유량이 3턴 동안 40% 감소하고, 가한 피해의 15%를 회복한다. 체력이 3칸으로 나뉘며 두 칸이 깨지면 속성과 모습이 공허로 바뀐다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 3002, verbalName: 후긴과 무닌, codeName: OdinHuginnMuninn, description: "속성이 공허로 바뀐 뒤부터 3턴마다 적 후열에 공허의 괴조를 2마리 세운다. <적 전용>" }
