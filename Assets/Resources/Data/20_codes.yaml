    - id: 204
      verbalName: 사그리다 파밀리아
      codeName: GaudiSagradaFamilia
      description: "<고유 특성> 받는 피해 -15%. 전투 시작 시 아군 전체에게 자신의 방어력180% 보호막. 사망 후 재등장으로 시작 보호막을 다시 지급하지 않는다."
    - id: 368
      verbalName: "테슬라 발전기"
      codeName: NicolTeslaGenerator
      description: "필드에서 아군이 적에게 번개 부착 성공 시 아군 전체에 받는 공격 피해15% 감소1회, 번개가 관여한 반응 성공 시 가하는 공격 피해20% 증가1회. 재부여는 배율 대신 사용 횟수를 누적. 실제 피해1회당1개 소비. 지속·반응·덧붙는·분담 피해 제외. 사망·이탈·전투 종료에 정리."
    - id: 364
      verbalName: "죽음의 개화"
      codeName: NephthysPoisonGarden
      description: "맹독 자연 발동 시 독안 전부 소비, 독안당 특공250% 맹독 파열. 독안은 상한 없는 중립 표식으로 정화·해제 불가. 정산에는 파열하지 않음."
    - id: 365
      verbalName: "사냥독"
      codeName: AtalantePoisonHunt
      description: "특공에 비례해 아군 맹독·출혈 피해35~55% 증폭. 맹독·출혈 자연 발동 후 생존 적에게 공110% 추가행동 추격. 자기 일반행동 사이4회."
    - id: 366
      verbalName: "촉진의 직조"
      codeName: NeithCatalyticWeave
      description: "감전된 적에게 촉진: 특공에 비례해 특수방어력22~32% 감소. 감전/네이트 이탈 시 종료. 풀+번개 과성장과 별개."
    - id: 367
      verbalName: "명계의 양식"
      codeName: EreshkigalUnderworldFeast
      description: "아군이 적에게 지속피해를 주면 전원 자신의 최대체력2% 치유. 실제 행동당3회, 한 원본 틱의 파생 피해는 중복 회복 없음."
    - id: 363
      verbalName: "복은 함께 나누는 거야"
      codeName: EbisuSharedFortune
      description: "다른 아군이 받는 적 피해의 경감 뒤65%를 자신의 체력으로 분담. 재경감·재분담·피격 마나·반격·중첩 중복 발동 없음. 자신이 실제 감당한 만큼만 원 대상 피해 감소. 아군 직접 피격 시 그 대상의 가하는 피해 +2.5% 중첩, 최대12(30%), 대상 일반행동3회 완료까지 성공 갱신. 다단은 대상별 행동당1회. 사망·이탈·전투 종료에 분담과 버프 종료."
    - id: 362
      verbalName: "아직 남아 있어!"
      codeName: AstolfoTravelKit
      description: "자신의 타겟 우선도 -1. 전투 비약 적용 또는 심장 제세동기 발동 시 25% 확률로 소모 대상을 보존. 같은 특성은 중복 판정하지 않으며 식량·넥타르·승급 도구에는 적용하지 않음."
    - id: 240
      verbalName: "해가 높아질수록"
      codeName: AmaterasuRisingSun
      description: "다른 아군의 실제 추가공격이 체력/보호막 피해를 주면 행동당 일광+2, 최대12. 다단·광역도 행동당1회. 일반·특수·초월·지속·반응·덧붙는 피해는 제외. 일광은 마나를 채우지 않으며 사망·전투 종료에 초기화."
    - id: 1050
      verbalName: 군세의 지휘
      codeName: VoidLegionCommand
      description: "자신의 일반행동 완료마다 지휘+1(최대3). 피격/처치로 충전하지 않음. 첫 두 초월기에서 빈 전열 호위 자리만 보충, 최대2기 동시/전투 중 총6기. 살아 있는 호위는 회복/교체하지 않음."
    - id: 323
      verbalName: 사막의 피
      codeName: SetDesertBlood
      description: 출혈 적에게 받는 피해10% 감소. 적 직접 공격의 체력/보호막 피격에 단일 반격(공70%), 출혈 부여 시도, 실제 피해가 있으면 최대체력3% 흡혈. 자기 일반행동 사이2회. 다단은1행동, 지속/반응/자해/반격 제외. 제어 중 반격 불가.
    - id: 325
      verbalName: 세 겹의 수호
      codeName: IsisThreefoldGuard
      description: 피격 불가 수호령3기. 서로 다른 고정 기초속도60/80/100, 각 일반공격은 이시스 방어력60% 피해와 바위 부착 시도. 치명/효과 명중은 이시스 스탯. 초기 생성하고 손실은 자기 일반 완료 때 보충. 토트의 소환 보유자 판정은1명.
    - id: 320
      verbalName: 태양의 후계자
      codeName: HorusRoyalHeir
      description: 편성상 앞선 마나형 공격 초월기 아군1명 지정(자신 제외, 사망/이탈 시 교체). 필드에 있는 동안 대상 초월기 피해+(25%+특공/K×15%p), 최대55%. 일반/지속/특수 피해에는 적용하지 않음.

    - id: 210
      verbalName: 언어의 창조자
      codeName: ShakespeareLanguage
      description: 전투 시작 언어2, 최대12. 아군 실제 소환수 생성·소멸 및 소환수 취급 유닛의 실제 행동 종료마다 언어1. 소환 공격 묶음당 언어2를 소비해 확정 치명타, 기존 치확을 치피로 전환. 다단·광역 재소비 없음.
    - id: 324
      verbalName: 살아 있는 기록
      codeName: ThothLivingRecords
      description: 필드에서 소환수를 현재 보유한 아군 본체1명당 소환 피해+(6%+특공/K×4%p), 명당 최대12%, 총 최대45%. 같은 소환자는1명, 피그말리온도1명. 서기관이 있으면 아군·소환수가 받는 피해24% 감소.

    - id: 222
      verbalName: 시리우스
      codeName: OrionSirius
      description: '적의 직접 공격으로 체력 또는 보호막이 감소하면 행동당 시리우스1(최대5). 5개 소비: 적 전체 공격력160%+자신 최대체력4% 화살비(추가행동·반격), 발사 후 최대체력5% 치유. 지속·반사·자해 제외. 제어 중 보관.'
    - id: 283
      verbalName: 혹한의 외투
      codeName: SkadiFrostMantle
      description: 전투 시작 및 자신의 일반행동 완료 시 자신에게 방어력60% 보호막(누적). 출처와 무관하게 보호막을 보유한 동안 공격력+15%(중복 없음). 반격·도발 없음.
    - id: 400
      verbalName: "왕실의 구매권"
      codeName: MansaRoyalWarrant
      description: "전투 시작 시 필드에 있으면 승리 전투 골드+25%. 무료 보상1장 선택 후 남은 카드 최대2장을 상점 가격으로 구매. 일반행동은 방어력80% 전체 보호막을 위해 재보1 소비."
    - id: 420
      verbalName: "황금 탄창"
      codeName: IshtarGoldenMagazine
      description: "자신이 재보1을 실제 소비할 때마다 초월기 피해+4%p. 최대12중첩, 현재 탄부터 적용. 재소비로 갱신하고 다음 자기 일반행동 종료 시 모두 만료. 예약·반환·다른 아군 소비는 제외."
    - id: 281
      verbalName: "재 속에 남긴 온기"
      codeName: SurtrLastEmber
      description: "적에게 직접 공격으로 실제 피해를 주면 필드 아군 전원에게 현재 방어력 12% 보호막. 광역·다타수도 실제 행동당 한 번. 보호막은 누적되며 보호막 보너스만 추가 적용. 지속피해·원소 반응·자해에는 발동하지 않는다."
    - id: 282
      verbalName: "다시 일어날 수 있도록"
      codeName: FreyaGentleHands
      description: "아군의 특수행동·추가행동·초월기가 끝나면 그 행동자를 프레이아 최대 체력 2%만큼 치유. 일반행동·소환수·자신의 긴급 치유 제외. 실제 회복분만 온기에 저장."
    - id: 263
      verbalName: 데바의 왕
      codeName: IndraDevaKing
      description: "<고유 특성> 전투 시작 시 자신의 마나를 최소40%로 준비합니다(더 높은 마나는 유지). 필드에 있는 동안 아군 전원의 특수행동 피해 +25%. 다른 아군이 특수행동을 마칠 때마다 인드라 마나 +10."
    - id: 264
      verbalName: 바람이 남긴 길
      codeName: VayuTailwind
      description: "<고유 특성> 바유 자신의 확산이 불 · 물 · 풀 · 번개 · 얼음 · 바위를 퍼뜨리면, 원래 대상과 실제로 전달받은 적에게 그 원소의 취약을 2턴간 남긴다 — 그 원소 속성 유닛의 직접 공격에 받는 피해 +15%. 공격이 원소를 붙일 필요는 없고, 지속피해 · 원소 반응 · 덧붙는 피해는 받지 않는다. 다른 원소의 취약은 공존하며 같은 원소는 높은 하나만 적용한다."
    - id: 262
      verbalName: 끝까지 태워 주지
      codeName: AgniBurnToTheEnd
      description: "<고유 특성> 다른 필드 아군(소환수 제외)이 초월기를 실제로 마칠 때마다 추가행동으로 적 전체에 공격력 120% 피해를 주고, 적마다 피해 직후 불을 부착한다. 같은 아군에게서는 아그니의 일반행동 사이에 한 번만 받는다. 판돈(초월기) 동안에는 궁극기 피해 · 치명 판정도 함께 받는다. #전체 #추가행동 #비접촉 #주문"
    - id: 267
      verbalName: 황혼의 집행자
      codeName: SuryaExecution
      description: "일반 사격이 대상에게 종언 표식을 1중첩 부여한다(최대 2). 2중첩인 적에게 다음 일반 사격은 종언탄으로 바뀐다. 표식은 효과 명중 판정, 대상별 관리, 라운드 종료 시 제거."
    - id: 261
      verbalName: 죽음의 선고
      codeName: YamaDeathVerdict
      description: "<고유 특성> 야마가 살아서 전장에 있는 동안, 감전 상태의 적에게 선고(해로운 상태)를 내린다 — 야마의 아군에게 받는 모든 피해 +30%. 감전의 출처 · 개수와 무관하게 선고는 하나이며, 마지막 감전이 사라지면 함께 사라진다. 효과 명중 · 상태 저항 판정은 없고, 감전이 남아 있으면 선고만 지워도 다시 붙는다."
    - id: 266
      verbalName: 법이 만든 제방
      codeName: VarunaLawLevee
      description: "<고유 특성> 자신의 행동으로 적에게 물을 부착하면 현재 방어력 70%의 보호막을 자신에게 얻는다. 광역 · 확산으로 여러 명에게 붙어도 행동당 한 번이며, 기존 보호막에 누적된다. 물 부착이 없는 특수행동에서는 발동하지 않는다."
    - id: 265
      verbalName: "재보천의 후원"
      codeName: KuberaPatronage
      description: "아군 필드 오라. 재보를 실제 충전·소비한 공격에 쿠베라 자신의 치명타 피해 30%만큼 치피 가산. 중복은 높은 하나. 소환 시너지 없음."
    - id: 321
      verbalName: 영혼 수확
      codeName: AnubisSoulHarvest
      description: "<고유 특성> 살아서 필드에 있는 동안 유닛이 쓰러지면 영혼을 영구히 거둔다(일반 적 1 · 정예 2 · 보스 3 · 아군 1 · 소환수 0.25). 영혼 1당 최대 체력 +8, 방어력 · 특수방어력 +0.4. 영혼 50: 피격 마나 2배 · 150: 사자의 서 4턴 · 200: 전투 시작 시 방어력 270% 보호막."
    - id: 380
      verbalName: 도사란 무엇인가
      codeName: UchiTaoist
      description: "<고유 특성> 분신을 최대 3기 거느린다. 분신은 고정 속도 105으로 제 차례에 우치 공격력 210%로 한 번 치고 사라진다. 상한에서 새 분신이 생기면 가장 오래된 분신이 즉시 105%로 치고 사라진다. 우치가 최대 체력 15% 이상인 한 방을 맞으면 분신 1기가 대신 맞고 사라진다(한 적 행동당 1기)."
    - id: 201
      verbalName: 빅뱅
      codeName: SeiBigBang
      description: "<고유 특성> 고유 중첩 '창세의 결정'을 가진다. 필드 위에 보호막을 두른 아군이 공격을 받을 때마다 1중첩을 얻는다. 창세의 결정이 7개 모이면 무작위 적에게 방어력의 25%에 해당하는 작은 바위 조각 7개를 발사한다. 이 공격은 대상 우선도를 무시한다. <추가> 이후 아군 전체에게 125 + 방어력의 7.5%에 해당하는 보호막을 부여한다. #다중 #특성 #비접촉"
    - id: 202
      verbalName: 멸망의 시
      codeName: ShiFinalVerse
      description: "<고유 특성> 다른 아군의 공격 직후 멸참의 공격력 300% 피해가 대상의 방어력과 현재 체력만으로 처치에 충분한 적이 있으면, 가장 현재 체력이 낮은 적에게 멸참을 특수행동으로 사용한다. 처형 예측은 치명타·보호막·피해 증감·원소 반응·추가 피해를 세지 않는다."
    - id: 203
      verbalName: 빈틈 포착
      codeName: SabahDebuffHunter
      description: "<고유 특성> 공격 대상의 디버프(지속피해 포함) 1개당 가하는 피해가 4% 증가한다. 아군이 적에게 해로운 상태를 부여·갱신하거나, 아군이 건 지속피해가 적에게 피해를 줄 때마다 아즈라엘 1중첩을 얻는다."
    - id: 207
      verbalName: 철권제재
      codeName: JeanIronSanction
      description: "<고유 특성> 전투 시작 시 철권제재 기회를 기본 횟수만큼 얻고, 일반행동을 해결할 때마다 현재 최대치까지 회복한다. 적의 직접 공격 최종 대상에 잔이 포함되면 기회 1회를 소모해 그 공격자에게 공격력160% 반격을 먼저 사용하고 얼음 부착을 시도한다(공통 효과 명중/저항). 이 피해는 일반공격·추가공격·반격으로 함께 판정한다. 지속피해·원소 반응·특성 간접 피해·덧붙는 피해에는 발동하지 않는다. #단일 #일반 #추가행동 #반격 #접촉 #물리"
    - id: 220
      verbalName: 갈라테아
      codeName: PygmalionGalatea
      description: "<고유 특성> 피그말리온은 소환수로도 간주된다. 피그말리온이 필드에 있는 동안 모든 아군이 가하는 피해가 15% 증가하며, 소환수는 대신 30% 증가한다."
    - id: 244
      verbalName: 맹화
      codeName: HimikoBlaze
      description: "<고유 특성> 한 대상에게 여러 번 쌓이는 중립 표식 맹화를 부여한다. 3중첩이 되면 표식을 모두 지우고 2턴 동안 받는 피해 +15% 디버프 하나와 히미코 특수공격력 100%의 고정 피해를 준다. 행동을 빼앗지는 않지만 제어를 받은 것으로 간주해 집중을 끊는다."
    - id: 260
      verbalName: 니샤카라
      codeName: ChandraNishakara
      description: "<고유 특성> 고유 중첩 '월광'을 가진다. 전투 시작 시 월광 1중첩을 얻는다. 피해로 체력이 최대 체력의 30% 이하가 되면 월광 1중첩을 소모하고 최대 체력의 50%만큼 즉시 회복한다. 치명상이면 사망 판정 전에 발동한다. 달빛 순환 — 필드에 있는 동안 아군이 특수행동을 마칠 때마다 그 아군이 찬드라 최대 체력의 4%를 회복한다(같은 아군은 자기 턴 사이 1회)."
    - id: 322
      verbalName: 든든한 경호대가 있다고!
      codeName: BastetReliableGuard
      description: "<고유 특성> 바스테트가 직접 공격의 대상이 되고 그 공격의 확정 대상 목록에 다른 경호 자격자가 없으면, 필드의 견고 또는 반격 아군 한 명이 대신 대상이 된다. 반격 보유 여부 → 타겟 우선도 → 전열 → 남은 체력 비율 → 낮은 ID 순으로 고른다. 특성이 직접 가하는 간접 공격은 경호하지 않으며 추가행동 같은 행동 공격은 경호한다."

