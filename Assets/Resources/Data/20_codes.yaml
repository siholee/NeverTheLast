    - id: 241
      verbalName: 달의 인력
      codeName: TsukuyomiMoonPull
      description: "필드에 있는 동안 아군 전체가 적에게 주는 피해가 그 적의 해로운 상태 1개당 [3/4/5]% 증가한다(최대 5개). 같은 상태의 중첩은 1개로 센다. <고유 패시브> <전수 불가능>"
    - id: 114
      verbalName: 월식 정산
      codeName: TsukuyomiMoonReckoning
      description: "필드에 있는 동안 지속피해 상태의 적이 처치되면 1턴간 받을 지속피해의 75%를 주변 3×3에 범위 피해로 입힌다. <전수 불가능>"
    - id: 33
      verbalName: 주문 보호막
      codeName: TsukuyomiSpellShield
      description: "4턴마다 공격 1회를 무효화하는 INT 50%의 보호막을 획득한다. 보호막이 남아 있는 동안에는 주기를 세지 않는다."
    - id: 34
      verbalName: 변덕쟁이
      codeName: TsukuyomiFickle
      description: "턴마다 서로 다른 기본 스탯 하나가 10% 상승하고 하나가 10% 하락한다."
    - id: 1016
      verbalName: 저주
      codeName: CursePassive
      description: "자신이 부여하는 지속피해량이 20% 증가한다. 죽음의 계약(261)의 일반 등급이며 함께 들면 발동하지 않는다."
    - id: 35
      verbalName: 상처 벌리기
      codeName: TsukuyomiWidenWound
      description: "지속피해 디버프를 가진 유닛을 공격할 때 방어력 45%를 무시하고 3턴간 받는 치유량을 50% 감소시킨다. 다른 치유량 감소와 중첩되지 않으며 더 긴 남은 지속시간만 유지한다."
    - id: 36
      verbalName: 고통스러운 상처
      codeName: TsukuyomiPainfulWound
      description: "지속피해 디버프를 가진 최대 체력이 아닌 유닛을 공격하면 3턴간 받는 치유량을 50% 감소시킨다."
    - id: 37
      verbalName: 순환
      codeName: TsukuyomiCycle
      description: "같은 진영의 유닛이 사망하면 무작위 생존 아군 하나가 주는 피해 25% 증가, 받는 피해 25% 감소를 얻는다."
    - id: 184
      verbalName: 체인 라이트닝
      codeName: TsukuyomiChainLightning
      description: "4번째 일반행동 적중 후 대상에게 번개 원소를 부여하고 주변 3명에게 일반행동 피해의 50%를 입힌다."
    - id: 38
      verbalName: 만월
      codeName: TsukuyomiFullMoon
      description: "일본 테마 또는 밤 필드에서 주는 피해 50% 증가, 받는 피해 50% 감소. <전수 불가능>"
    - id: 280
      verbalName: 황혼
      codeName: SurtrTwilight
      description: "일반행동이나 궁극기로 적에게 피해를 주면 맞힌 적 하나마다 STR×5의 보호막을 얻는다. 한 행동에서 같은 적은 한 번만 세며 보호막 누적 상한은 없다. <고유 패시브> <전수 불가능>"
    - { id: 39, verbalName: 거인, codeName: GiantPassive, description: "STR +5%." }
    - { id: 40, verbalName: 천상의 신체, codeName: SurtrCelestialBody, description: "받는 치유와 보호막 효과가 25% 증가한다." }
    - { id: 41, verbalName: 투사, codeName: LifestealFighter, description: "가한 피해의 8%만큼 체력을 회복한다." }
    - { id: 42, verbalName: 클러치 플레이어, codeName: SurtrClutchPlayer, description: "잃은 체력 비율의 50%만큼 주는 피해가 증가한다." }
    - { id: 43, verbalName: 신살자, codeName: SurtrGodslayer, description: "최대 체력이 자신의 150% 이상인 적에게 주는 피해가 25% 증가한다." }
    # 콜로세움 일반 병종은 109~112 공통 적 패시브를 사용한다.
    - { id: 1100, verbalName: 챔피언의 여유, codeName: ColosseumPassive164, description: "체력이 절반 이상이면 받는 피해가 감소하고, 절반 미만이면 주는 피해가 증가한다. <전수 불가능>" }
    - { id: 1101, verbalName: 세 번의 승부, codeName: ColosseumPassive165, description: "일반행동이 방패 가격, 대검 내려치기, 회전 베기 순서로 변화한다. <전수 불가능>" }
    - { id: 1102, verbalName: 월계관의 정화, codeName: ColosseumPassive166, description: "궁극기 사용 시 해로운 효과 하나를 제거한다. <전수 불가능>" }
    - { id: 1103, verbalName: 결승의 투지, codeName: ColosseumPassive167, description: "체력이 절반 미만이면 주는 피해와 행동 속도가 증가한다. <전수 불가능>" }
    - { id: 1104, verbalName: 사냥꾼의 표식, codeName: ColosseumPassive168, description: "최대 체력이 가장 높은 적에게 표식을 부여하여 받는 피해를 20% 증가시킨다. <전수 불가능>" }
    - { id: 1105, verbalName: 채찍 견제, codeName: ColosseumPassive169, description: "일반행동으로 때린 적이 주는 피해를 3턴간 20% 감소시킨다. <전수 불가능>" }
    - { id: 1106, verbalName: 집중 사냥, codeName: ColosseumPassive170, description: "궁극기 사용 시 아군이 표식 대상에게 주는 피해가 증가한다. <전수 불가능>" }
    - { id: 1107, verbalName: 다음 사냥감, codeName: ColosseumPassive171, description: "표식 대상이 사망하면 새로운 대상에게 표식을 옮긴다. <전수 불가능>" }
    - { id: 1112, verbalName: 몸이 풀리는군, codeName: ColosseumPassive176, description: "공격하거나 피해를 받을 때 행동 속도가 증가한다. 최대 5중첩. <전수 불가능>" }
    - { id: 1113, verbalName: 노련한 검투사, codeName: ColosseumPassive177, description: "전투당 처음 받는 제어 효과를 무효화한다. <전수 불가능>" }
    - { id: 1114, verbalName: 목숨값, codeName: ColosseumPassive178, description: "체력이 40% 미만이면 받는 피해가 30% 감소하고 피해의 20%를 회복한다. <전수 불가능>" }
    - { id: 1115, verbalName: 다시 한 판, codeName: ColosseumPassive179, description: "전투당 한 번 치명 피해를 버티고 최대 체력의 30%를 회복하며 궁극기를 준비한다. <전수 불가능>" }
    - { id: 201, verbalName: 빅뱅, codeName: SeiBigBang, description: "<고유 패시브> <전수 불가> 우주의 파편을 최대 10개 모은다(자기 턴마다, 보호막을 두른 아군이나 자신이 적에게 공격받을 때마다 1개). 7개가 모이면 소모해 무작위 적에게 고정 위력 60 + INT×0.5의 투사체 7발을 쏘고, 아군 전체에 150 + STR×10의 보호막을 씌운다. #특수 #비접촉 #추가행동" }
    - { id: 204, verbalName: 사그리다 파밀리아, codeName: GaudiSagradaFamilia, description: "<고유 패시브> <전수 불가> 일반행동이 적중할 때 스택 +1(최대 6). 자신 또는 적중 대상에게 바위 원소가 부착되어 있으면 +2. 6스택을 소비해 다음 일반행동을 강화하며, 대체행동은 스택을 획득하지 않는다." }
    - { id: 207, verbalName: 최고의 방어, codeName: JeanBestDefense, description: "<고유 패시브> <전수 불가> 고유 중첩 3으로 전투를 시작한다. 적의 행동 대상으로 지정되면 중첩 1을 소모하고 상대의 행동보다 먼저 대체행동 철권제재(STR 기반 위력 80)를 꽂는다. #반격 #추가행동 #물리 #접촉" }
    - { id: 104, verbalName: 오사방지, codeName: JeanMisfireGuard, description: "아군이 아군에게 만드는 해로운 원소 반응(제어·즉발·지속피해·디버프)이 일어나지 않는다. 적이 건 반응은 막지 않는다." }
    - { id: 105, verbalName: 피지컬 코치, codeName: JeanPhysicalCoach, description: "서포트 카드로서 어느 훈련에 배치되든 그 훈련의 STR 상승량 +10%." }
    - { id: 106, verbalName: 벌크업, codeName: JeanBulkUp, description: "전투 시작 후 첫 일반행동이 대체행동 벌크업으로 바뀐다. 벌크업은 자신의 STR을 10% 올리며 중첩된다." }
    - { id: 107, verbalName: 기수, codeName: JeanStandardbearer, description: "우선도 +1을 상시로 유지한다. 사실상 꺼지지 않는 도발이다." }
    - { id: 206, verbalName: 일렉트릭 필드, codeName: NicoleElectricField, description: "<고유 패시브> <전수 불가> <버프> 필드에 있는 동안 번개 속성이거나 번개 원소를 두른 아군이 가하는 피해 +20%. 또한 아군은 각자 5회 행동할 때마다 번개 원소를 부착한다. 행동은 턴과 달리 일반행동·궁극기·추가행동을 모두 센다." }
    - { id: 205, verbalName: 위대한 비행, codeName: LightGreatFlight, description: "<고유 패시브> <전수 불가> 필드의 아군이 발동형 궁극기를 사용하면 고유 스택 +1(최대 12). 하늘을 나는 꿈 사용 시 3스택 이상이면 3을 소비하여 원소 제거와 함께 모든 해로운 상태도 제거한다." }
    - { id: 7, verbalName: 사전준비, codeName: SeiPreparation, description: "전투 시작 시 궁극기 충전량이 100%가 된다. 마나를 쓰지 않는 특수 궁극기 보유자에게는 효과가 없다." }
    - { id: 8, verbalName: 창세의 노래, codeName: SeiFirstSong, description: "<전수 불가> 전투 중 최초로 궁극기를 발동하면 아군 전체의 궁극기 충전량이 100%가 된다. 특수 궁극기 보유자에게도 적용된다." }

