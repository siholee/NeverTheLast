    - { id: 1760, verbalName: 공허 강하, codeName: SkyVoidDescent, description: "상대 전원에게 고정 120 + STR 위력 90의 피해를 입히고 바람 원소를 부착한 뒤, 살아 있는 결정의 카운트다운을 1씩 당긴다(1 남은 결정은 제외). 입장 후 일반행동 2회 전에는 쓰지 않는다. #특수 #비접촉" }
    - { id: 1770, verbalName: 없음, codeName: SkyInertUltimate, description: "결정에게는 궁극기가 없다." }
