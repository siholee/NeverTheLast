      description: "<집중> <마나 100> 히미코를 기준으로 2턴 동안 적이 행동할 때마다 그 적에게 맹화를 부여한다. 집중이 유지되는 동안 모든 아군은 적 방어력을 20% 무시한다."
    - id: 60
      verbalName: 소마
