    - { id: 61, verbalName: 언젠가 다다를 마지막, codeName: YamaFinalArrival, description: "적 전체를 베어 DEX 기반 위력 80의 피해를 입히고 번개 원소를 부여한다. 이후 대상의 지속피해를 즉시 정산해 (턴당 지속피해 × INT × 0.8%)만큼 추가 피해를 만든다. #특수 #베기 #접촉" }
    - { id: 62, verbalName: 백화, codeName: AgniWhiteFlame, description: "적 전체에게 INT 기반 위력 65의 피해를 입히고 불 원소를 부여한다. #특수 #비접촉" }
    - { id: 63, verbalName: 신들의 왕, codeName: IndraKingOfGods, description: "필드에 있는 모든 로카팔라 아군의 특수행동을 발동시킨다. 피해를 내지 않으며, 같이 나설 로카팔라가 없으면 자원을 태우지 않는다." }
    - { id: 81, verbalName: 풍요의 산물, codeName: FreyaHarvest, description: "적 전체에게 INT×0.6의 피해를 입히고, 쌓인 순수치유량에 비례해 피해가 최대 2배까지 커진다. 적중한 모든 적에게 풀 원소를 부착하고 기록을 비운다. #비접촉 #특수" }
    - { id: 82, verbalName: 발드르의 살해자, codeName: LokiBaldrSlayer, description: "최대 체력이 가장 높은 단일 적에게 고정 위력 92 + STR×0.27의 피해를 입히고 표식을 남긴다. 표식을 가진 적은 받는 치유량 -25%와 방어력 -20%를 얻는다. 표식은 로키가 쓰러지거나 다른 대상에게 다시 새길 때까지 남는다. #비접촉 #물리" }
    - { id: 83, verbalName: 고드름 스파이크, codeName: SkadiIcicleSpike, description: "적 전체에게 고정 위력 80 + CON×0.8의 피해를 입히고 얼음 원소를 부착한다. #물리 #접촉" }
    - { id: 84, verbalName: 파프니르 살해, codeName: SigurdFafnirsBane, description: "단일 적에게 STR 기반 위력 150의 피해를 입히고 대상의 내구를 무시하며 불 원소를 부착한다. 이후 맹세가 협공을 한 번 불러온다. #베기 #접촉 #물리" }
    - { id: 85, verbalName: 선고, codeName: BrynhildVerdict, description: "적 전체에게 DEX 기반 위력 80의 피해를 입히고 얼음 원소를 부착한다. 이후 맹세가 협공을 한 번 불러온다. #찌르기 #비접촉 #물리" }
