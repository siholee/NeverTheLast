    - { id: 1206, verbalName: 기병의 회피, codeName: LegionEquesPassive, description: "접촉 기술을 LUK%의 확률로 회피한다. <적 전용> <전수 불가능>" }
    - { id: 1207, verbalName: 부관의 신호, codeName: LegionOptioPassive, description: "전투 시작 시 CON+STR이 가장 높은 전열 아군을 지정한다. 지정된 아군이 단일 피해를 가하면 같은 대상에게 추가행동으로 일반행동을 넣는다. <적 전용> <전수 불가능>" }
    - { id: 1208, verbalName: 천부장의 신호, codeName: LegionTribunePassive, description: "전투 시작 시 CON+STR이 가장 높은 전열 아군을 지정한다. 지정된 아군이 단일 피해를 가하면 같은 대상에게 추가행동으로 일반행동을 넣는다. <적 전용> <전수 불가능>" }
    - { id: 300, verbalName: 화합, codeName: LegionConcordia, description: "단일 아군에게 이로운 효과를 부여하면 그 아군에게 '화합' 2스택을 준다. 화합 보유자는 가하는 피해 +50%. 자기 턴마다 1스택 감소하고, 새로 부여하면 이전 보유자가 잃는다. <고유 패시브> <전수 불가능>" }
    - { id: 301, verbalName: 천천히 서둘러라, codeName: LegionFestinaLente, description: "별도의 가상 마나 게이지를 가진다. 필드의 아군이 궁극기를 발동할 때마다 5%를 충전하며, 실제 마나와 합쳐 100%가 되면 실제 마나를 즉시 최대치로 만들고 가상 마나를 비운다. 가상 마나는 전투 종료 시 초기화된다. <고유 패시브> <전수 불가능>" }
    - { id: 302, verbalName: "왔노라, 보았노라, 이겼노라", codeName: LegionVeniVidiVici, description: "적을 처치할 때마다 모든 '로마' 아군의 가하는 피해가 10% 증가한다. 상한 없이 중첩된다. <고유 패시브> <전수 불가능>" }
    - { id: 1212, verbalName: 최고의 2인자, codeName: LegionSecondInCommand, description: "필드에 옥타비아가 있으면 일반행동이 무조건 옥타비아를 향하고, 추가로 옥타비아의 행동 게이지를 100% 채운다. <보스 전용> <전수 불가능>" }
    - { id: 1213, verbalName: 팍스 로마나, codeName: LegionPaxRomana, description: "공격이 적중한 대상 수 하나당 궁극기 자원을 최대치의 2% 채운다. <보스 전용> <전수 불가능>" }
    - { id: 1214, verbalName: 갈리아의 정복자, codeName: LegionConquerorOfGaul, description: "자기 전열의 '로마' 아군이 받는 피해가 10% 감소한다. <보스 전용> <전수 불가능>" }
    - { id: 1215, verbalName: 대범한 관용, codeName: LegionClementia, description: "적을 처치하고 자기 전열에 빈 자리가 있으면 센츄리온을 소환한다. <보스 전용> <전수 불가능>" }
    - { id: 1216, verbalName: 위대한 전술가, codeName: LegionGrandTactician, description: "자기 전열의 '로마' 아군이 단일 피해를 가하면 같은 대상에게 추가행동으로 일반행동을 넣는다. <보스 전용> <전수 불가능>" }
    - { id: 1217, verbalName: 독재관, codeName: LegionDictator, description: "궁극기의 지속 턴 수 +1. <보스 전용> <전수 불가능>" }

    # ── 메히코(신규 아즈텍) 전용 패시브 ──
    - { id: 1300, verbalName: 행동불능 추적, codeName: AztecControlledHunter, description: "행동불능 상태의 적에게 가하는 피해 +25%. <정예 재규어 전사의 몽둥이로 획득> <전수 불가능>" }
    - { id: 1301, verbalName: 맹독 추적, codeName: AztecPoisonHunter, description: "맹독 상태의 적에게 가하는 피해 +25%. <정예 독수리 전사의 활로 획득> <전수 불가능>" }
    - { id: 1302, verbalName: 죽음의 제의, codeName: AztecSerpentDeathRite, description: "아군 유닛이 쓰러지면 적 전체에게 위력 100 + INT×1.4의 특수 추가행동을 가한다. #비접촉 #특수 #추가행동 <정예 뱀 사제의 지팡이로 획득>" }
    - { id: 1303, verbalName: 연기 나는 거울의 신, codeName: TezcatlipocaDivineFormation, description: "INT 1당 최대 체력 +1%. 아군 전체가 전열 아군 하나당 받는 피해 20% 감소. 재규어 전사 사망 시 궁극기 스택 +2. <보스 전용>" }
    - { id: 1304, verbalName: 인신공양, codeName: AztecHumanSacrifice, description: "필드 위 적이 쓰러질 때마다 STR +5%. <적 전용>" }
    - { id: 1305, verbalName: 비몽사몽, codeName: AztecDreamlikeResonance, description: "진동 반응 계산에서 자신의 CON을 1.2배로 계산한다. <적 전용>" }
    - { id: 1306, verbalName: 망치 나가신다!, codeName: AztecHammerIncoming, description: "둔기를 장착하고 숙련되어 있으면 공격이 내구 5를 무시한다. <적 전용>" }
    - { id: 1307, verbalName: 원소 친화 - 풀, codeName: AztecDendroAffinity, description: "풀 원소 보유 중 CON +2, 자기 턴마다 최대 체력의 1% 회복. <적 전용>" }
    - { id: 1308, verbalName: 고귀한 몸, codeName: AztecNobleBody, description: "대상 지정 우선도 -1. <적 전용>" }

    # ── 이집트 신규 패시브 ──
    - { id: 320, verbalName: 창공의 매, codeName: HorusSkyFalcon, description: "행동 속도가 1.0으로 고정된다. 고정치를 초과한 행동 속도 1%마다 STR +1. <고유 패시브> <전수 불가능>" }
    - { id: 321, verbalName: 영혼 수확, codeName: AnubisSoulHarvest, description: "필드에서 아군 또는 적이 쓰러질 때마다 전투가 끝나도 유지되는 영혼 1스택을 얻는다. 영혼 4스택마다 STR +1. <고유 패시브> <전수 불가능>" }
    - { id: 322, verbalName: 야수의 시선, codeName: BastetAirborneHunter, description: "필드 위 아군이 추가행동 또는 반격을 할 때마다 스택 +1(최대 100). 최대치에 도달하면 스택을 모두 소비하고 최대 체력이 가장 높은 적에게 스택×LUK 피해를 가한다. #접촉 #물리 #베기 #추가행동 <고유 패시브> <전수 불가능>" }
    - { id: 86, verbalName: 빈틈의 실, codeName: EgyptianPiercingShot, description: "숙련된 활 계통 무기를 장착한 화살 공격이 대상 내구 4를 무시한다." }
    - { id: 87, verbalName: 창지기, codeName: AnubisSpearGuard, description: "숙련된 창 계통 무기를 장착하면 STR +3%." }
    - { id: 88, verbalName: 저승사자, codeName: AnubisReaper, description: "사령 속성 대상에게 주는 피해 +30%." }
    - { id: 89, verbalName: 대도, codeName: BastetMasterThief, description: "메인으로 훈련받을 때 어느 훈련이든 LUK 상승량 +10%(부 스탯 몫 포함)." }
    - { id: 90, verbalName: 가벼운 무장, codeName: BastetLightArmament, description: "의복류 방어구를 착용하면 DEX +5%." }
    - { id: 91, verbalName: 이기적, codeName: BastetSelfish, description: "추가행동으로 가하는 피해 +20%." }
    - { id: 323, verbalName: 사막의 피, codeName: SetBloodOfTheDesert, description: "4턴마다 다음 단일 접촉 피해가 적중하면 STR×0.2의 추가 고정 피해를 주고 최대 체력의 8%를 회복한다. <고유 패시브> <전수 불가능>" }
    - { id: 324, verbalName: 강인도 해석, codeName: ThothToughnessScholar, description: "필드에 있을 경우 아군 전체의 강인도 효율 +25%. <고유 패시브> <전수 불가능>" }
    - { id: 92, verbalName: 환술사, codeName: ThothIllusionist, description: "피해를 가할 때 강인도 효율 +25%." }
    - { id: 93, verbalName: 허허실실, codeName: ThothHiddenTruth, description: "감소시킨 강인도의 10%를 실제 피해로 더한다. 지혜의 눈과 중복 적용된다." }
    - { id: 325, verbalName: 사막의 광휘, codeName: IsisDesertRadiance, description: "이시스가 적에게 바위 원소를 부여하면 사막의 광휘 표식을 남긴다. 표식 대상이 받는 특수 피해 +10%. <고유 패시브> <전수 불가능>" }
    - { id: 94, verbalName: 원소, codeName: IsisElement, description: "효과 미정." }
    - { id: 103, verbalName: 완벽한 재기, codeName: PerfectRecovery, description: "기사회생의 금색 상위 코드. 체력이 30% 미만으로 떨어지면 3턴에 걸쳐 최대 체력을 전부 회복한다. 전투당 1회." }
    - { id: 102, verbalName: 죽은 자의 소생, codeName: AnubisRaiseTheDead, description: "전투가 끝나면 이번 라운드에 쓰러진 아군 하나를 무작위로 되살린다. 아누비스 자신이 쓰러져 있으면 발동하지 않는다." }

    # ── 아스완 패시브 (종말의 사도 · 사령 · 오시리스 · 아문·라) ──
    # 360·361은 같은 코드의 강도 차이다. 파멸의 성기사가 10%, 종말의 성기사가 20%를 쓴다.
    - { id: 1400, verbalName: 화형 심판, codeName: AswanPyreJudgment, description: "불 원소를 보유한 적에게 방어력 10% 무시, 화상 상태의 적에게 방어력 10% 무시(중복 시 최대 20%). <적 전용> <전수 불가능>" }
    - { id: 1401, verbalName: 화형 심판, codeName: AswanPyreJudgment, description: "불 원소를 보유한 적에게 방어력 20% 무시, 화상 상태의 적에게 방어력 20% 무시(중복 시 최대 40%). <적 전용> <전수 불가능>" }
    - { id: 1402, verbalName: 화형 선고, codeName: AswanPyreSentence, description: "필드에 있는 동안 아군이 부여하는 불 원소가 지속피해 '화상'을 함께 건다. 불 원소는 소모되지 않는다. <적 전용> <전수 불가능>" }
    - { id: 1403, verbalName: 명계의 재림, codeName: AswanNetherReturn, description: "치명적인 피해를 입으면 전투당 1회에 한해 다음 자기 턴에 부활한다. 부활 시 해로운 상태를 모두 잃고 체력이 가득 찬다. <적 전용> <전수 불가능>" }
    - { id: 1404, verbalName: 불완전한 부활, codeName: OsirisImperfectResurrection, description: "최대 체력이 14배가 되고 받는 피해가 2.4배에서 시작한다. 부위(체력 1/14)가 깨질 때마다 받는 피해가 10%p 줄고 사령 3기가 소환된다. <적 전용> <전수 불가능>" }
    - { id: 1405, verbalName: 승천, codeName: AmunRaAscension, description: "적을 공격한 행동마다 '승천' 1스택을 얻고 피해를 받으면 1스택을 잃는다. 스택 하나당 치명타 피해 +5%, 가하는 피해 +5%. <적 전용> <전수 불가능>" }
    - { id: 1406, verbalName: 성스러운 칼날, codeName: AswanHolyBlade, description: "'베기' 태그 공격의 치명타 피해 +25%." }
    - { id: 1407, verbalName: 까칠한 피부, codeName: AswanCoarseSkin, description: "'접촉' 태그의 공격을 받으면 방어력으로 감소시킨 피해량의 50%를 공격자에게 되돌려준다. #물리 #접촉" }
    - { id: 1408, verbalName: 초월, codeName: AmunRaTranscendence, description: "전투를 8턴 치르면 최대 체력이 20% 증가하고 증가량만큼 회복한다." }
    - { id: 1409, verbalName: 영혼 흡수, codeName: AmunRaSoulDrain, description: "적을 처치하면 최대 체력의 20%만큼 회복한다." }
    - { id: 1410, verbalName: 지옥불, codeName: AmunRaHellfire, description: "대체행동을 사용한 이후 '승천' 스택 수만큼 무작위 단일 적에게 칼날을 추가로 발사한다." }
    - { id: 1411, verbalName: 죽음의 성가, codeName: AswanDeathChant, description: "필드의 사령 아군 하나당 아군 전체의 가하는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }

