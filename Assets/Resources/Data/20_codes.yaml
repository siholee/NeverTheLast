    - { id: 203, verbalName: 빈틈 포착, codeName: SabahDebuffHunter, description: "공격 시 대상의 디버프 1개당 가하는 피해 +4%. 지속피해도 디버프로 센다. 아군이 적에게 디버프를 부여하거나, 아군이 건 지속피해가 적에게 피해를 입힐 때마다 아즈라엘 스택 +1. <고유> <전수 불가능>" }
    - { id: 226, verbalName: 무모한 도전, codeName: IcariaRecklessChallenge, description: "공격으로 체력을 소모하면 실제 최대 체력 소모 비율만큼 해당 공격 피해가 증가한다. 공격 체력 소모량은 2배가 된다. <고유> <전수 불가능>" }
    - { id: 96, verbalName: 정신력, codeName: IcariaMentalStrength, description: "해로운 상태가 적용될 때 10% 확률로 저항한다." }
    - { id: 97, verbalName: 원소 친화 - 불, codeName: IcariaPyroAffinity, description: "불 원소를 보유한 채 공격하면 최대 체력의 5%를 소모하고(부족하면 체력 1까지 소모) 가하는 피해가 20% 증가한다." }
    - { id: 98, verbalName: 암살자, codeName: SabahAssassin, description: "100%를 초과한 치명타 확률을 1:1로 치명타 피해로 전환한다." }
    - { id: 360, verbalName: 혁명의 장교, codeName: MarieCriticalCommand, description: "필드에 있는 동안 모든 아군의 #화살 공격이 치명타일 때 치명타 피해가 마리의 LUK%만큼 증가한다. <고유> <전수 불가능>" }
    - { id: 99, verbalName: 고귀한 혈통, codeName: MarieNobleBloodline, description: "LUK +5%." }
    - { id: 100, verbalName: 장교, codeName: MarieOfficer, description: "서포트 카드로서 어느 훈련에 배치되든 그 훈련의 DEX 상승량 +10%(부 스탯 몫 포함)." }
    - { id: 101, verbalName: 개선문, codeName: MarieArcDeTriomphe, description: "전투 시작 시 발동하는 패시브 코드가 3개 이상이면 아군 전체에게 4턴간 치명타 확률 +100%." }
    - { id: 132, verbalName: 보살핌, codeName: MarieCaring, description: "서포트 카드로서 배치된 훈련의 기본 체력 소모량 -20%. 회복형 훈련과 실패 추가 소모에는 적용하지 않는다." }

    # ── 노르드 적 (1600 광전사 · 1610 볼바) ──
    - { id: 1600, verbalName: 광전사의 격노, codeName: BerserkerRage, description: "잃은 체력에 비례해 DEX와 흡혈률이 증가한다. 흡혈은 잃은 체력 10%p마다 남은 비흡혈분의 4%를 가져가는 곱연산이라 쌓을수록 효율이 줄어든다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1601, verbalName: 설인, codeName: BerserkerYeti, description: "눈 필드에 있는 동안 DEX가 2배가 된다. <적 전용>" }
    - { id: 1602, verbalName: 최후의 발악, codeName: BerserkerLastGasp, description: "클러치 플레이어(42)의 금색 상위 코드. 잃은 체력 비율의 80%만큼 주는 피해가 증가한다. <적 전용>" }
    - { id: 1610, verbalName: 스팀팩, codeName: VolvaStimpack, description: "아군을 치유하면 대상이 1턴 동안 볼바 INT의 30%만큼 DEX를 얻는다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1611, verbalName: 눈바라기, codeName: VolvaSnowcaller, description: "전투 시작 시 전장을 3턴 동안 눈으로 덮는다. 눈에서는 얼음이 세지고 불·풀이 약해진다. <적 전용>" }
    - { id: 1612, verbalName: 민간요법, codeName: VolvaFolkRemedy, description: "치유할 때 대상의 해로운 상태를 최대 2개까지 정화한다. 상위는 완벽한 치료(1614). <적 전용>" }
    - { id: 1613, verbalName: 혹한의 사제, codeName: VolvaFrostPriest, description: "눈 필드에 있는 동안 부여하는 치유량이 50% 증가한다. <적 전용>" }
    - { id: 1614, verbalName: 완벽한 치료, codeName: VolvaPerfectCure, description: "민간요법(1612)의 금색 상위 코드. 치유할 때 대상의 해로운 상태를 모두 정화한다. <적 전용>" }
    - { id: 413, verbalName: 숙련된 의자, codeName: SkilledChairItemPassive, description: "자신이 아닌 아군을 치유할 때마다 CON이 1씩 증가한다." }
    - { id: 1620, verbalName: 뇌신의 박자, codeName: ThorMjolnirRhythm, description: "일반행동을 2회 하면 다음 일반행동이 대체행동으로 바뀐다. 대체행동이 나갈 때마다 STR과 CON이 3씩 영구히 증가한다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1621, verbalName: 노르드의 왕자, codeName: ThorPrinceOfNord, description: "체력 칸이 처음 깨질 때 전장을 3턴 동안 눈으로 덮는다. <적 전용>" }
    - { id: 1622, verbalName: 승승장구, codeName: ThorMomentum, description: "적 처치 시 물리 태그로 가하는 피해 +5%. 중첩된다. 자기과신(66)의 물리 짝이다. <적 전용>" }
    - { id: 1623, verbalName: 겨울바람, codeName: ThorWinterWind, description: "눈 필드에 있는 동안 2턴마다 전장의 모든 유닛에게 CON 위력 40의 피해를 주고 얼음 원소를 부착한다. 적아를 가리지 않는다. <적 전용>" }
    - { id: 414, verbalName: 혹한의 갑주, codeName: FrostplateArmorItemPassive, description: "전장 상태가 주는 불리한 배율을 받지 않는다. 유리한 배율은 그대로 받는다." }
    - { id: 415, verbalName: 묠니르, codeName: MjolnirItemPassive, description: "번개 원소를 부여하는 공격이 확정 치명타가 되고, 대상의 방어력을 2턴간 20% 감소시킨다." }
    - { id: 1630, verbalName: 전장의 선택자, codeName: ValkyrieChooser, description: "필드의 노르드 아군 하나당 STR +3%, 신성 아군 하나당 LUK +3%. 자기 자신도 센다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1631, verbalName: 승전보, codeName: ValkyrieVictorySong, description: "적을 처치하면 최대 체력의 100%, 처치에 관여하면 50%를 회복한다. <적 전용>" }
    - { id: 416, verbalName: 칼춤, codeName: SwordDanceItemPassive, description: "치명타 확률이 15%p 증가한다." }
    - { id: 417, verbalName: 서리꾼의 장화, codeName: SnowTreaderItemPassive, description: "둔화에 걸리지 않는다." }
    - { id: 418, verbalName: 살점 뜯개, codeName: FleshRipperItemPassive, description: "처형선이 4%p 증가한다. 덮어쓰지 않고 더해지므로 천살성(8%)이면 12%, 당연한 운명(12%)이면 16%가 된다." }
    - { id: 419, verbalName: 서리 비늘 갑주, codeName: FrostscaleMailItemPassive, description: "얼음 원소가 부착된 동안 받는 물리 피해가 15% 감소한다. 속성이 아니라 부착이 조건이다." }
    - { id: 420, verbalName: 타르에 절인 털가죽 바지, codeName: LodbrokItemPassive, description: "지속피해로 받는 피해가 10% 감소하고, 받는 치유량 감소의 폭이 절반이 된다." }
    - { id: 421, verbalName: 크러셔의 팔, codeName: CrusherArmItemPassive, description: "단일 대상 공격의 피해가 15% 증가한다. 광역 공격에는 적용되지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 422, verbalName: 탈피한 비늘, codeName: ShedScaleItemPassive, description: "한 번에 받는 피해가 최대 체력의 40%를 넘지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 423, verbalName: 여덟 갈래 고리, codeName: EightfoldRingItemPassive, description: "자신이 부착하는 원소의 지속이 1턴 늘어난다. <장비 전용> <전수 불가능>" }
    - { id: 424, verbalName: 그람, codeName: GramItemPassive, description: "베기 분류 공격이 대상의 내구를 무시한다. <장비 전용> <전수 불가능>" }
    - { id: 425, verbalName: 파프니르의 피, codeName: FafnirsBloodItemPassive, description: "받는 물리 피해가 20% 감소한다. 단 한 번에 최대 체력의 20% 이상을 받으면 적용되지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 426, verbalName: 바프르로기, codeName: VafrlogiItemPassive, description: "궁극기를 사용하면 2턴 동안 받는 피해가 30% 감소한다. <장비 전용> <전수 불가능>" }
    - { id: 427, verbalName: 궁니르, codeName: GungnirItemPassive, description: "자신의 공격은 회피되지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 428, verbalName: 봉인된 카노푸스, codeName: CanopicJarItemPassive, description: "자신이 부여하는 지속피해가 25% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 429, verbalName: 재의 코페쉬, codeName: AshenKhopeshItemPassive, description: "불 원소가 부착된 적에게 주는 피해가 25% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 430, verbalName: 사령의 각반, codeName: WraithGreavesItemPassive, description: "전투당 1회, 치명 피해를 막고 최대 체력의 30%로 일어선다. <장비 전용> <전수 불가능>" }
    - { id: 432, verbalName: 무뎌진 결정, codeName: DulledCrystalItemPassive, description: "일으키는 해로운 원소 반응(제어·즉발·지속피해·디버프·증폭)의 위력이 50% 감소하고, 빙결·진동 기절·화상이 1턴으로 끝난다. 버프 반응은 그대로다. <적 전용 장비> <전수 불가능>" }
    - { id: 433, verbalName: 풀베기, codeName: KusanagiItemPassive, description: "에어본 상태의 적에게 피해를 주면 대상 주변 3×3의 다른 적에게 그 피해의 40%를 준다. 번진 피해는 다시 번지지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 434, verbalName: 취한 뱀 베기, codeName: TotsukaItemPassive, description: "행동불능(기절·빙결·에어본) 상태의 적에게 주는 피해가 25% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 435, verbalName: 창세의 휘저음, codeName: AmenonuhokoItemPassive, description: "적에게 거는 해로운 상태의 지속시간이 1턴 증가한다. 행동불능(빙결·기절·에어본)은 늘어나지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 436, verbalName: 맑은 달거울, codeName: MasumiMirrorItemPassive, description: "지속피해 상태의 적에게 주는 피해가 20% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 437, verbalName: 점술반, codeName: ShikibanItemPassive, description: "새 행동불능을 실제로 걸 때마다 마나를 15 회복한다(행동당 1회). 제어 분쇄로 무효가 된 시도는 세지 않는다. <장비 전용> <전수 불가능>" }
    - { id: 438, verbalName: 고치 실, codeName: CocoonThreadItemPassive, description: "같은 대상을 연달아 공격하면 두 번째 타격부터 피해가 15% 증가한다. 대상을 바꾸면 끊긴다. <장비 전용> <전수 불가능>" }
    - { id: 439, verbalName: 불씨 인분, codeName: EmberScaleItemPassive, description: "일반행동 적중 시 25% 확률로 화상 1턴을 시도한다(CON 대결). <장비 전용> <전수 불가능>" }
    - { id: 440, verbalName: 포식자의 깃털, codeName: PredatorCloakItemPassive, description: "타격이 횟수제 무적에 막힐 때마다 DEX가 3% 증가한다(최대 5중첩, 전투 끝까지). <장비 전용> <전수 불가능>" }
    - { id: 441, verbalName: 상어 이빨, codeName: SharkToothItemPassive, description: "보호막을 가진 적에게 주는 피해가 20% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 443, verbalName: 식어 가는 불씨, codeName: DyingEmbersItemPassive, description: "궁극기 피해와 주는 치유가 50% 감소한다. 일으키는 해로운 원소 반응의 위력이 50% 감소하고 화상은 1턴으로 끝난다. <적 전용 장비> <전수 불가능>" }
    - { id: 444, verbalName: 금 간 생명의 앙크, codeName: FracturedAnkhItemPassive, description: "최대 체력이 90% 감소한다. Lv40 이하 오시리스만 착용하며 41레벨부터는 장비가 빠진다. <적 전용 장비> <전수 불가능>" }
    - { id: 442, verbalName: 따개비 등갑, codeName: BarnacleShellItemPassive, description: "전투당 1회, 체력이 50% 아래로 떨어지면 최대 체력 15%의 보호막을 얻는다. <장비 전용> <전수 불가능>" }
    - { id: 431, verbalName: 아문의 홀, codeName: SceptreOfAmunItemPassive, description: "궁극기로 주는 피해가 30% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 445, verbalName: 정복, codeName: ConquestItemPassive, description: "승승장구의 강화 등급. 적 처치 시 물리 태그로 가하는 피해 +10%. 중첩된다." }
    - { id: 446, verbalName: 내 머리 위에 포격을, codeName: BombardMeItemPassive, description: "궁극기 발동 시 최대 체력의 5%를 소모할 수 있다면 소모하고 해당 궁극기의 피해 +25%. <장비 전용> <전수 불가능>" }
    - { id: 447, verbalName: 수호부, codeName: GuardianTalismanItemPassive, description: "전투당 1회 치명 피해를 막고 2턴 경직 후 최대 체력으로 부활한다. 발동하면 장비가 파괴된다. <장비 전용> <전수 불가능>" }
    - { id: 448, verbalName: 천상의 과일, codeName: HeavenlyFruitItemPassive, description: "체력이 25% 이하가 되면 최대 체력의 50%를 회복하고 장비가 파괴된다. <장비 전용> <전수 불가능>" }
    - { id: 449, verbalName: 정령의 축복, codeName: SpiritBlessingRingItemPassive, description: "자신의 턴이 시작될 때 최대 체력의 1/16을 회복한다. <장비 전용> <전수 불가능>" }
    - { id: 450, verbalName: 키티호크의 기적, codeName: KittyHawkMiracleItemPassive, description: "자신의 타겟 우선도 -1. <장비 전용> <전수 불가능>" }
    - { id: 451, verbalName: 교류 발전, codeName: AlternatingCurrentDeviceItemPassive, description: "장착자가 번개 원소일 경우 가하는 피해 +7%. <장비 전용> <전수 불가능>" }
    - { id: 452, verbalName: 겨울의 대삼각형, codeName: WinterTriangleItemPassive, description: "반격 태그로 가하는 피해 +25%. <장비 전용> <전수 불가능>" }
    - { id: 453, verbalName: 일리아스, codeName: IliadItemPassive, description: "그리스 속성이라면 성장·훈련 스탯을 제외한 초기 5대 스탯이 1.5배가 된다. <장비 전용> <전수 불가능>" }
    - { id: 455, verbalName: 여우구슬, codeName: FoxBeadItemPassive, description: "자신이 거느린 소환수 1기마다 LUK +3%, 필드 위 모든 소환수 1기마다 INT +2. <장비 전용> <전수 불가능>" }
    - { id: 1604, verbalName: 왕의 격노, codeName: KingsRage, description: "잃은 체력에 비례해 DEX와 흡혈률이 증가한다. 광전사의 격노와 같은 구조이며 계수가 크다(DEX 최대 +90%, 흡혈 한 겹 5%). <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1605, verbalName: 왕의 함성, codeName: KingsShout, description: "필드의 광전사 계열(Berserker) 아군이 내는 격노 계수가 1.5배가 된다. 여럿이 들어도 가장 큰 하나만 센다. <적 전용>" }
    # ── 일본 천공 전선 (1700 공용 · 1710 등불나방 · 1720 고치 · 1730 나비 · 1740~1760 포식자 · 1770 소환체) ──
    - { id: 1700, verbalName: 결정 완충, codeName: SkyCrystalCushion, description: "받는 치명타의 추가 피해분이 50% 줄어든다(3배 치명타 → 2배). 치명타 판정은 그대로다. 상위는 완전한 결정 완충(1701). <적 전용> <전수 불가능>" }
    - { id: 1701, verbalName: 완전한 결정 완충, codeName: SkyCrystalCushion, description: "결정 완충(1700)의 금색 상위 코드. 받는 치명타의 추가 피해분이 65% 줄어든다(3배 치명타 → 1.7배). <적 전용> <전수 불가능>" }
    - { id: 1702, verbalName: 결정 피막, codeName: SkyCrystalFilm, description: "전투 시작 시 자기 최대 체력 10%의 보호막을 두른다. 무적과는 따로 센다. <적 전용> <전수 불가능>" }
    - { id: 1703, verbalName: 응축된 깃, codeName: SkyMarkerPassive, description: "궁극기를 쓸 때마다 자기 최대 체력 1%의 보호막을 두른다. <적 전용> <전수 불가능>" }
    - { id: 1710, verbalName: 흔들리는 등불, codeName: SkyFlickeringLantern, description: "일반행동 2회마다 주변 3×3에서 체력 비율이 가장 낮은 동료를 최대 체력 1.5% 치유한다. 직전 자기 턴 이후 지속피해를 받았다면 그 회차의 치유는 취소된다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1711, verbalName: 작은 등불, codeName: SkySmallLantern, description: "전투 시작 시 자신의 CON만큼 보호막을 두른다. <적 전용> <전수 불가능>" }
    - { id: 1712, verbalName: 등불의 군집, codeName: SkyMarkerPassive, description: "모여드는 등불의 대상이 1명에서 2명으로 늘어난다. 대상당 치유량은 같다. <적 전용> <전수 불가능>" }
    - { id: 1713, verbalName: 남겨진 빛, codeName: SkyMarkerPassive, description: "모여드는 등불로 실제로 치유한 대상에게 자신의 CON×0.8 보호막을 더한다. <적 전용> <전수 불가능>" }
    - { id: 1720, verbalName: 봉합된 핵, codeName: SkySealedCore, description: "전투 시작 시 무적 6회. 최대 체력이 25%가 된다. 포식자 하나와 연결되어 일반행동으로 그 최대 체력 2%를 치유하고, 연결 대상이 쓰러지면 붕괴해 떠난다(처치가 아니다). <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1721, verbalName: 봉합된 핵, codeName: SkySealedCore, description: "종말의 포식자전 고치. 전투 시작 시 무적 8회, 최대 체력 25%. 연결 대상의 최대 체력 1.5%를 치유한다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1722, verbalName: 응축 봉합, codeName: SkyMarkerPassive, description: "결정 봉합의 보호막이 최대 체력 1%에서 1.25%로 늘어난다. <적 전용> <전수 불가능>" }
    - { id: 1730, verbalName: 불씨를 품은 날개, codeName: SkyEmberWings, description: "전투 시작 시 무적 4회. 최대 체력이 25%가 된다. 실제로 처치되면 같은 진영의 다른 생존자 전원에게 화상(2턴)을 CON 대결 없이 건다. 시전자는 처치한 쪽이다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1731, verbalName: 타오르는 인분, codeName: SkyMarkerPassive, description: "불씨 인분이 이미 불 원소를 지닌 대상에게 화상(2턴)을 시도한다. CON 대결을 거친다. <적 전용> <전수 불가능>" }
    - { id: 1732, verbalName: 오래 남는 불씨, codeName: SkyMarkerPassive, description: "처치 시 퍼뜨리는 화상이 2턴에서 3턴이 된다. 일반행동의 화상은 그대로다. <적 전용> <전수 불가능>" }
    - { id: 1740, verbalName: 포식자의 외피, codeName: SkyPredatorHide, description: "전투 시작 시 최대 체력 3% 보호막과 무적 3회. 궁극기를 마칠 때마다 무적을 3회로 갱신한다(합산하지 않는다). <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1741, verbalName: 상처 추적, codeName: SkyWoundTracker, description: "현재 체력 50% 이하인 대상에게 일반행동 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1742, verbalName: 깊은 급강하, codeName: SkyMarkerPassive, description: "파쇄 급강하의 중심 위력이 150에서 170이 된다. 주변은 70 그대로다. <적 전용> <전수 불가능>" }
    - { id: 1750, verbalName: 종말의 외피, codeName: SkyApocalypseHide, description: "전투 시작 시 최대 체력 3% 보호막. 무적은 없다 — 연결된 고치가 무적 부담을 맡는다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1751, verbalName: 깊은 종말, codeName: SkyMarkerPassive, description: "종말 급강하의 중심 위력이 160에서 180이 된다. 주변은 80 그대로다. <적 전용> <전수 불가능>" }
    - { id: 1752, verbalName: 쌍발톱, codeName: SkyMarkerPassive, description: "종말의 발톱이 같은 대상에게 STR 위력 60을 두 번 치는 공격으로 바뀐다. <적 전용> <전수 불가능>" }
    - { id: 1760, verbalName: 천공의 산란, codeName: SkySpawning, description: "전투 시작 시 허기 결정과 파열 비늘을 하나씩 전열에 떨구고, 일반행동 3회마다 하나씩 더 떨군다(파열 → 허기 교대, 종류별 2개·합계 3개까지). 허기 결정을 삼킨 포만 1개당 주는 피해 +20%. 쓰러지면 남은 결정은 발동 없이 떠난다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1761, verbalName: 단단한 결정, codeName: SkyMarkerPassive, description: "떨구는 결정의 무적이 2회 늘어난다(허기 10→12, 파열 8→10). <적 전용> <전수 불가능>" }
    - { id: 1762, verbalName: 사냥의 절정, codeName: SkyMarkerPassive, description: "체력이 처음 50% 이하가 되면 결정을 떨구는 주기가 일반행동 3회에서 2회로 줄어든다. 치유로 다시 올라가도 되돌리지 않는다. <적 전용> <전수 불가능>" }
    - { id: 1763, verbalName: 탐욕, codeName: SkyMarkerPassive, description: "허기 결정을 삼킬 때의 회복이 최대 체력 10%에서 15%로, 포만 1개당 피해 증가가 20%에서 25%로 늘어난다. <적 전용> <전수 불가능>" }
    - { id: 1770, verbalName: 맥동하는 결정, codeName: SkyCrystalCore, description: "무적 10회. 자기 턴 3번이 지나면 천공의 포식자가 삼켜 최대 체력 10%를 회복하고 포만을 얻는다. 최대 체력은 본체의 3%, 행동 속도는 본체를 따라간다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1771, verbalName: 부푼 비늘, codeName: SkyCrystalCore, description: "무적 8회. 자기 턴 3번이 지나면 터져 상대 전원에게 각자 최대 체력 35%의 피해를 준다. 방어력·피해 배율을 무시하고 회피할 수 없으며 보호막은 흡수한다. <고유 패시브> <적 전용> <전수 불가능>" }
