    # ── 로키 ──
    - { id: 282, verbalName: 펜리르, codeName: LokiFenrir, description: "소환수 펜리르를 불러낸다. 펜리르는 칸을 차지하지 않지만 체력을 가지고 피격 대상이 되며, 자기 DEX로 행동해 현재 체력이 가장 낮은 적을 문다. 여기에 더해 로키가 표식을 새긴 적이 아군에게 공격받으면 추가행동으로 위력 40의 피해를 입히고 펜리르의 LUK% 확률로 2턴 출혈을 남긴다. 방아쇠는 아군 한 명당 한 번이며 로키의 일반행동이 끝나면 되돌아온다. 로키와 펜리르 자신은 방아쇠가 되지 않는다. <고유 패시브> <전수 불가능>" }
