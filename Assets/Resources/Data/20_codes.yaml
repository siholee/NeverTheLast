codes:
  passive:
    - id: 1
      verbalName: 홀리 인챈트
      codeName: HolyEnchant
      description: "모든 아군의 치명타 확률이 10% 증가한다. <전수 불가능>"
    - id: 2
      verbalName: 약점 추적
      codeName: AtalanteWeaknessTracker
      description: "공격 대상의 디버프 1개당 방어력을 5% 무시한다(최대 20%). <고유 패시브> <전수 불가능>"
    - { id: 140, verbalName: 궁수, codeName: AtalanteArcher, description: "활 계열 무기를 장착하고 숙련되어 있으면 STR +5." }
    - { id: 141, verbalName: 민첩함, codeName: AtalanteAgility, description: "DEX +2." }
    - { id: 142, verbalName: 유리대포, codeName: AtalanteGlassCannon, description: "최대 체력 -25%, 적 방어력 20% 무시." }
    - { id: 143, verbalName: 사냥꾼, codeName: AtalanteHunter, description: "짐승 또는 괴수 분류의 적에게 가하는 피해 +30%." }
    - { id: 144, verbalName: 맹독, codeName: AtalanteVirulentPoison, description: "스킬 공격 적중 시 3초간 매초 20+CON의 5% 지속피해를 부여한다." }
    - { id: 145, verbalName: 저격수, codeName: AtalanteSniper, description: "후열에서 적 후열 공격 시 가하는 피해 +20%." }
    - { id: 146, verbalName: 사냥신의 가호, codeName: AtalanteHuntressBlessing, description: "최대 체력이 아닌 적과 지속피해 대상에게 조건당 가하는 피해 +20%." }
    - id: 3
      verbalName: 니샤카라
      codeName: ChandraNishakara
      description: "<전수 불가능> INT의 [25/50/100]%에 해당하는 CON을 획득한다."
    - id: 4
      verbalName: 갈라테아
      codeName: Galatea
      description: "피그말리온이 소환수 판정을 받아 소환수 대상 효과를 적용받는다. <고유 패시브> <전수 불가능>"
    - id: 5
      verbalName: 시의 종언
      codeName: ShiFinalVerse
      description: "일반공격 적중으로 종언 스택을 쌓고 단계별 추가 공격을 발동한다. <전수 불가능>"
    - { id: 54, verbalName: 검의 달인, codeName: ShiSwordMaster, description: "베기류 공격의 가하는 피해가 25% 증가한다." }
    - { id: 56, verbalName: 신속, codeName: ShiSwiftness, description: "바람 원소가 부착되어 있는 동안 DEX +10." }
    - { id: 58, verbalName: 천살성, codeName: HeavenlyKiller, description: "공격 후 최대 체력의 8% 미만인 적을 즉시 처형한다. 일반 등급의 적에게만 적용된다." }
    - { id: 59, verbalName: 화무십일홍, codeName: ShiTenDaysNoFlower, description: "체력 10% 미만인 적 공격 시 확정 치명타. 치명타 확률의 2배가 해당 공격의 치명타 피해에 더해진다." }
    - { id: 60, verbalName: 당연한 운명, codeName: ShiCertainDestiny, description: "천살성 보유 시 처형 기준을 최대 체력의 12% 미만으로 대체한다. 일반 등급의 적에게만 적용된다." }
    - id: 11
      verbalName: 막기
      codeName: Block
      description: "4초마다 [5/15/25]% 확률로 CON*0.8+[100/200/300]의 방어막 획득 #물리"
    - id: 8
      verbalName: 성채
      codeName: ChandraBastion
      description: "방어막 보너스 +25%"
    - id: 10
      verbalName: 갑옷 숙련
      codeName: ArmorTraining
      description: "받는 피해가 3% 감소한다. <장비 전용>"
    - id: 12
      verbalName: 기사회생
      codeName: ChandraSecondWind
      description: "체력이 25% 미만으로 떨어지면 5초에 걸쳐 체력을 30% 회복한다."
    - id: 20
      verbalName: 보루
      codeName: ChandraBulwark
      description: "아군에게 이로운 효과를 얻으면 4초간 STR +4"
    - id: 27
      verbalName: 배수의 진
      codeName: ChandraLastStandFormation
      description: "전열에 자신 외 아군이 없을 경우, CON +12"
    - id: 35
      verbalName: 목욕제계
      codeName: ChandraPurificationBath
      description: "전투 페이즈 종료 후, 모든 아군의 체력을 최대 체력의 CON%만큼 치유"
    - id: 38
      verbalName: 철벽
      codeName: ChandraIronWall
      description: "전투 시작 후 6초가 지나면 CON +6"
    - id: 62
      verbalName: 월광
      codeName: ChandraMoonlight
      description: "아군에게 이로운 효과를 부여할 경우, 바람 원소 부여"
    - { id: 70, verbalName: 풍요의 축복, codeName: QuetzalcoatlBounty, description: "필드의 풀 아군 1명당 아군 전체의 가하는 피해가 [5/10/15]% 증가한다. <전수 불가능>" }
    - { id: 71, verbalName: 지혜, codeName: QuetzalcoatlWisdom, description: "INT +4." }
    - { id: 72, verbalName: 행운아, codeName: QuetzalcoatlLucky, description: "LUK +4." }
    - { id: 73, verbalName: 예리함, codeName: QuetzalcoatlOvercritScholar, description: "100%를 초과한 치명타 확률의 1.5배를 치명타 피해로 전환한다." }
    - { id: 74, verbalName: 명상, codeName: QuetzalcoatlMeditation, description: "전투 중 2초마다 INT +1." }
    - { id: 75, verbalName: 날개 달린 뱀, codeName: QuetzalcoatlWingedSerpent, description: "20초마다 6초간 모든 아군이 매초 케찰코아틀 INT/10만큼 마나를 회복한다. <전수 불가능>" }
    - { id: 80, verbalName: 억센 육체, codeName: OrionGeoAffinity, description: "바위 원소를 보유한 동안 매초 CON +1. <고유 패시브> <전수 불가능>" }
    - { id: 81, verbalName: 중갑병, codeName: OrionHeavyInfantry, description: "중갑 착용 중 STR +4." }
    - { id: 82, verbalName: 명사수, codeName: OrionMarksman, description: "활 계열 무기 장착 중 단일 대상 피해를 입히면 STR만큼 고정 피해를 추가한다." }
    - { id: 83, verbalName: 파수꾼, codeName: OrionSentinel, description: "전열에 있을 때 필드의 후열 아군 하나당 STR +1." }
    - { id: 84, verbalName: 코드 직조, codeName: TheseusCodeWeave, description: "일반 코드 발동 시 0.25스택, 궁극기 코드 발동 시 1스택을 얻는다(최대 3). 1스택을 소비해 다음 일반공격을 강화한다. <고유 패시브> <전수 불가능>" }
    - { id: 85, verbalName: 원소 친화 - 물, codeName: TheseusHydroAffinity, description: "물 원소 보유 중 올스탯 +1, 마나 회복 효율 +20%." }
    - { id: 86, verbalName: 투사, codeName: TheseusFighter, description: "물리·접촉 피해를 가하면 실제 피해의 25%만큼 회복한다." }
    - { id: 87, verbalName: 팔랑크스, codeName: GreekPhalanx, description: "팔랑크스를 가진 필드의 아군 수 n에 비례해 전투 시작 시 CON 기반 위력 30*n의 보호막을 얻고, 상시 가하는 피해가 5%*n 증가한다. 모든 Greek 유닛이 자동 보유. <전수 불가능>" }
    - { id: 88, verbalName: 자가치유, codeName: TheseusSelfHealing, description: "매초 CON만큼 회복한다. 물 또는 풀 원소 보유 시 2배이며 두 원소가 중첩되어도 2배를 넘지 않는다." }
    - { id: 89, verbalName: 과다치유, codeName: TheseusOverheal, description: "최대 체력을 넘긴 회복량의 25%를 보호막으로 전환한다." }
    - id: 90
      verbalName: 마카나
      codeName: MacanaGrowth
      description: "적 처치 시 25% 확률로 영구적으로 무작위 스탯 +1."
    - { id: 91, verbalName: 생명의 잔, codeName: AsclepiusNashorsTooth, description: "궁극기 사용 후 5초간 DEX가 40 증가한다. <고유 패시브> <전수 불가능>" }
    - { id: 92, verbalName: 태양의 박자, codeName: AmaterasuSunRhythm, description: "기본공격 적중 시 6초간 DEX +4. 최대 6중첩. <고유 패시브> <전수 불가능>" }
    - { id: 93, verbalName: 투명, codeName: AmaterasuConcealment, description: "체력이 35% 이하일 때 대상 지정 우선도 -1." }
    - { id: 94, verbalName: 폭죽놀이, codeName: AmaterasuFireworks, description: "4번째 기본공격마다 무작위 적에게 DEX 기반 위력 20의 단일 피해를 주는 폭죽 4발을 발사한다." }
    - { id: 95, verbalName: 파죽지세, codeName: AmaterasuBreakthrough, description: "피해를 준 적의 처치에 관여하면 4초간 주스탯 +12." }
    - { id: 96, verbalName: 치명적인 치유, codeName: AsclepiusCriticalTreatment, description: "치유와 보호막이 치명타 확률로 치명타 피해 배율만큼 증가한다." }
    - { id: 97, verbalName: 마나 호흡법, codeName: AsclepiusManaBreathing, description: "INT가 제공하는 마나 회복 효율 기여분을 1.2배로 만든다." }
    - { id: 98, verbalName: 의신의 가호, codeName: AsclepiusDivineMedicine, description: "부여하는 치유와 보호막이 50% 증가하고 받은 대상의 부정 상태를 모두 제거한다." }
    - { id: 220, verbalName: 약자 멸시, codeName: PygmalionWeaklingContempt, description: "공격자의 지속피해 종류 하나당 받는 피해가 1% 감소한다(최대 20%)." }
    - { id: 221, verbalName: 천천히 꾸준히, codeName: PygmalionSlowAndSteady, description: "자신이 부여하는 지속피해가 25% 증가한다." }
    - { id: 222, verbalName: 날카로운 가시, codeName: PygmalionSharpThorns, description: "접촉 피해를 받으면 공격자에게 3초간 받는 치유량 50% 감소를 부여한다." }
    - { id: 223, verbalName: 사랑신의 가호, codeName: PygmalionLoveGodBlessing, description: "접촉 분류 기술에게 받는 피해가 25% 감소한다." }
    - { id: 230, verbalName: 약점 추적 (전수), codeName: InheritedAtalanteWeaknessTracker, description: "대상의 디버프 하나당 방어력을 3% 무시한다(최대 12%). <열화 전수본>" }
    - { id: 231, verbalName: 원소 친화 - 바위 (전수), codeName: InheritedOrionGeoAffinity, description: "바위 원소를 보유한 동안 2초마다 CON +1. <열화 전수본>" }
    - { id: 232, verbalName: 생명의 잔 (전수), codeName: InheritedAsclepiusNashorsTooth, description: "궁극기 사용 후 5초간 DEX가 20 증가한다. <열화 전수본>" }
    - { id: 233, verbalName: 태양의 박자 (전수), codeName: InheritedAmaterasuSunRhythm, description: "기본공격 적중 시 6초간 DEX +2. 최대 4중첩. <열화 전수본>" }
    # 일반 등급 적은 테마별로 아래 네 단계 성장 패시브를 공유한다.
    - { id: 101, verbalName: 북방의 기세, codeName: NordCommonSpirit, description: "주는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 102, verbalName: 혹한의 강인함, codeName: NordCommonToughness, description: "받는 피해가 5% 감소한다. <적 전용> <전수 불가능>" }
    - { id: 103, verbalName: 약탈자의 숙련, codeName: NordCommonMastery, description: "주는 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 104, verbalName: 노르드의 노련함, codeName: NordCommonVeteran, description: "코드 가속이 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 109, verbalName: 검투사의 기백, codeName: ColosseumCommonSpirit, description: "주는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 110, verbalName: 관중의 함성, codeName: ColosseumCommonToughness, description: "받는 피해가 5% 감소한다. <적 전용> <전수 불가능>" }
    - { id: 111, verbalName: 투기장 무기술, codeName: ColosseumCommonMastery, description: "주는 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 112, verbalName: 백전노장, codeName: ColosseumCommonVeteran, description: "코드 가속이 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 113, verbalName: 군단의 기세, codeName: LegionCommonSpirit, description: "주는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 114, verbalName: 방진의 견고함, codeName: LegionCommonToughness, description: "받는 피해가 5% 감소한다. <적 전용> <전수 불가능>" }
    - { id: 115, verbalName: 규율 숙련, codeName: LegionCommonMastery, description: "주는 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 116, verbalName: 백인대의 노련함, codeName: LegionCommonVeteran, description: "코드 가속이 10% 증가한다. <적 전용> <전수 불가능>" }
    - id: 120
      verbalName: 월식 정산
      codeName: TsukuyomiMoonReckoning
      description: "필드에 있는 동안 지속피해 상태의 적이 처치되면 1초간 받을 지속피해의 [50/75/100]%를 주변에 범위 피해로 입힌다. <전수 불가능>"
    - id: 121
      verbalName: 주문 보호막
      codeName: TsukuyomiSpellShield
      description: "8초마다 공격 1회를 무효화하는 INT 50%의 보호막을 획득한다."
    - id: 122
      verbalName: 변덕쟁이
      codeName: TsukuyomiFickle
      description: "2초마다 서로 다른 기본 스탯 하나가 10% 상승하고 하나가 10% 하락한다."
    - id: 123
      verbalName: 저주
      codeName: TsukuyomiCurse
      description: "같은 진영의 모든 아군이 부여하는 지속피해량이 25% 증가한다."
    - id: 124
      verbalName: 상처 벌리기
      codeName: TsukuyomiWidenWound
      description: "지속피해 디버프를 가진 유닛을 공격할 때 방어력 45%를 무시하고 6초간 받는 치유량을 50% 감소시킨다. 다른 치유량 감소와 중첩되지 않으며 더 긴 남은 시간만 유지한다."
    - id: 125
      verbalName: 고통스러운 상처
      codeName: TsukuyomiPainfulWound
      description: "지속피해 디버프를 가진 최대 체력이 아닌 유닛을 공격하면 6초간 받는 치유량을 50% 감소시킨다."
    - id: 126
      verbalName: 순환
      codeName: TsukuyomiCycle
      description: "같은 진영의 유닛이 사망하면 무작위 생존 아군 하나가 주는 피해 25% 증가, 받는 피해 25% 감소를 얻는다."
    - id: 127
      verbalName: 체인 라이트닝
      codeName: TsukuyomiChainLightning
      description: "4번째 일반공격 적중 후 대상에게 번개 원소를 부여하고 주변 3명에게 일반공격 피해의 50%를 입힌다."
    - id: 128
      verbalName: 만월
      codeName: TsukuyomiFullMoon
      description: "일본 테마 또는 밤 필드에서 주는 피해 50% 증가, 받는 피해 50% 감소. <전수 불가능>"
    - id: 130
      verbalName: 황혼
      codeName: SurtrTwilight
      description: "치명 피해를 전투당 한 번 막고 2초 경직 후 최대 체력까지 회복하여 황혼에 진입한다. 황혼 중 라그나로크는 최대 중첩이고 매초 2%부터 1%p씩 증가하는 최대 체력을 잃는다. <전수 불가능>"
    - { id: 133, verbalName: 거인, codeName: SurtrGiant, description: "STR +4." }
    - { id: 134, verbalName: 원소 숙련 - 불, codeName: SurtrFireMastery, description: "불 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 135, verbalName: 천상의 신체, codeName: SurtrCelestialBody, description: "받는 치유와 보호막 효과가 25% 증가한다." }
    - { id: 136, verbalName: 투사, codeName: SurtrFighter, description: "가한 피해의 8%만큼 체력을 회복한다." }
    - { id: 137, verbalName: 클러치 플레이어, codeName: SurtrClutchPlayer, description: "잃은 체력 비율의 50%만큼 주는 피해가 증가한다." }
    - { id: 138, verbalName: 신살자, codeName: SurtrGodslayer, description: "최대 체력이 자신의 150% 이상인 적에게 주는 피해가 25% 증가한다." }
    # 콜로세움 일반 병종은 109~112 공통 적 패시브를 사용한다.
    - { id: 164, verbalName: 챔피언의 여유, codeName: ColosseumPassive164, description: "체력이 절반 이상이면 받는 피해가 감소하고, 절반 미만이면 주는 피해가 증가한다. <전수 불가능>" }
    - { id: 165, verbalName: 세 번의 승부, codeName: ColosseumPassive165, description: "일반 공격이 방패 가격, 대검 내려치기, 회전 베기 순서로 변화한다. <전수 불가능>" }
    - { id: 166, verbalName: 월계관의 정화, codeName: ColosseumPassive166, description: "궁극기 사용 시 해로운 효과 하나를 제거한다. <전수 불가능>" }
    - { id: 167, verbalName: 결승의 투지, codeName: ColosseumPassive167, description: "체력이 절반 미만이면 주는 피해와 행동 속도가 증가한다. <전수 불가능>" }
    - { id: 168, verbalName: 사냥꾼의 표식, codeName: ColosseumPassive168, description: "최대 체력이 가장 높은 적에게 표식을 부여하여 받는 피해를 20% 증가시킨다. <전수 불가능>" }
    - { id: 169, verbalName: 채찍 견제, codeName: ColosseumPassive169, description: "일반 공격이 적이 주는 피해를 5초간 20% 감소시킨다. <전수 불가능>" }
    - { id: 170, verbalName: 집중 사냥, codeName: ColosseumPassive170, description: "궁극기 사용 시 아군이 표식 대상에게 주는 피해가 증가한다. <전수 불가능>" }
    - { id: 171, verbalName: 다음 사냥감, codeName: ColosseumPassive171, description: "표식 대상이 사망하면 새로운 대상에게 표식을 옮긴다. <전수 불가능>" }
    - { id: 176, verbalName: 몸이 풀리는군, codeName: ColosseumPassive176, description: "공격하거나 피해를 받을 때 행동 속도가 증가한다. 최대 5중첩. <전수 불가능>" }
    - { id: 177, verbalName: 노련한 검투사, codeName: ColosseumPassive177, description: "전투당 처음 받는 제어 효과를 무효화한다. <전수 불가능>" }
    - { id: 178, verbalName: 목숨값, codeName: ColosseumPassive178, description: "체력이 40% 미만이면 받는 피해가 30% 감소하고 피해의 20%를 회복한다. <전수 불가능>" }
    - { id: 179, verbalName: 다시 한 판, codeName: ColosseumPassive179, description: "전투당 한 번 치명 피해를 버티고 최대 체력의 30%를 회복하며 궁극기를 준비한다. <전수 불가능>" }
    - { id: 50, verbalName: 빅뱅, codeName: SeiBigBang, description: "<고유 패시브> <전수 불가> 보호막을 보유한 아군이 피해를 입으면 아군별 1초 내부 쿨다운으로 스택을 얻는다. 8스택에서 무작위 적에게 GEO 미사일 8발을 발사해 각각 INT의 20%에 해당하는 피해를 입히고, 아군 전체에 세이 INT의 80%에 해당하는 보호막을 부여한다. #특수 #비접촉 #추가공격" }
    - { id: 52, verbalName: 사전준비, codeName: SeiPreparation, description: "전투 시작 시 궁극기 충전량이 100%가 된다. 마나를 쓰지 않는 특수 궁극기 보유자에게는 효과가 없다." }
    - { id: 53, verbalName: 창세의 노래, codeName: SeiFirstSong, description: "<전수 불가> 전투 중 최초로 궁극기를 발동하면 아군 전체의 궁극기 충전량이 100%가 된다. 특수 궁극기 보유자에게도 적용된다." }

    # ── 베다 진영 ──
    - { id: 240, verbalName: 죽음의 계약, codeName: YamaDeathContract, description: "야마가 필드에 있는 동안 모든 아군이 가하는 지속피해 +25%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다. <고유 패시브> <전수 불가능>" }
