    - { id: 246, verbalName: 전부 아니면 전무, codeName: AllOrNothing, description: "덱 전원이 로카팔라이거나 자신만 로카팔라일 경우, 레벨에 따른 성장 스탯이 1.2배가 된다." }
    - { id: 247, verbalName: 영원히 타오르는 불꽃, codeName: AgniEternalFlame, description: "필드의 불 원소 아군이 가하는 피해 +20%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다. <고유 패시브>" }
    - { id: 248, verbalName: 대마법사, codeName: AgniArchmage, description: "필드의 보주 숙련 아군이 가하는 특수 피해의 치명타 피해 +25%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다." }
    - { id: 249, verbalName: 뇌정 각인, codeName: IndraThunderMark, description: "<전수 불가능> 적을 타격할 때마다 4초간 유지되는 표식을 남긴다. 표식이 4가 되면 INT의 40%에 해당하는 고정 피해를 입힌다. 치명타가 적용되지 않는다. <고유 패시브>" }
    - { id: 250, verbalName: 선두주자, codeName: IndraFrontrunner, description: "전투 종료 후 획득하는 EXP +30%." }
    - { id: 251, verbalName: 천재, codeName: IndraGenius, description: "INT 집중 훈련 시 훈련 효율 +10%." }
