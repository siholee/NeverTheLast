    - { id: 1420, verbalName: 거인의 방벽, codeName: GenericGiantBulwark, description: "전투 시작 시 최대 체력의 10%만큼 방어막을 얻는다. <적 전용> <전수 불가능>" }
    - { id: 1421, verbalName: 거인의 방벽, codeName: GenericGiantBulwark, description: "전투 시작 시 최대 체력의 20%만큼 방어막을 얻는다. <적 전용> <전수 불가능>" }
    - { id: 1422, verbalName: 혹한의 노심, codeName: FrostGiantCore, description: "턴 시작 시 눈 필드를 2턴 깔고 자신에게 얼음 원소를 부착한다. 얼음이 부착된 채 눈 필드에 있으면 STR·CON의 레벨 성장분이 1.5배가 된다. <적 전용> <전수 불가능>" }
    - { id: 1423, verbalName: 파쇄, codeName: GiantShatter, description: "단일 대상 궁극기 적중 후 대상의 방어력을 3턴 동안 20% 감소시킨다. <적 전용>" }
    - { id: 1424, verbalName: 강타, codeName: GiantStunningBlow, description: "단일 대상 궁극기 적중 후 대상을 1턴 기절시킨다. <적 전용>" }
    - { id: 1425, verbalName: 병상첨병, codeName: GiantCoupDeGrace, description: "행동불능 상태의 적을 공격할 때 치명타 피해 +40%. <적 전용>" }
    - { id: 1426, verbalName: 적응력, codeName: GiantAdaptability, description: "물리·접촉 기술에 적중당할 때마다 이번 전투 동안 STR +1%. <적 전용>" }
    - { id: 1427, verbalName: 영구동토, codeName: GiantPermafrost, description: "체력 칸이 깨질 때마다 적 후열에 공허의 씨앗을 2기 세운다. <적 전용>" }
    - { id: 1428, verbalName: 얼어붙은 파종, codeName: GiantFrozenSowing, description: "영구동토가 세우는 씨앗이 혹한의 씨앗이 된다. 영구동토의 금색 짝. <적 전용>" }

    # ── 범용 씨앗 패시브 ──
    - { id: 1430, verbalName: 가변 장갑진, codeName: GenericSeedFormation, description: "전열에서는 레벨×1 CON, 후열에서는 레벨×1 DEX를 얻는다. <적 전용> <전수 불가능>" }
    - { id: 1431, verbalName: 가변 장갑진, codeName: GenericSeedFormation, description: "전열에서는 레벨×2 CON, 후열에서는 레벨×2 DEX를 얻는다. <적 전용> <전수 불가능>" }
    - { id: 1432, verbalName: 혹한의 동력로, codeName: FrostSeedCore, description: "턴 시작 시 눈 필드를 2턴 깐다. 눈 필드에 있는 동안 DEX +30%, CON +15%. <적 전용> <전수 불가능>" }
    - { id: 1433, verbalName: 자폭, codeName: SeedSelfDestruct, description: "치명 피해 시 적 진영 중앙에서 최대 체력의 8%만큼 범위 고정 피해를 주고 파괴된다. #추가행동 #특수 #비접촉 <적 전용>" }
    - { id: 1434, verbalName: 대폭발, codeName: SeedSelfDestruct, description: "자폭의 금색 상위 코드. 치명 피해 시 적 진영 중앙에서 최대 체력의 16%만큼 범위 고정 피해를 주고 피격된 적에게 치유량 감소 50%를 3턴 부여한 뒤 파괴된다. #추가행동 #특수 #비접촉 <적 전용>" }
    - { id: 1435, verbalName: 오버로드, codeName: SeedOverload, description: "체력이 30% 이하일 때 과부하 궁극기의 지속시간 동안 DEX 증가량이 25%가 된다. <적 전용>" }
    - { id: 1436, verbalName: 서리광선, codeName: SeedFrostRay, description: "얼음 원소를 부착할 때 대상에게 2턴 둔화를 부여한다. 둔화는 DEX가 제공하는 행동 속도를 2/3으로 줄인다. <적 전용>" }

    # ── 공허의 프리즘 패시브 ──
    - { id: 1500, verbalName: 프리즘 동조, codeName: VoidPrismCore, description: "필드에 있는 공허의 프리즘 하나마다 자신의 INT +2%. 팔레트 변형도 동일 유닛으로 센다. <고유 패시브> <적 전용> <전수 불가능>" }
