    - { id: 1840, verbalName: 촉수 폭풍, codeName: CoastTentacleStorm, description: "피해 없이 준비만 한다. 다음 일반행동이 상대 전원 공격으로 바뀐다. 준비 중 행동불능이 되면 취소되고 자원은 돌아오지 않는다." }
    - { id: 1850, verbalName: 해연의 대호흡, codeName: CoastAbyssalBreath, description: "피해 없이 준비만 한다. 다음 일반행동이 해일로 바뀐다. 입장 후 일반행동 2회 전에는 쓰지 않는다. 준비 중 행동불능이 되면 취소되고 자원은 돌아오지 않으며, 체력 구간 브레이크로는 취소되지 않는다." }
