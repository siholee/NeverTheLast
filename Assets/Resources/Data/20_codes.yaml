# 코드 표시 데이터 — 이름과 설명. 전투 동작은 코드 클래스(Assets/Scripts/Codes)가 가진다.
#
# ID는 슬롯마다 따로다(특성 201 ≠ 궁극기 201). 규칙은 Detail_11 §1.5.
#   아군 일반행동 · 궁극기 = 유닛 ID,  아군 고유 특성 = 유닛 ID + 200
#   적 공용 = 1000번대
#
# 설명 끝의 #태그는 피해의 성질이다(Detail_02 §5). <꺾쇠>는 코드의 꼬리표다.
# 2026-09 전면 개편으로 옛 코드 표를 모두 걷어냈다. 캐릭터를 다시 만들 때마다 여기에 한 줄씩 더한다.

codes:
  passive:
    - id: 201
      verbalName: 빅뱅
      codeName: SeiBigBang
      description: "<고유 특성> 고유 중첩 '창세의 결정'을 가진다. 필드 위에 보호막을 두른 아군이 공격을 받을 때마다 1중첩을 얻는다. 창세의 결정이 7개 모이면 무작위 적에게 방어력의 25%에 해당하는 작은 바위 조각 7개를 발사한다. 이 공격은 대상 우선도를 무시한다. <추가> 이후 아군 전체에게 100 + 방어력의 5%에 해당하는 보호막을 부여한다. #다중 #특성 #비접촉"
    - id: 202
      verbalName: 멸망의 시
      codeName: ShiFinalVerse
      description: "<고유 특성> 다른 아군의 공격 직후 멸참의 공격력 250% 피해가 대상의 방어력과 현재 체력만으로 처치에 충분한 적이 있으면, 가장 현재 체력이 낮은 적에게 멸참을 특수행동으로 사용한다. 처형 예측은 치명타·보호막·피해 증감·원소 반응·추가 피해를 세지 않는다."
    - id: 203
      verbalName: 빈틈 포착
      codeName: SabahDebuffHunter
      description: "<고유 특성> 공격 대상의 디버프(지속피해 포함) 1개당 가하는 피해가 4% 증가한다. 아군이 적에게 해로운 상태를 부여·갱신하거나, 아군이 건 지속피해가 적에게 피해를 줄 때마다 아즈라엘 1중첩을 얻는다."
    - id: 207
      verbalName: 철권제재
      codeName: JeanIronSanction
      description: "<고유 특성> 전투 시작 시 철권제재 기회를 기본 횟수만큼 얻고, 일반행동을 해결할 때마다 현재 최대치까지 회복한다. 적의 직접 공격 최종 대상에 잔이 포함되면 기회 1회를 소모해 그 공격자에게 신성한 일격을 먼저 사용한다. 이 피해는 일반공격·추가공격·반격으로 함께 판정한다. 지속피해·원소 반응·특성 간접 피해·덧붙는 피해에는 발동하지 않는다. #단일 #일반 #추가행동 #반격 #접촉 #물리"
    - id: 220
      verbalName: 갈라테아
      codeName: PygmalionGalatea
      description: "<고유 특성> 피그말리온은 소환수로도 간주된다. 피그말리온이 필드에 있는 동안 모든 아군이 가하는 피해가 15% 증가하며, 소환수는 대신 30% 증가한다."
    - id: 244
      verbalName: 맹화
      codeName: HimikoBlaze
      description: "<고유 특성> 한 대상에게 여러 번 쌓이는 중립 표식 맹화를 부여한다. 3중첩이 되면 표식을 모두 지우고 2턴 동안 받는 피해 +15% 디버프 하나와 히미코 공격력 100%의 고정 피해를 준다. 행동을 빼앗지는 않지만 제어를 받은 것으로 간주해 집중을 끊는다."
    - id: 260
      verbalName: 니샤카라
      codeName: ChandraNishakara
      description: "<고유 특성> 고유 중첩 '월광'을 가진다. 피해로 체력이 최대 체력의 30% 이하가 되면 월광 1중첩을 소모하고 최대 체력의 50%만큼 즉시 회복한다. 치명상이면 사망 판정 전에 발동한다."
    - id: 322
      verbalName: 든든한 경호대가 있다고!
      codeName: BastetReliableGuard
      description: "<고유 특성> 바스테트가 직접 공격의 대상이 되고 그 공격의 확정 대상 목록에 다른 경호 자격자가 없으면, 필드의 견고 또는 반격 아군 한 명이 대신 대상이 된다. 반격 보유 여부 → 타겟 우선도 → 전열 → 남은 체력 비율 → 낮은 ID 순으로 고른다. 특성이 직접 가하는 간접 공격은 경호하지 않으며 추가행동 같은 행동 공격은 경호한다."

  normal:
    - id: 1
      verbalName: 땅고르기
      codeName: SeiGroundLeveling
      description: "바위 조각을 던져 55 + 방어력의 50% 피해를 입히고, 맞은 대상에게 바위 원소를 부여한다. #단일 #일반 #비접촉"
    - id: 2
      verbalName: 멸참
      codeName: ShiGhostSlash
      description: "적 하나에게 공격력의 250% 피해를 입힌다. 일반행동 또는 멸망의 시로 사용한 멸참이 적을 처치하면 멸참을 특수행동으로 즉시 한 번 더 사용한다. 재행동 멸참은 처치해도 다시 이어지지 않는다. #단일 #일반/특수 #베기 #비접촉 #물리"
    - id: 3
      verbalName: 검격
      codeName: SabahLightningSlash
      description: "그림자로 녹아 단일 적에게 110 + 공격력의 100% 피해를 입힌다. 일반행동 3번째마다 번개 베기로 바뀌어 우선도가 높은 적부터 최대 3명에게 같은 피해를 입히고 번개 원소를 부여한다. #단일/다중 #일반 #베기 #접촉 #물리"
    - id: 7
      verbalName: 신성한 일격
      codeName: JeanHolyStrike
      description: "맨주먹으로 단일 적에게 공격력의 100% 피해를 입힌다. #단일 #일반 #접촉 #물리"
    - id: 20
      verbalName: 불씨
      codeName: PygmalionEmber
      description: "대상 발밑에서 불씨를 솟구치게 해 단일 적에게 공격력의 100% 피해를 입힌다. #단일 #일반 #비접촉"
    - id: 44
      verbalName: 불씨
      codeName: HimikoEmber
      description: "대상 발밑에서 불씨를 솟구치게 해 단일 적에게 공격력의 100% 피해를 입히고 맹화 1중첩을 부여한다. #단일 #일반 #비접촉"
    - id: 60
      verbalName: 샤친
      codeName: ChandraSachi
      description: "응축한 월식의 그림자를 날려 단일 적에게 최대 체력의 50%에 해당하는 특수 피해를 입힌다. #단일 #일반 #특수 #비접촉"
    - id: 122
      verbalName: 냥냥펀치
      codeName: BastetCatPunch
      description: "짧게 내딛어 단일 적에게 공격력의 100% 피해를 입힌다. #단일 #일반 #접촉 #물리"
    - id: 1001
      verbalName: 돌격
      codeName: EnemyCharge
      description: "대상에게 달려들어 공격력의 100% 피해를 입힌다. #단일 #일반 #접촉"
    - id: 1002
      verbalName: 사격
      codeName: EnemyShot
      description: "공허 화살을 쏘아 공격력의 90% 피해를 입힌다. #단일 #일반 #비접촉"

  ultimate:
    - id: 1
      verbalName: 창세의 노래
      codeName: SeiSongOfGenesis
      description: "<집중> <마나 120> 3턴간 아군 전체에게 50 + 방어력의 15%만큼 공격력을 부여하고, 아군이 피해를 가할 때마다 세이 방어력의 10%에 해당하는 고정 피해를 추가한다. 추가로 아군 전체에게 레벨 × 2 + 방어력의 25%에 해당하는 보호막을 부여한다. 집중 — 효과가 세이를 기준으로 지속되며 세이가 행동불능이 되면 해제된다."
    - id: 2
      verbalName: 만종
      codeName: ShiFinalBell
      description: "<패시브형> 멸참을 사용할 때마다 만종 1중첩을 얻는다. 3중첩에는 멸참 대상에게 공격력의 🔸40~136% 추가 피해를, 6중첩에는 적 전체에 공격력 200%의 분배 피해를, 9중첩에는 적 전체에 공격력 300%의 분배 피해를 준 뒤 0중첩으로 돌아간다. #단일/전체 #궁극기 #분배 #비접촉"
    - id: 3
      verbalName: 아즈라엘
      codeName: SabahAzrael
      description: "<아즈라엘 7> 아즈라엘 7중첩을 모두 소모해 적 전체에 150 + 공격력의 100% 피해를 입힌다. 대상마다 한 번 판정한다. #전체 #궁극기 #베기 #접촉 #물리"
    - id: 7
      verbalName: 텐션 오르는데!
      codeName: JeanTensionRising
      description: "<마나 120> 3턴 동안 자신의 타겟 우선도가 1 증가하고, 추가공격으로 가하는 피해가 20% 증가한다. 받는 피해가 10% 감소하며 접촉 공격이면 총 20% 감소한다."
    - id: 20
      verbalName: 날카로운 가시
      codeName: PygmalionSharpThorns
      description: "<집중> <마나 120> 3턴 동안 타겟 우선도 +1, 받는 피해 -50%를 얻는다. 접촉 공격을 받을 때에는 방어력을 2배로 계산하며 공격자에게 공격력 20%의 턴 피해를 주는 맹독(2턴)을 부여한다."
    - id: 44
      verbalName: 맹화의 제전
      codeName: HimikoBlazeFocus
      description: "<집중> <마나 100> 히미코를 기준으로 2턴 동안 적이 행동할 때마다 그 적에게 맹화를 부여한다. 집중이 유지되는 동안 모든 아군은 적 방어력을 20% 무시한다."
    - id: 60
      verbalName: 소마
      codeName: ChandraSoma
      description: "<마나 120> 가장 공격력이 높은 아군에게 3턴 동안 대상 공격력의 10% + 찬드라 최대 체력의 10%만큼 공격력을 부여하고, 월광 1중첩을 얻는다."
    - id: 122
      verbalName: 미운 놈 한 대 더 때리기
      codeName: BastetOneMoreHit
      description: "<상시> 다른 아군의 반격이 적에게 실제 피해를 주면 바스테트가 같은 대상에게 냥냥펀치를 우선 추가행동으로 한 번 사용한다. 턴당 제한은 없고 같은 반격 행동 하나당 한 번만 발동한다. 이 공격은 일반행동과 추가행동으로 함께 판정하며 초월기 자원을 충전하거나 소모하지 않는다. #단일 #일반 #추가행동 #접촉 #물리"
    - id: 1001
      verbalName: 강타
      codeName: EnemySmash
      description: "대상에게 온 힘으로 부딪혀 공격력의 200% 피해를 입힌다. #단일 #궁극기 #접촉"
    - id: 1002
      verbalName: 연사
      codeName: EnemyVolley
      description: "공허 화살 3발을 잇달아 쏜다. 발마다 공격력의 60% 피해. #단일 #궁극기 #비접촉"
    - id: 1003
      verbalName: 대지 분쇄
      codeName: EnemyGroundBreaker
      description: "대상에게 부딪혀 공격력의 180% 피해를 입히고 1턴간 기절시킨다. #단일 #궁극기 #접촉"
    - id: 1004
      verbalName: 공허의 숨결
      codeName: EnemyVoidBreath
      description: "모든 적에게 공허 화살을 흩뿌려 대상마다 공격력의 110% 피해를 입힌다. #전체 #궁극기 #비접촉"

  special:
    - id: 60
      verbalName: 창야
      codeName: ChandraChangya
      description: "<로카팔라> 월광 1중첩을 얻고, 로카팔라 특수행동이 끝날 때까지 아군 전체의 치명타 확률을 25% 높인다. 이어 모든 적에게 최대 체력의 100%에 해당하는 특수 피해를 입히고 실제로 입힌 피해의 20%만큼 회복한다. 바유 다음, 다른 로카팔라보다 먼저 행동한다. #전체 #특수행동 #특수 #비접촉"
