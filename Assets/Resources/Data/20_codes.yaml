    - { id: 1208, verbalName: 천부장의 신호, codeName: LegionTribunePassive, description: "전투 시작 시 CON+STR이 가장 높은 전열 아군을 지정한다. 지정된 아군이 단일 피해를 가하면 같은 대상에게 추가행동으로 일반행동을 넣는다. <적 전용> <전수 불가능>" }
    - { id: 300, verbalName: 화합, codeName: LegionConcordia, description: "단일 아군에게 이로운 효과를 부여하면 그 아군에게 '화합' 2스택을 준다. 화합 보유자는 가하는 피해 +25%. 자기 턴마다 1스택 감소하고, 새로 부여하면 이전 보유자가 잃는다. <고유 패시브> <전수 불가능>" }
    - { id: 301, verbalName: 천천히 서둘러라, codeName: LegionFestinaLente, description: "자신의 DEX가 25% 감소하고 궁극기로 가하는 피해가 25% 증가한다. <고유 패시브> <전수 불가능>" }
    - { id: 302, verbalName: "왔노라, 보았노라, 이겼노라", codeName: LegionVeniVidiVici, description: "적을 처치할 때마다 모든 '로마' 아군의 가하는 피해가 10% 증가한다. 상한 없이 중첩된다. <고유 패시브> <전수 불가능>" }
    - { id: 1212, verbalName: 최고의 2인자, codeName: LegionSecondInCommand, description: "필드에 옥타비아가 있으면 일반행동이 무조건 옥타비아를 향하고, 추가로 옥타비아의 행동 게이지를 100% 채운다. <보스 전용> <전수 불가능>" }
    - { id: 1213, verbalName: 팍스 로마나, codeName: LegionPaxRomana, description: "공격이 적중한 대상 수 하나당 궁극기 자원을 최대치의 2% 채운다. <보스 전용> <전수 불가능>" }
