    - { id: 1403, verbalName: 명계의 재림, codeName: AswanNetherReturn, description: "치명적인 피해를 입으면 전투당 1회에 한해 다음 자기 턴에 부활한다. 부활 시 해로운 상태를 모두 잃고 체력이 가득 찬다. <적 전용> <전수 불가능>" }
    - { id: 1404, verbalName: 불완전한 부활, codeName: OsirisImperfectResurrection, description: "최대 체력이 14배가 되고 받는 피해가 2.4배에서 시작한다. 부위(체력 1/14)가 깨질 때마다 받는 피해가 10%p 줄고 사령 3기가 소환된다. <적 전용> <전수 불가능>" }
    - { id: 1405, verbalName: 승천, codeName: AmunRaAscension, description: "적을 공격한 행동마다 '승천' 1스택을 얻고 피해를 받으면 1스택을 잃는다. 스택 하나당 치명타 피해 +5%, 가하는 피해 +5%. <적 전용> <전수 불가능>" }
    - { id: 1406, verbalName: 성스러운 칼날, codeName: AswanHolyBlade, description: "'베기' 태그 공격의 치명타 피해 +25%." }
    - { id: 1407, verbalName: 까칠한 피부, codeName: AswanCoarseSkin, description: "'접촉' 태그의 공격을 받으면 방어력으로 감소시킨 피해량의 50%를 공격자에게 되돌려준다. #물리 #접촉" }
