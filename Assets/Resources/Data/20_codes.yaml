    - id: 500
      verbalName: 분신 일격
      codeName: UchiCloneStrike
      description: "<소환수> 분신이 우선도 적에게 우치 공격력 120% 피해를 주고 사라진다. #단일 #일반 #접촉 #타격"
    - id: 1
      verbalName: 땅고르기
      codeName: SeiGroundLeveling
      description: "바위 조각을 던져 55 + 방어력의 50% 피해를 입히고, 맞은 대상에게 바위 원소를 부여한다. #단일 #일반 #비접촉"
    - id: 2
      verbalName: 멸참
      codeName: ShiGhostSlash
      description: "적 하나에게 공격력의 250% 피해를 입힌다. 일반행동 또는 멸망의 시로 사용한 멸참이 적을 처치하면 멸참을 특수행동으로 즉시 한 번 더 사용한다. 재행동 멸참은 처치해도 다시 이어지지 않는다. #단일 #일반/특수 #베기 #비접촉 #물리"
    - id: 3
      verbalName: 검격
      codeName: SabahLightningSlash
      description: "그림자로 녹아 단일 적에게 110 + 공격력의 100% 피해를 입힌다. 일반행동 3번째마다 번개 베기로 바뀌어 우선도가 높은 적부터 최대 3명에게 같은 피해를 입히고 번개 원소를 부여한다. #단일/다중 #일반 #베기 #접촉 #물리"
    - id: 7
      verbalName: 신성한 일격
      codeName: JeanHolyStrike
      description: "맨주먹으로 단일 적에게 공격력의 100% 피해를 입힌다. #단일 #일반 #접촉 #물리"
    - id: 20
      verbalName: 불씨
      codeName: PygmalionEmber
      description: "대상 발밑에서 불씨를 솟구치게 해 단일 적에게 공격력의 100% 피해를 입힌다. #단일 #일반 #비접촉"
    - id: 44
      verbalName: 불씨
      codeName: HimikoEmber
      description: "대상 발밑에서 불씨를 솟구치게 해 단일 적에게 공격력의 100% 피해를 입히고 맹화 1중첩을 부여한다. #단일 #일반 #비접촉"
    - id: 60
      verbalName: 샤친
      codeName: ChandraSachi
      description: "응축한 월식의 그림자를 날려 단일 적에게 최대 체력의 50%에 해당하는 특수 피해를 입힌다. #단일 #일반 #특수 #비접촉"
    - id: 122
      verbalName: 냥냥펀치
      codeName: BastetCatPunch
      description: "짧게 내딛어 단일 적에게 공격력의 100% 피해를 입힌다. #단일 #일반 #접촉 #물리"
    - id: 1001
      verbalName: 돌격
      codeName: EnemyCharge
      description: "대상에게 달려들어 공격력의 100% 피해를 입힌다. #단일 #일반 #접촉"
    - id: 1002
      verbalName: 사격
      codeName: EnemyShot
      description: "공허 화살을 쏘아 공격력의 90% 피해를 입힌다. #단일 #일반 #비접촉"

  ultimate:
    - id: 63
      verbalName: 팔방의 소집
      codeName: IndraGathering
      description: "<마나 120> 로카팔라 묶음을 연다 — 필드의 로카팔라 참여자 전원의 특수행동을 순서대로 예약한다. 피해는 없다."
    - id: 61
      verbalName: 언젠가 다다를 마지막
      codeName: YamaLastArrival
      description: "<마나 120> 적 전체에 공격력 120% 피해를 주고 번개를 부착한 뒤, 대상별로 모든 지속피해를 min(1, 1.5q) 비율로 즉시 발동한다. #전체 #궁극기 #비접촉 #주문"
    - id: 66
      verbalName: 동일한 법 아래
      codeName: VarunaUnderSameLaw
      description: "<마나 100> 적 전체에 공격력 120% 피해를 주고 물을 부착하며, 생존한 필드 아군 전원(자신 포함)에게 바루나 현재 방어력 100%의 보호막을 준다. 물 부착으로 제방 보호막(자신 35%)도 따로 얻는다. #전체 #궁극기 #비접촉 #주문"
    - id: 64
      verbalName: 만류의 회랑
      codeName: VayuStorm
      description: "<마나 100> 적 전체에 공격력 100% 피해를 주고 2턴간 방어력 -20%(바람의 침식). 특수방어력은 깎지 않고 바람도 붙이지 않는다. #전체 #궁극기 #비접촉 #주문"
    - id: 62
      verbalName: 내가 판을 키워 주지
      codeName: AgniRaiseTheStakes
      description: "<마나 120> 자신을 포함한 필드 아군 전원의 궁극기 피해 +20%(판돈 — 아그니가 일반행동을 세 번 마칠 때까지). 판돈 동안 아그니의 특성 추공은 궁극기 판정을 함께 받는다. 아군별 특성 횟수를 되돌린다. 피해는 없다."
    - id: 67
      verbalName: 도망칠 곳은 없어
      codeName: SuryaNoEscape
      description: "<마나 120> 현상수배된 적에게 공격력 150% 피해를 주고 불을 부착한다. 탄환을 2발까지 채우고 다음 응답 사격 한 발을 공격력 110%로 강화한다(겹치지 않음). #단일 #궁극기 #비접촉 #사격"
    - id: 65
      verbalName: 보고 개방
      codeName: KuberaTreasury
      description: "<보물 8> 적 전체에 공격력 160% 피해. 2턴간 아군 소환수 피해 +15%(후원과 합산). 다수형 소환자마다 소환수 1기를 더 만든다. #전체 #궁극기 #비접촉 #주문"
    - id: 121
      verbalName: 사자의 서
      codeName: AnubisBookOfTheDead
      description: "<마나 120> 자신의 3턴(영혼 150 이후 4턴) 동안 심장의 저울이 최대 체력 10% · 회복 60% · 바위 부착으로 강화된다."
    - id: 180
      verbalName: 만천화우
      codeName: UchiManchunhwau
      description: "<마나 100> 분신을 모두 소모해 각각 우선도 적에게 우치 공격력 300% 피해. 분신이 없으면 분신 2기를 만든다. #다중 #궁극기 #접촉 #타격"
    - id: 1
      verbalName: 창세의 노래
      codeName: SeiSongOfGenesis
      description: "<집중> <마나 120> 3턴간 아군 전체에게 50 + 방어력의 15%만큼 공격력을 부여하고, 아군이 피해를 가할 때마다 세이 방어력의 10%에 해당하는 고정 피해를 추가한다. 추가로 아군 전체에게 레벨 × 2 + 방어력의 25%에 해당하는 보호막을 부여한다. 집중 — 효과가 세이를 기준으로 지속되며 세이가 행동불능이 되면 해제된다."
    - id: 2
      verbalName: 만종
      codeName: ShiFinalBell
      description: "<패시브형> 멸참을 사용할 때마다 만종 1중첩을 얻는다. 3중첩에는 멸참 대상에게 공격력의 🔸40~136% 추가 피해를, 6중첩에는 적 전체에 공격력 200%의 분배 피해를, 9중첩에는 적 전체에 공격력 300%의 분배 피해를 준 뒤 0중첩으로 돌아간다. #단일/전체 #궁극기 #분배 #비접촉"
    - id: 3
      verbalName: 아즈라엘
      codeName: SabahAzrael
      description: "<아즈라엘 7> 아즈라엘 7중첩을 모두 소모해 적 전체에 150 + 공격력의 100% 피해를 입힌다. 대상마다 한 번 판정한다. #전체 #궁극기 #베기 #접촉 #물리"
    - id: 7
      verbalName: 텐션 오르는데!
      codeName: JeanTensionRising
      description: "<마나 120> 3턴 동안 자신의 타겟 우선도가 1 증가하고, 추가공격으로 가하는 피해가 20% 증가한다. 받는 피해가 10% 감소하며 접촉 공격이면 총 20% 감소한다."
    - id: 20
      verbalName: 날카로운 가시
      codeName: PygmalionSharpThorns
      description: "<집중> <마나 120> 3턴 동안 타겟 우선도 +1, 받는 피해 -50%를 얻는다. 접촉 공격을 받을 때에는 방어력을 2배로 계산하며 공격자에게 공격력 20%의 턴 피해를 주는 맹독(2턴)을 부여한다."
    - id: 44
      verbalName: 맹화의 제전
      codeName: HimikoBlazeFocus
      description: "<집중> <마나 100> 히미코를 기준으로 2턴 동안 적이 행동할 때마다 그 적에게 맹화를 부여한다. 집중이 유지되는 동안 모든 아군은 적 방어력을 20% 무시한다."
    - id: 60
      verbalName: 소마
      codeName: ChandraSoma
      description: "<마나 120> 가장 공격력이 높은 아군에게 3턴 동안 대상 공격력의 10% + 찬드라 최대 체력의 10%만큼 공격력을 부여하고, 월광 1중첩을 얻는다."
    - id: 122
      verbalName: 미운 놈 한 대 더 때리기
      codeName: BastetOneMoreHit
      description: "<상시> 다른 아군의 반격이 적에게 실제 피해를 주면 바스테트가 같은 대상에게 냥냥펀치를 우선 추가행동으로 한 번 사용한다. 턴당 제한은 없고 같은 반격 행동 하나당 한 번만 발동한다. 이 공격은 일반행동과 추가행동으로 함께 판정하며 초월기 자원을 충전하거나 소모하지 않는다. #단일 #일반 #추가행동 #접촉 #물리"
    - id: 1001
      verbalName: 강타
      codeName: EnemySmash
      description: "대상에게 온 힘으로 부딪혀 공격력의 200% 피해를 입힌다. #단일 #궁극기 #접촉"
    - id: 1002
      verbalName: 연사
      codeName: EnemyVolley
      description: "공허 화살 3발을 잇달아 쏜다. 발마다 공격력의 60% 피해. #단일 #궁극기 #비접촉"
    - id: 1003
      verbalName: 대지 분쇄
      codeName: EnemyGroundBreaker
      description: "대상에게 부딪혀 공격력의 180% 피해를 입히고 1턴간 기절시킨다. #단일 #궁극기 #접촉"
    - id: 1004
      verbalName: 공허의 숨결
      codeName: EnemyVoidBreath
      description: "모든 적에게 공허 화살을 흩뿌려 대상마다 공격력의 110% 피해를 입힌다. #전체 #궁극기 #비접촉"

  special:
    - id: 63
      verbalName: 바즈라
      codeName: IndraVajra
      description: "<로카팔라> 적 전체에 공격력 150% 피해. 궁극기 판정도 함께 가져 궁극기 피해 증가 효과를 받는다. 아군이 깐 버프 · 디버프를 받은 뒤 친다. #전체 #특수행동 #궁극기 #비접촉 #주문"
    - id: 61
      verbalName: 죽음의 순회
      codeName: YamaDeathRound
      description: "<로카팔라> 적 전체에 공격력 400% 피해. 인드라 뒤 · 찬드라 앞(+75)에 행동한다. 번개 부착과 지속피해 즉시 발동은 없다. #전체 #특수행동 #비접촉 #주문"
    - id: 66
      verbalName: 넘치는 판결
      codeName: VarunaOverflowingJudgment
      description: "<로카팔라> 적 전체에 공격력 70% 피해를 주고 생존한 필드 아군 전원(자신 포함)에게 바루나 현재 방어력 100%의 보호막을 준다. 바유 뒤 · 쿠베라 앞(-50)에 행동한다. 물 부착이 없어 제방 보호막도 없다. #전체 #특수행동 #비접촉 #주문"
    - id: 64
      verbalName: 태풍의 눈
      codeName: VayuEyeOfTyphoon
      description: "<로카팔라> 묶음의 처음(-100)에 적 전체에 공격력 45% 피해를 준 뒤, 생존한 적 전원에게 일곱 원소(불 · 물 · 풀 · 번개 · 얼음 · 바위 · 바람)의 취약 +25%를 2턴간 건다. 같은 원소의 특성 취약과는 높은 하나만 적용하며, 묶음이 끝나도 남는다. #전체 #특수행동 #비접촉 #주문"
    - id: 62
      verbalName: 제일 먼저 태울 곳
      codeName: AgniFirstToBurn
      description: "<로카팔라> 바루나 뒤 · 인드라 앞(+25). 같은 묶음을 연 인드라의 초월기로 얻은 특성 추공 한 건을 이 특수행동까지 보류했다가, 물 → 얼음 → 풀이 붙은 적을 중심으로 골라 집중 포격으로 바꾼다 — 중심 공격력 180%, 나머지 45%, 전원 불 부착. 공격 가능한 적에게 재료가 없으면 다른 적의 재료 하나를 중심으로 옮긴다. 보류한 추공이 없으면 아무것도 하지 않는다."
    - id: 65
      verbalName: 골드 러쉬
      codeName: KuberaGoldRush
      description: "<로카팔라> 적 전체에 공격력 100% × 금력 배율(1 + 보유 골드 ÷ (스테이지 × 100) × 15%, 최대 ×4) 피해. 이번 전투 골드 +5%(최대 +25%). #전체 #특수행동 #비접촉 #사격"
    - id: 60
      verbalName: 창야
      codeName: ChandraChangya
      description: "<로카팔라> 월광 1중첩을 얻고 모든 적에게 최대 체력의 100%에 해당하는 특수 피해를 입힌다. 실제로 입힌 피해의 20%를 살아 있는 아군 전원에게 똑같이 나눠 회복한다. 회복을 맡으므로 묶음의 맨 끝에 행동한다. #전체 #특수행동 #특수 #비접촉 #주문"
