    - { id: 61, verbalName: 전부 아니면 전무, codeName: AllOrNothing, description: "덱 전원이 로카팔라이거나 자신만 로카팔라일 경우, 레벨에 따른 성장 스탯이 1.2배가 된다." }
    - { id: 262, verbalName: 영원히 타오르는 불꽃, codeName: AgniEternalFlame, description: "필드의 불 원소 아군이 가하는 피해 +20%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다. <고유 패시브>" }
    - { id: 62, verbalName: 대마법사, codeName: AgniArchmage, description: "필드의 보주 숙련 아군이 가하는 특수 피해의 치명타 피해 +25%. 동일·하위 코드와 중복되지 않고 높은 쪽만 적용된다." }
    - { id: 263, verbalName: 뇌정 각인, codeName: IndraThunderMark, description: "<전수 불가능> 적을 타격할 때마다 2턴간 유지되는 표식을 남긴다. 표식이 4가 되면 INT의 40%에 해당하는 고정 피해를 입힌다. 치명타가 적용되지 않는다. <고유 패시브>" }
    - { id: 63, verbalName: 선두주자, codeName: IndraFrontrunner, description: "전투 종료 후 획득하는 EXP +30%." }
    - { id: 64, verbalName: 천재, codeName: IndraGenius, description: "INT 집중 훈련 시 훈련 효율 +10%." }
    - { id: 65, verbalName: 용살자, codeName: IndraDragonSlayer, description: "'용' 속성 유닛에게 가하는 피해 +40%." }
    - { id: 66, verbalName: 자기과신, codeName: IndraOverconfidence, description: "적 처치 시 특수 피해의 가하는 피해 +5%. 중첩된다." }
    - { id: 67, verbalName: 인도자, codeName: IndraGuide, description: "궁극기 코드 발동 이후 필드의 다른 아군에게 마나를 부여한다." }
    - { id: 264, verbalName: 정화의 바람, codeName: VayuPurifyingWind, description: "궁극기 발동 시 충전 1 획득(최대 2). 충전이 있고 디버프에 걸린 아군이 있으면 충전을 소모해 해로운 효과를 제거한다. <고유 패시브> <전수 불가능>" }
    - { id: 68, verbalName: 재기의 바람, codeName: VayuSecondWind, description: "체력이 40% 이하로 떨어지면 2턴에 걸쳐 최대 체력의 40%를 회복한다. 전투 중 1회." }
    - { id: 69, verbalName: 기습, codeName: VayuAmbush, description: "최대 체력인 적을 공격하면 확정 치명타가 발생하고 치명타 확률의 2배가 치명타 피해에 더해진다." }
    # ── 프레이아 ──
    - { id: 281, verbalName: 피톤치드, codeName: FreyaPhytoncide, description: "치유한 아군이 1턴에 걸쳐 최대 체력의 5%를 추가로 회복한다. 회복이 남아 있는 대상에게는 다시 걸리지 않는다. <고유 패시브> <전수 불가능>" }
    - { id: 70, verbalName: 의술, codeName: FreyaMedicine, description: "부여하는 치유와 보호막이 25% 증가한다. 의신의 가호(98)의 하위 코드이며 중복 적용되지 않는다." }
    - { id: 71, verbalName: 리더쉽, codeName: FreyaLeadership, description: "필드에 있을 경우, 모든 아군이 가하는 피해 +10%. 중첩되지 않는다." }
    - { id: 72, verbalName: 전사장, codeName: FreyaWarChief, description: "모든 전열 아군에게 STR +8." }
    # ── 로키 ──
    - { id: 282, verbalName: 펜리르, codeName: LokiFenrir, description: "소환수 펜리르를 불러낸다. 펜리르는 칸을 차지하지 않지만 체력을 가지고 피격 대상이 되며, 자기 DEX로 행동해 현재 체력이 가장 낮은 적을 문다. 로키가 쓰러지면 함께 사라진다. <고유 패시브> <전수 불가능>" }
    - { id: 73, verbalName: 소환사, codeName: LokiSummoner, description: "필드에 있는 모든 소환수가 가하는 피해 +25%. 중첩되지 않는다." }
    # ── 스카디 ──
    - { id: 283, verbalName: 북방의 수호자, codeName: SkadiNorthernGuardian, description: "일반행동을 해결할 때마다 반격 스택을 최대치(3)로 충전한다. 적에게 피격되면 반격을 예약하고, 실제로 반격이 나갈 때 1스택을 소비해 공격자에게 STR×0.8 피해를 입힌다. #접촉 #물리 #추가행동 #반격 <고유 패시브> <전수 불가능>" }
    - { id: 74, verbalName: 원소 숙련 - 얼음, codeName: CryoMastery, description: "얼음 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 75, verbalName: 원소 친화 - 얼음, codeName: SkadiCryoAffinity, description: "얼음 원소를 보유한 동안 빙결된 적을 공격하면 확정 치명타가 된다." }
    - { id: 76, verbalName: 원소술사, codeName: SkadiElementalist, description: "필드에 있을 경우, 모든 아군이 원소 반응으로 만들어낸 피해 +25%. 상위 코드와 중복 적용되지 않는다." }
    # ── 쿠베라 ──
    - { id: 265, verbalName: 대지의 계율, codeName: KuberaEarthLaw, description: "필드에 있을 경우, 모든 에어본 상태의 적이 받는 피해 +10%. <고유 패시브> <전수 불가능>" }
    - { id: 77, verbalName: 원소 친화 - 바위, codeName: KuberaGeoAffinity, description: "바위 원소를 보유한 동안 모든 접촉 공격에게 받는 피해 -25%." }
    - { id: 78, verbalName: 뿌리박기, codeName: KuberaRooting, description: "자신의 원소가 풀 혹은 바위라면 상시 에어본 면역." }
    - { id: 79, verbalName: 상인, codeName: KuberaMerchant, description: "전투에서 획득하는 골드 +25%. 중첩되지 않는다." }
    # ── 바루나 ──
    - { id: 266, verbalName: 대해의 판결, codeName: VarunaOceanVerdict, description: "필드에 있을 경우, 모든 아군이 원소 반응으로 만들어낸 피해 +40%. 원소술사(269)의 상위 코드이며 둘 다 하나만, 높은 쪽만 적용된다. <고유 패시브> <전수 불가능>" }
    - { id: 80, verbalName: 수천, codeName: VarunaWaterHeaven, description: "필드에 있을 경우, 모든 물·번개·바람 원소 아군의 치명타 피해 +25%. 중첩되지 않는다." }
    # ── 오르페우스 ──
    - { id: 225, verbalName: 죽음마저 속인 자, codeName: OrpheusCheatedDeath, description: "전투 시작 시 궁극기 비탄의 연주를 즉시 발동한다. <고유 패시브> <전수 불가능>" }
    - { id: 81, verbalName: 음유시인, codeName: OrpheusBard, description: "코드 보유자가 바람 원소라면 전투 종료 후 아군 전체 획득 EXP +5%. 중첩되지 않는다." }
    # ── 스사노오 ──
    - { id: 242, verbalName: 뇌신, codeName: SusanooRaijin, description: "바람 및 번개 원소 판정도 함께 받는다. 물·바람·번개 원소가 부착된 적을 공격할 경우 방어력의 20%를 무시한다. <고유 패시브> <전수 불가능>" }
    - { id: 82, verbalName: 파도베기, codeName: SusanooWaveCut, description: "보유자가 양손검 혹은 한손검 숙련이라면 물 속성 유닛에게 받는 피해 -30%." }

    # ── 로마 테마에서 도입한 공용 해금 패시브 ──
    - { id: 1218, verbalName: 야습, codeName: NightRaid, description: "전투 시작 시 자신의 행동 게이지를 50% 채운다. 첫 행동이 두 배 빨리 온다." }
    - { id: 83, verbalName: 카리스마, codeName: Charisma, description: "전투 종료 후 모든 아군의 획득 EXP +10%. 선두주자·음유시인과 더해진다." }
    - { id: 84, verbalName: 직감, codeName: Intuition, description: "DEX 집중 훈련 효율 +10%." }
    - { id: 85, verbalName: 전술가, codeName: Tactician, description: "필드에 있는 동안 아군 전체가 적 방어력의 10%를 무시한다." }
    - { id: 1219, verbalName: 심안, codeName: MindsEye, description: "원소가 부착된 적을 공격하면 내구를 무시하고 피해를 준 뒤 그 원소를 지운다." }
