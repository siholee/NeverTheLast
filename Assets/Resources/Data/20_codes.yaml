    - { id: 254, verbalName: 인도자, codeName: IndraGuide, description: "궁극기 코드 발동 이후 필드의 다른 아군에게 마나를 부여한다." }
    - { id: 255, verbalName: 정화의 바람, codeName: VayuPurifyingWind, description: "궁극기 발동 시 충전 1 획득(최대 2). 충전이 있고 디버프에 걸린 아군이 있으면 충전을 소모해 해로운 효과를 제거한다. <고유 패시브> <전수 불가능>" }
    - { id: 224, verbalName: 정화의 바람 (전수), codeName: VayuPurifyingWindEcho, description: "궁극기 발동 시 충전 0.5 획득(최대 1). 충전이 차면 아군 하나의 해로운 효과를 제거한다." }
    - { id: 256, verbalName: 재기의 바람, codeName: VayuSecondWind, description: "체력이 40% 이하로 떨어지면 4초에 걸쳐 최대 체력의 40%를 회복한다. 전투 중 1회." }
