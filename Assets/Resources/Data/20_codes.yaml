    - { id: 243, verbalName: 삼중봉인, codeName: SeimeiTripleSeal, description: "적에게 봉인부를 쌓는다. 한 대상이 3중첩에 도달하면 모두 소비하고, 그 대상의 다음 턴이 올 때까지 속박한다. <고유 패시브> <전수 불가능>" }
    - { id: 116, verbalName: 드러난 틈, codeName: SeimeiExposedGap, description: "자신이 새 행동불능을 건 적은 받는 피해가 10% 증가한다(2턴). 같은 효과는 겹치지 않는다." }
    - { id: 146, verbalName: 봉인진, codeName: SeimeiSealFormation, description: "필드에 있는 동안 모든 아군이 행동불능 상태인 적에게 가하는 피해가 10% 증가한다. 여러 세이메이가 있으면 중첩된다." }
