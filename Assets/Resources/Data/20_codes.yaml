    - { id: 1850, verbalName: 심연의 집정권, codeName: CoastArchonDominion, description: "체력이 6구간으로 나뉜다. 한 번의 피해는 보호막 흡수 뒤 현재 구간의 끝까지만 체력을 깎는다. 구간이 부서질 때마다 남은 갑주 보호막을 걷고 한 구간 체력 기준의 공허의 갑주를 다시 두르며, 이미 행동불능이면 새 갑주는 곧바로 벗겨진다. 마지막 구간의 끝은 실제 사망이다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1851, verbalName: 무거운 꼬리, codeName: CoastMarkerPassive, description: "꼬리 휩쓸기의 위력이 75에서 85가 된다. <적 전용> <전수 불가능>" }
    - { id: 1852, verbalName: 큰 해일, codeName: CoastMarkerPassive, description: "해일의 피해가 10% 증가한다. <적 전용> <전수 불가능>" }

