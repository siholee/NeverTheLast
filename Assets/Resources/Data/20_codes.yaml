  special:
    - id: 63
      verbalName: 바즈라
      codeName: IndraVajra
      description: "<로카팔라> 적 전체에 공격력 150% 피해. 궁극기 판정도 함께 가져 궁극기 피해 증가 효과를 받는다. 아군이 깐 버프 · 디버프를 받은 뒤 친다. #전체 #특수행동 #궁극기 #비접촉 #주문"
    - id: 61
      verbalName: 죽음의 순회
      codeName: YamaDeathRound
      description: "<로카팔라> 적 전체에 공격력 400% 피해. 인드라 뒤 · 찬드라 앞(+75)에 행동한다. 번개 부착과 지속피해 즉시 발동은 없다. #전체 #특수행동 #비접촉 #주문"
    - id: 66
      verbalName: 넘치는 판결
      codeName: VarunaOverflowingJudgment
      description: "<로카팔라> 적 전체에 공격력 70% 피해를 주고 생존한 필드 아군 전원(자신 포함)에게 바루나 현재 방어력 160%의 보호막을 준다. 바유 뒤 · 쿠베라 앞(-50)에 행동한다. 물 부착이 없어 제방 보호막도 없다. #전체 #특수행동 #비접촉 #주문"
    - id: 64
      verbalName: 태풍의 눈
      codeName: VayuEyeOfTyphoon
      description: "<로카팔라> 묶음의 처음(-100)에 적 전체에 공격력 45% 피해를 준 뒤, 생존한 적 전원에게 일곱 원소(불 · 물 · 풀 · 번개 · 얼음 · 바위 · 바람)의 취약 +25%를 2턴간 건다. 같은 원소의 특성 취약과는 높은 하나만 적용하며, 묶음이 끝나도 남는다. #전체 #특수행동 #비접촉 #주문"
    - id: 62
      verbalName: 제일 먼저 태울 곳
      codeName: AgniFirstToBurn
      description: "<로카팔라> 바루나 뒤 · 인드라 앞(+25). 같은 묶음을 연 인드라의 초월기로 얻은 특성 추공 한 건을 이 특수행동까지 보류했다가, 물 → 얼음 → 풀이 붙은 적을 중심으로 골라 집중 포격으로 바꾼다 — 중심 공격력 540%, 나머지 120%, 전원 불 부착. 공격 가능한 적에게 재료가 없으면 다른 적의 재료 하나를 중심으로 옮긴다. 보류한 추공이 없으면 아무것도 하지 않는다."
    - id: 65
      verbalName: "골드 러쉬"
      codeName: KuberaGoldRush
      description: "금력×공격력280% 전체 사격. 가용 재보를 최대3 소비하여1/2/3소비 시420/560/700%로 강화하고 후원 치피 적용. 잔고0은 소비 없이280%. 사용당 전투 골드+5%(최대25%)."
    - id: 60
      verbalName: 창야
      codeName: ChandraChangya
      description: "<로카팔라> 월광 1중첩을 얻고 모든 적에게 최대 체력의 30%에 해당하는 특수 피해를 입힌 뒤, 살아 있는 아군 각각을 찬드라 최대 체력의 8%만큼 회복한다. 치유는 적 수·피해량·치명·적 방어에 영향받지 않는다. 회복을 맡으므로 묶음의 맨 끝에 행동한다. #전체 #특수행동 #특수 #비접촉 #주문"

    - id: 67
      verbalName: 석양의 일제사격
      codeName: SuryaSunsetVolley
      description: "적 전체를 사격. 표식이 있으면 공격력600% 종언탄·방어력25%무시·불 부착(표식 보존). 미표식 적은 공격력140% 조준 사격 후 표식1을 시도한다. 일반행동 피해로 판정하며 실제 행동은 특수행동이다. #특수 #일반 #사격 #비접촉"

    - id: 161
      verbalName: "일제 사격"
      codeName: "NapoleonGrandVolley"
      description: "지정한 적에게 일반 공격을 가진 아군 전원(펜리르·공격형 분신 포함, 나폴레옹·공격하지 않는 일반행동 제외)이 자기 일반 공격을 최종 일반 공격 피해의 50%로 동시에 한 번씩 가한다. 원소 · 표식 · 다단 등 적중 효과는 그대로이며 참여자의 일반행동 · 마나 · 행동 게이지 · 턴은 생기지 않는다. 대상이 쓰러지면 다른 적으로 옮기지 않는다. #특수행동 #일반 #지휘"
