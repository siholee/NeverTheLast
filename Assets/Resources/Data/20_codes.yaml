    - { id: 1400, verbalName: 화형 심판, codeName: AswanPyreJudgment, description: "불 원소를 보유한 적에게 방어력 10% 무시, 화상 상태의 적에게 방어력 10% 무시(중복 시 최대 20%). <적 전용> <전수 불가능>" }
    - { id: 1401, verbalName: 화형 심판, codeName: AswanPyreJudgment, description: "불 원소를 보유한 적에게 방어력 20% 무시, 화상 상태의 적에게 방어력 20% 무시(중복 시 최대 40%). <적 전용> <전수 불가능>" }
