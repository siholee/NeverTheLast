# 코드 표시 데이터 — 이름과 설명. 전투 동작은 코드 클래스(Assets/Scripts/Codes)가 가진다.
#
# ID는 슬롯마다 따로다(특성 201 ≠ 궁극기 201). 규칙은 Detail_11 §1.5.
#   아군 일반행동 · 궁극기 = 유닛 ID,  아군 고유 특성 = 유닛 ID + 200
#   적 공용 = 1000번대
#
# 설명 끝의 #태그는 피해의 성질이다(Detail_02 §5). <꺾쇠>는 코드의 꼬리표다.
# 2026-09 전면 개편으로 옛 코드 표를 모두 걷어냈다. 캐릭터를 다시 만들 때마다 여기에 한 줄씩 더한다.

