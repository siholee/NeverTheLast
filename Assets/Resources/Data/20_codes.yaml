    - { id: 1800, verbalName: 공허의 갑주, codeName: CoastVoidArmor, description: "전투 시작 시 STR +40%와 최대 체력 20% 기준의 보호막을 두른다(받는 쪽 보너스 적용). 빙결·기절·에어본 같은 행동불능에 실제로 걸리면 STR 강화와 갑주가 준 남은 보호막이 함께 벗겨지고, 이 전투에서는 다시 두르지 않는다. 보호막만 깨서는 STR 강화가 남는다. <고유 패시브> <적 전용> <전수 불가능>" }
    - { id: 1811, verbalName: 날선 집게, codeName: CoastMarkerPassive, description: "집게 압착의 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
