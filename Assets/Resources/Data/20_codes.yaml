# 코드 표시 데이터 — 이름과 설명. 전투 동작은 코드 클래스(Assets/Scripts/Codes)가 가진다.
#
# ID는 슬롯마다 따로다(특성 201 ≠ 궁극기 201). 규칙은 Detail_11 §1.5.
#   아군 일반행동 · 궁극기 = 유닛 ID,  아군 고유 특성 = 유닛 ID + 200
#   적 공용 = 1000번대
#
# 설명 끝의 #태그는 피해의 성질이다(Detail_02 §5). <꺾쇠>는 코드의 꼬리표다.
# 2026-09 전면 개편으로 옛 코드 표를 모두 걷어냈다. 캐릭터를 다시 만들 때마다 여기에 한 줄씩 더한다.

codes:
  passive:
    - id: 263
      verbalName: 데바의 왕
      codeName: IndraDevaKing
      description: "<고유 특성> 필드에 있는 동안 아군 전원의 특수행동 피해 +25%. 다른 아군이 특수행동을 마칠 때마다 인드라 마나 +10."
    - id: 264
      verbalName: 바람이 남긴 길
      codeName: VayuTailwind
      description: "<고유 특성> 바유 자신의 확산이 불 · 물 · 풀 · 번개 · 얼음 · 바위를 퍼뜨리면, 원래 대상과 실제로 전달받은 적에게 그 원소의 취약을 2턴간 남긴다 — 그 원소 속성 유닛의 직접 공격에 받는 피해 +15%. 공격이 원소를 붙일 필요는 없고, 지속피해 · 원소 반응 · 덧붙는 피해는 받지 않는다. 다른 원소의 취약은 공존하며 같은 원소는 높은 하나만 적용한다."
    - id: 262
      verbalName: 끝까지 태워 주지
      codeName: AgniBurnToTheEnd
      description: "<고유 특성> 다른 필드 아군(소환수 제외)이 초월기를 실제로 마칠 때마다 추가행동으로 적 전체에 공격력 45% 피해를 주고, 적마다 피해 직후 불을 부착한다. 같은 아군에게서는 아그니의 일반행동 사이에 한 번만 받는다. 판돈(초월기) 동안에는 궁극기 피해 · 치명 판정도 함께 받는다. #전체 #추가행동 #비접촉 #주문"
    - id: 267
      verbalName: 해가 지기 전에
      codeName: SuryaBeforeSunset
      description: "<고유 특성> 전투를 시작하면 적 하나를 현상수배한다(낮은 체력 비율 우선). 수배된 적은 아군의 추가행동에 받는 피해 +15%. 탄환 2발로 시작하며, 다른 아군의 직접 공격이 수배된 적에게 피해를 주면 탄환 1발로 공격력 55% 단일 추가행동 사격으로 응답한다(실제 행동 하나에 한 번). 수배된 적이 쓰러지면 다음 적을 수배한다. #단일 #추가행동 #비접촉 #사격"
    - id: 261
      verbalName: 죽음의 선고
      codeName: YamaDeathVerdict
      description: "<고유 특성> 야마가 살아서 전장에 있는 동안, 감전 상태의 적에게 선고(해로운 상태)를 내린다 — 야마의 아군에게 받는 모든 피해 +20%. 감전의 출처 · 개수와 무관하게 선고는 하나이며, 마지막 감전이 사라지면 함께 사라진다. 효과 명중 · 상태 저항 판정은 없고, 감전이 남아 있으면 선고만 지워도 다시 붙는다."
    - id: 266
      verbalName: 법이 만든 제방
      codeName: VarunaLawLevee
      description: "<고유 특성> 자신의 행동으로 적에게 물을 부착하면 현재 방어력 35%의 보호막을 자신에게 얻는다. 광역 · 확산으로 여러 명에게 붙어도 행동당 한 번이며, 기존 보호막에 누적된다. 물 부착이 없는 특수행동에서는 발동하지 않는다."
    - id: 265
      verbalName: 재보천의 후원
      codeName: KuberaPatronage
      description: "<고유 특성> 필드에 있는 동안 아군 소환수가 주는 피해 +20%. 아군이 소환수를 생성할 때마다 보물 +1(보고 개방이 만든 소환수 제외). 승리하면 이번 전투에서 생성된 소환수 1기당 전투 골드 +1%(최대 +25%)."
    - id: 321
      verbalName: 영혼 수확
      codeName: AnubisSoulHarvest
      description: "<고유 특성> 살아서 필드에 있는 동안 유닛이 쓰러지면 영혼을 영구히 거둔다(일반 적 1 · 정예 2 · 보스 3 · 아군 1 · 소환수 0.25). 영혼 1당 최대 체력 +8, 방어력 · 특수방어력 +0.4. 영혼 50: 피격 마나 2배 · 150: 사자의 서 4턴 · 300: 전투 시작 시 방어력 270% 보호막."
    - id: 380
      verbalName: 도사란 무엇인가
      codeName: UchiTaoist
      description: "<고유 특성> 분신을 최대 3기 거느린다. 분신은 고정 속도 70으로 제 차례에 우치 공격력 120%로 한 번 치고 사라진다. 상한에서 새 분신이 생기면 가장 오래된 분신이 즉시 60%로 치고 사라진다. 우치가 최대 체력 15% 이상인 한 방을 맞으면 분신 1기가 대신 맞고 사라진다(한 적 행동당 1기)."
    - id: 201
      verbalName: 빅뱅
      codeName: SeiBigBang
      description: "<고유 특성> 고유 중첩 '창세의 결정'을 가진다. 필드 위에 보호막을 두른 아군이 공격을 받을 때마다 1중첩을 얻는다. 창세의 결정이 7개 모이면 무작위 적에게 방어력의 25%에 해당하는 작은 바위 조각 7개를 발사한다. 이 공격은 대상 우선도를 무시한다. <추가> 이후 아군 전체에게 100 + 방어력의 5%에 해당하는 보호막을 부여한다. #다중 #특성 #비접촉"
    - id: 202
      verbalName: 멸망의 시
      codeName: ShiFinalVerse
      description: "<고유 특성> 다른 아군의 공격 직후 멸참의 공격력 250% 피해가 대상의 방어력과 현재 체력만으로 처치에 충분한 적이 있으면, 가장 현재 체력이 낮은 적에게 멸참을 특수행동으로 사용한다. 처형 예측은 치명타·보호막·피해 증감·원소 반응·추가 피해를 세지 않는다."
    - id: 203
      verbalName: 빈틈 포착
      codeName: SabahDebuffHunter
      description: "<고유 특성> 공격 대상의 디버프(지속피해 포함) 1개당 가하는 피해가 4% 증가한다. 아군이 적에게 해로운 상태를 부여·갱신하거나, 아군이 건 지속피해가 적에게 피해를 줄 때마다 아즈라엘 1중첩을 얻는다."
    - id: 207
      verbalName: 철권제재
      codeName: JeanIronSanction
      description: "<고유 특성> 전투 시작 시 철권제재 기회를 기본 횟수만큼 얻고, 일반행동을 해결할 때마다 현재 최대치까지 회복한다. 적의 직접 공격 최종 대상에 잔이 포함되면 기회 1회를 소모해 그 공격자에게 신성한 일격을 먼저 사용한다. 이 피해는 일반공격·추가공격·반격으로 함께 판정한다. 지속피해·원소 반응·특성 간접 피해·덧붙는 피해에는 발동하지 않는다. #단일 #일반 #추가행동 #반격 #접촉 #물리"
    - id: 220
      verbalName: 갈라테아
      codeName: PygmalionGalatea
      description: "<고유 특성> 피그말리온은 소환수로도 간주된다. 피그말리온이 필드에 있는 동안 모든 아군이 가하는 피해가 15% 증가하며, 소환수는 대신 30% 증가한다."
    - id: 244
      verbalName: 맹화
      codeName: HimikoBlaze
      description: "<고유 특성> 한 대상에게 여러 번 쌓이는 중립 표식 맹화를 부여한다. 3중첩이 되면 표식을 모두 지우고 2턴 동안 받는 피해 +15% 디버프 하나와 히미코 공격력 100%의 고정 피해를 준다. 행동을 빼앗지는 않지만 제어를 받은 것으로 간주해 집중을 끊는다."
    - id: 260
      verbalName: 니샤카라
      codeName: ChandraNishakara
      description: "<고유 특성> 고유 중첩 '월광'을 가진다. 피해로 체력이 최대 체력의 30% 이하가 되면 월광 1중첩을 소모하고 최대 체력의 50%만큼 즉시 회복한다. 치명상이면 사망 판정 전에 발동한다. 달빛 순환 — 필드에 있는 동안 아군이 특수행동을 마칠 때마다 그 아군이 찬드라 최대 체력의 4%를 회복한다(같은 아군은 자기 턴 사이 1회)."
    - id: 322
      verbalName: 든든한 경호대가 있다고!
      codeName: BastetReliableGuard
      description: "<고유 특성> 바스테트가 직접 공격의 대상이 되고 그 공격의 확정 대상 목록에 다른 경호 자격자가 없으면, 필드의 견고 또는 반격 아군 한 명이 대신 대상이 된다. 반격 보유 여부 → 타겟 우선도 → 전열 → 남은 체력 비율 → 낮은 ID 순으로 고른다. 특성이 직접 가하는 간접 공격은 경호하지 않으며 추가행동 같은 행동 공격은 경호한다."

