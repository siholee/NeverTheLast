codes:
  passive:
    - id: 180
      verbalName: 홀리 인챈트
      codeName: HolyEnchant
      description: "모든 아군의 치명타 확률이 10% 증가한다. <전수 불가능>"
    - id: 221
      verbalName: 약점 추적
      codeName: AtalanteWeaknessTracker
      description: "공격 대상의 디버프 1개당 방어력을 5% 무시한다(최대 20%). <고유 패시브> <전수 불가능>"
    - { id: 44, verbalName: 궁수, codeName: AtalanteArcher, description: "활 계열 무기를 장착하고 숙련되어 있으면 STR +5%." }
    - { id: 45, verbalName: 민첩함, codeName: AtalanteAgility, description: "DEX +5%." }
    - { id: 46, verbalName: 유리대포, codeName: AtalanteGlassCannon, description: "최대 체력 -25%, 적 방어력 20% 무시." }
    - { id: 47, verbalName: 사냥꾼, codeName: AtalanteHunter, description: "짐승 또는 괴수 분류의 적에게 가하는 피해 +30%." }
    - { id: 48, verbalName: 맹독, codeName: AtalanteVirulentPoison, description: "스킬 공격 적중 시 2턴간 턴마다 20+CON의 5% 지속피해를 부여한다." }
    - { id: 49, verbalName: 저격수, codeName: AtalanteSniper, description: "후열에서 적 후열 공격 시 가하는 피해 +20%." }
    - { id: 50, verbalName: 사냥신의 가호, codeName: AtalanteHuntressBlessing, description: "최대 체력이 아닌 적과 지속피해 대상에게 조건당 가하는 피해 +20%." }
    - id: 260
      verbalName: 니샤카라
      codeName: ChandraNishakara
      description: "<전수 불가능> INT의 [25/50/100]%에 해당하는 CON을 획득한다."
    - id: 220
      verbalName: 갈라테아
      codeName: GalateaPassive
      description: "피그말리온이 소환수 판정을 받아 소환수 대상 효과를 적용받는다. <고유 패시브> <전수 불가능>"
    - id: 202
      verbalName: 시의 종언
      codeName: ShiFinalVerse
      description: "일반행동 적중으로 종언 스택을 쌓고 단계별 추가행동을 발동한다. <전수 불가능>"
    - { id: 9, verbalName: 검의 달인, codeName: ShiSwordMaster, description: "베기류 공격의 가하는 피해가 25% 증가한다." }
    - { id: 10, verbalName: 신속, codeName: ShiSwiftness, description: "바람 원소가 부착되어 있는 동안 DEX +10." }
    - { id: 11, verbalName: 천살성, codeName: HeavenlyKiller, description: "공격 후 최대 체력의 8% 미만인 적을 즉시 처형한다. 일반 등급의 적에게만 적용된다." }
    - { id: 12, verbalName: 화무십일홍, codeName: ShiTenDaysNoFlower, description: "체력 10% 미만인 적 공격 시 확정 치명타. 치명타 확률의 2배가 해당 공격의 치명타 피해에 더해진다." }
    - { id: 13, verbalName: 당연한 운명, codeName: ShiCertainDestiny, description: "천살성 보유 시 처형 기준을 최대 체력의 12% 미만으로 대체한다. 일반 등급의 적에게만 적용된다." }
    - id: 182
      verbalName: 막기
      codeName: Block
      description: "2턴마다 [5/15/25]% 확률로 CON*0.8+[100/200/300]의 방어막 획득 #물리"
    - id: 1
      verbalName: 성채
      codeName: ChandraBastion
      description: "방어막 보너스 +25%"
    - id: 181
      verbalName: 갑옷 숙련
      codeName: ArmorTrainingPassive
      description: "받는 피해가 3% 감소한다. <장비 전용>"
    - id: 2
      verbalName: 기사회생
      codeName: ChandraSecondWind
      description: "체력이 25% 미만으로 떨어지면 3턴에 걸쳐 최대 체력의 60%를 회복한다. 전투당 1회."
    - id: 3
      verbalName: 보루
      codeName: ChandraBulwark
      description: "아군에게 이로운 효과를 얻으면 2턴간 STR +4"
    - id: 4
      verbalName: 배수의 진
      codeName: ChandraLastStandFormation
      description: "전열에 자신 외 아군이 없을 경우, CON +12"
    - id: 5
      verbalName: 목욕제계
      codeName: ChandraPurificationBath
      description: "전투 페이즈 종료 후, 모든 아군의 체력을 최대 체력의 CON%만큼 치유"
    - id: 6
      verbalName: 철벽
      codeName: IronWallPassive
      description: "일반행동을 할 때마다 이번 전투 동안 CON +2. 중첩된다."
    - id: 14
      verbalName: 월광
      codeName: ChandraMoonlight
      description: "아군에게 이로운 효과를 부여할 경우, 바람 원소 부여"
    - { id: 340, verbalName: 풍요의 축복, codeName: QuetzalcoatlBounty, description: "필드의 풀 아군 1명당 아군 전체의 가하는 피해가 [5/10/15]% 증가한다. <전수 불가능>" }
    - { id: 15, verbalName: 학식, codeName: ScholarshipPassive, description: "서포트 카드로서 INT 집중 훈련에 배치되면 INT 훈련 효율 +10%." }
    - { id: 16, verbalName: 행운아, codeName: QuetzalcoatlLucky, description: "LUK +4." }
    - { id: 17, verbalName: 예리함, codeName: QuetzalcoatlOvercritScholar, description: "100%를 초과한 치명타 확률의 1.5배를 치명타 피해로 전환한다." }
    - { id: 18, verbalName: 명상, codeName: QuetzalcoatlMeditation, description: "전투 중 턴마다 INT +1." }
    - { id: 19, verbalName: 날개 달린 뱀, codeName: QuetzalcoatlWingedSerpent, description: "10턴마다 3턴간 모든 아군이 턴마다 케찰코아틀 INT/10만큼 마나를 회복한다. <전수 불가능>" }
    - { id: 222, verbalName: 시리우스, codeName: OrionGeoAffinity, description: "피해를 받거나 HP를 소모하면 한 행동당 충전 1스택을 얻는다(최대 5). 5스택이 되면 모두 소비하고 소환수 시리우스가 적 전체에게 STR×1.2 피해를 가한다. #물리 #접촉 #추가행동 #반격 <고유 패시브> <전수 불가능>" }
    - { id: 20, verbalName: 중갑병, codeName: OrionHeavyInfantry, description: "숙련된 중갑을 장착했다면 중갑 아이템이 제공하는 내구도 +20%." }
    - { id: 21, verbalName: 명사수, codeName: OrionMarksman, description: "활 계열 무기 장착 중 단일 대상 피해를 입히면 STR만큼 고정 피해를 추가한다." }
    - { id: 22, verbalName: 파수꾼, codeName: OrionSentinel, description: "전열에 있을 때 필드의 후열 아군 하나당 STR +1." }
    - { id: 223, verbalName: 코드 직조, codeName: TheseusCodeWeave, description: "일반 코드 발동 시 0.25스택, 궁극기 코드 발동 시 1스택을 얻는다(최대 3). 1스택을 소비해 다음 일반행동을 강화한다. <고유 패시브> <전수 불가능>" }
    - { id: 23, verbalName: 원소 친화 - 물, codeName: TheseusHydroAffinity, description: "물 원소 보유 중 올스탯 +1, 마나 회복 효율 +20%." }
    - { id: 183, verbalName: 팔랑크스, codeName: GreekPhalanx, description: "팔랑크스를 가진 필드의 아군 수 n에 비례해 전투 시작 시 CON 기반 위력 30*n의 보호막을 얻고, 상시 가하는 피해가 5%*n 증가한다. 모든 Greek 유닛이 자동 보유. <전수 불가능>" }
    - { id: 25, verbalName: 자가치유, codeName: TheseusSelfHealing, description: "턴마다 CON만큼 회복한다. 물 또는 풀 원소 보유 시 2배이며 두 원소가 중첩되어도 2배를 넘지 않는다." }
    - { id: 26, verbalName: 과다치유, codeName: TheseusOverheal, description: "최대 체력을 넘긴 회복량의 25%를 보호막으로 전환한다." }
    - { id: 224, verbalName: 생명의 잔, codeName: AsclepiusNashorsTooth, description: "궁극기 사용 후 2턴간 DEX가 40 증가한다. <고유 패시브> <전수 불가능>" }
    - { id: 240, verbalName: 태양의 박자, codeName: AmaterasuSunRhythm, description: "일반행동 적중 시 3턴간 DEX +4. 최대 6중첩. <고유 패시브> <전수 불가능>" }
    - { id: 27, verbalName: 투명, codeName: AmaterasuConcealment, description: "체력이 35% 이하일 때 대상 지정 우선도 -1." }
    - { id: 28, verbalName: 폭죽놀이, codeName: AmaterasuFireworks, description: "4번째 일반행동마다 무작위 적에게 DEX 기반 위력 20의 단일 피해를 주는 폭죽 4발을 발사한다." }
    - { id: 29, verbalName: 파죽지세, codeName: AmaterasuBreakthrough, description: "피해를 준 적의 처치에 관여하면 2턴간 주스탯 +12." }
    - { id: 30, verbalName: 치명적인 치유, codeName: AsclepiusCriticalTreatment, description: "치유와 보호막이 치명타 확률로 치명타 피해 배율만큼 증가한다." }
    - { id: 31, verbalName: 마나 호흡법, codeName: AsclepiusManaBreathing, description: "INT가 제공하는 마나 회복 효율 기여분을 1.2배로 만든다." }
    - { id: 32, verbalName: 의신의 가호, codeName: AsclepiusDivineMedicine, description: "부여하는 치유와 보호막이 50% 증가하고 받은 대상의 부정 상태를 모두 제거한다." }
    - { id: 51, verbalName: 약자 멸시, codeName: PygmalionWeaklingContempt, description: "공격자의 지속피해 종류 하나당 받는 피해가 1% 감소한다(최대 20%)." }
    - { id: 52, verbalName: 천천히 꾸준히, codeName: PygmalionSlowAndSteady, description: "자신이 부여하는 지속피해가 25% 증가한다." }
    - { id: 53, verbalName: 날카로운 가시, codeName: PygmalionSharpThorns, description: "접촉 피해를 받으면 공격자에게 2턴간 받는 치유량 50% 감소를 부여한다." }
    - { id: 54, verbalName: 사랑신의 가호, codeName: PygmalionLoveGodBlessing, description: "접촉 분류 기술에게 받는 피해가 25% 감소한다." }
    # 옛 열화 전수본(230·231·233)은 제도 폐지와 함께 삭제했다.
    # 232만 이시스의 독립 해금 패시브 '생명의 물'로 남는다.
    - { id: 55, verbalName: 생명의 물, codeName: InheritedAsclepiusNashorsTooth, description: "궁극기 사용 후 2턴간 DEX가 20 증가한다." }
    # 일반 등급 적은 테마별로 아래 네 단계 성장 패시브를 공유한다.
    - { id: 1000, verbalName: 북방의 기세, codeName: NordCommonSpirit, description: "주는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1001, verbalName: 혹한의 강인함, codeName: NordCommonToughness, description: "받는 피해가 5% 감소한다. <적 전용> <전수 불가능>" }
    - { id: 1002, verbalName: 약탈자의 숙련, codeName: NordCommonMastery, description: "주는 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1003, verbalName: 노르드의 노련함, codeName: NordCommonVeteran, description: "코드 가속이 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1008, verbalName: 검투사의 기백, codeName: ColosseumCommonSpirit, description: "주는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1009, verbalName: 관중의 함성, codeName: ColosseumCommonToughness, description: "받는 피해가 5% 감소한다. <적 전용> <전수 불가능>" }
    - { id: 1010, verbalName: 투기장 무기술, codeName: ColosseumCommonMastery, description: "주는 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1011, verbalName: 백전노장, codeName: ColosseumCommonVeteran, description: "코드 가속이 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1012, verbalName: 군단의 기세, codeName: LegionCommonSpirit, description: "주는 피해가 5% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1013, verbalName: 방진의 견고함, codeName: LegionCommonToughness, description: "받는 피해가 5% 감소한다. <적 전용> <전수 불가능>" }
    - { id: 1014, verbalName: 규율 숙련, codeName: LegionCommonMastery, description: "주는 피해가 10% 증가한다. <적 전용> <전수 불가능>" }
    - { id: 1015, verbalName: 백인대의 노련함, codeName: LegionCommonVeteran, description: "코드 가속이 10% 증가한다. <적 전용> <전수 불가능>" }
    - id: 241
      verbalName: 월식 정산
      codeName: TsukuyomiMoonReckoning
      description: "필드에 있는 동안 지속피해 상태의 적이 처치되면 1턴간 받을 지속피해의 [50/75/100]%를 주변에 범위 피해로 입힌다. <전수 불가능>"
    - id: 33
      verbalName: 주문 보호막
      codeName: TsukuyomiSpellShield
      description: "4턴마다 공격 1회를 무효화하는 INT 50%의 보호막을 획득한다. 보호막이 남아 있는 동안에는 주기를 세지 않는다."
    - id: 34
      verbalName: 변덕쟁이
      codeName: TsukuyomiFickle
      description: "턴마다 서로 다른 기본 스탯 하나가 10% 상승하고 하나가 10% 하락한다."
    - id: 1016
      verbalName: 저주
      codeName: CursePassive
      description: "자신이 부여하는 지속피해량이 20% 증가한다. 죽음의 계약(261)의 일반 등급이며 함께 들면 발동하지 않는다."
    - id: 35
      verbalName: 상처 벌리기
      codeName: TsukuyomiWidenWound
      description: "지속피해 디버프를 가진 유닛을 공격할 때 방어력 45%를 무시하고 3턴간 받는 치유량을 50% 감소시킨다. 다른 치유량 감소와 중첩되지 않으며 더 긴 남은 지속시간만 유지한다."
    - id: 36
      verbalName: 고통스러운 상처
      codeName: TsukuyomiPainfulWound
      description: "지속피해 디버프를 가진 최대 체력이 아닌 유닛을 공격하면 3턴간 받는 치유량을 50% 감소시킨다."
    - id: 37
      verbalName: 순환
      codeName: TsukuyomiCycle
      description: "같은 진영의 유닛이 사망하면 무작위 생존 아군 하나가 주는 피해 25% 증가, 받는 피해 25% 감소를 얻는다."
    - id: 184
      verbalName: 체인 라이트닝
      codeName: TsukuyomiChainLightning
      description: "4번째 일반행동 적중 후 대상에게 번개 원소를 부여하고 주변 3명에게 일반행동 피해의 50%를 입힌다."
    - id: 38
      verbalName: 만월
      codeName: TsukuyomiFullMoon
      description: "일본 테마 또는 밤 필드에서 주는 피해 50% 증가, 받는 피해 50% 감소. <전수 불가능>"
    - id: 280
      verbalName: 황혼
      codeName: SurtrTwilight
      description: "적을 공격할 때 공격한 대상마다 아군 전체에게 50+STR×0.5의 방어막을 부여한다. <고유 패시브> <전수 불가능>"
    - { id: 39, verbalName: 거인, codeName: GiantPassive, description: "STR +5%." }
    - { id: 185, verbalName: 원소 숙련 - 불, codeName: SurtrFireMastery, description: "불 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 186, verbalName: 원소 숙련 - 물, codeName: HydroMastery, description: "물 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 187, verbalName: 원소 숙련 - 바람, codeName: AnemoMastery, description: "바람 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 188, verbalName: 원소 숙련 - 풀, codeName: DendroMastery, description: "풀 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 189, verbalName: 원소 숙련 - 바위, codeName: GeoMastery, description: "바위 원소를 보유한 적에게 주는 피해가 10% 증가한다." }
    - { id: 40, verbalName: 천상의 신체, codeName: SurtrCelestialBody, description: "받는 치유와 보호막 효과가 25% 증가한다." }
    - { id: 41, verbalName: 투사, codeName: LifestealFighter, description: "가한 피해의 8%만큼 체력을 회복한다." }
    - { id: 42, verbalName: 클러치 플레이어, codeName: SurtrClutchPlayer, description: "잃은 체력 비율의 50%만큼 주는 피해가 증가한다." }
    - { id: 43, verbalName: 신살자, codeName: SurtrGodslayer, description: "최대 체력이 자신의 150% 이상인 적에게 주는 피해가 25% 증가한다." }
    # 콜로세움 일반 병종은 109~112 공통 적 패시브를 사용한다.
    - { id: 1100, verbalName: 챔피언의 여유, codeName: ColosseumPassive164, description: "체력이 절반 이상이면 받는 피해가 감소하고, 절반 미만이면 주는 피해가 증가한다. <전수 불가능>" }
    - { id: 1101, verbalName: 세 번의 승부, codeName: ColosseumPassive165, description: "일반행동이 방패 가격, 대검 내려치기, 회전 베기 순서로 변화한다. <전수 불가능>" }
    - { id: 1102, verbalName: 월계관의 정화, codeName: ColosseumPassive166, description: "궁극기 사용 시 해로운 효과 하나를 제거한다. <전수 불가능>" }
    - { id: 1103, verbalName: 결승의 투지, codeName: ColosseumPassive167, description: "체력이 절반 미만이면 주는 피해와 행동 속도가 증가한다. <전수 불가능>" }
    - { id: 1104, verbalName: 사냥꾼의 표식, codeName: ColosseumPassive168, description: "최대 체력이 가장 높은 적에게 표식을 부여하여 받는 피해를 20% 증가시킨다. <전수 불가능>" }
    - { id: 1105, verbalName: 채찍 견제, codeName: ColosseumPassive169, description: "일반행동으로 때린 적이 주는 피해를 3턴간 20% 감소시킨다. <전수 불가능>" }
    - { id: 1106, verbalName: 집중 사냥, codeName: ColosseumPassive170, description: "궁극기 사용 시 아군이 표식 대상에게 주는 피해가 증가한다. <전수 불가능>" }
    - { id: 1107, verbalName: 다음 사냥감, codeName: ColosseumPassive171, description: "표식 대상이 사망하면 새로운 대상에게 표식을 옮긴다. <전수 불가능>" }
    - { id: 1112, verbalName: 몸이 풀리는군, codeName: ColosseumPassive176, description: "공격하거나 피해를 받을 때 행동 속도가 증가한다. 최대 5중첩. <전수 불가능>" }
    - { id: 1113, verbalName: 노련한 검투사, codeName: ColosseumPassive177, description: "전투당 처음 받는 제어 효과를 무효화한다. <전수 불가능>" }
    - { id: 1114, verbalName: 목숨값, codeName: ColosseumPassive178, description: "체력이 40% 미만이면 받는 피해가 30% 감소하고 피해의 20%를 회복한다. <전수 불가능>" }
    - { id: 1115, verbalName: 다시 한 판, codeName: ColosseumPassive179, description: "전투당 한 번 치명 피해를 버티고 최대 체력의 30%를 회복하며 궁극기를 준비한다. <전수 불가능>" }
    - { id: 201, verbalName: 빅뱅, codeName: SeiBigBang, description: "<고유 패시브> <전수 불가> 3턴마다 무작위 적에게 투사체 6발을 각각 따로 조준해 발사한다. 각 타수는 INT 기반 위력 40. #특수 #비접촉 #추가행동" }
    - { id: 204, verbalName: 사그리다 파밀리아, codeName: GaudiSagradaFamilia, description: "<고유 패시브> <전수 불가> 일반행동이 적중할 때 스택 +1(최대 6). 자신 또는 적중 대상에게 바위 원소가 부착되어 있으면 +2. 6스택을 소비해 다음 일반행동을 강화하며, 대체행동은 스택을 획득하지 않는다." }
    - { id: 207, verbalName: 최고의 방어, codeName: JeanBestDefense, description: "<고유 패시브> <전수 불가> 고유 중첩 3으로 전투를 시작한다. 적의 행동 대상으로 지정되면 중첩 1을 소모하고 상대의 행동보다 먼저 대체행동 철권제재(STR 기반 위력 80)를 꽂는다. #반격 #추가행동 #물리 #접촉" }
    - { id: 104, verbalName: 오사방지, codeName: JeanMisfireGuard, description: "아군이 아군에게 만드는 해로운 원소 반응(제어·즉발·지속피해·디버프)이 일어나지 않는다. 적이 건 반응은 막지 않는다." }
    - { id: 105, verbalName: 피지컬 코치, codeName: JeanPhysicalCoach, description: "서포트 카드로서 STR 집중 훈련에 배치되면 STR 훈련 효율 +10%." }
    - { id: 106, verbalName: 벌크업, codeName: JeanBulkUp, description: "전투 시작 후 첫 일반행동이 대체행동 벌크업으로 바뀐다. 벌크업은 자신의 STR을 10% 올리며 중첩된다." }
    - { id: 107, verbalName: 기수, codeName: JeanStandardbearer, description: "우선도 +1을 상시로 유지한다. 사실상 꺼지지 않는 도발이다." }
    - { id: 206, verbalName: 일렉트릭 필드, codeName: NicoleElectricField, description: "<고유 패시브> <전수 불가> 필드에 있는 동안 번개 원소를 두른 아군이 가하는 피해 +20%. 또한 아군은 각자 5회 행동할 때마다 번개 원소를 부착한다. 행동은 턴과 달리 일반행동·궁극기·추가행동을 모두 센다." }
    - { id: 205, verbalName: 위대한 비행, codeName: LightGreatFlight, description: "<고유 패시브> <전수 불가> 필드의 아군이 발동형 궁극기를 사용하면 고유 스택 +1(최대 12). 하늘을 나는 꿈 사용 시 3스택 이상이면 3을 소비하여 원소 제거와 함께 모든 해로운 상태도 제거한다." }
    - { id: 7, verbalName: 사전준비, codeName: SeiPreparation, description: "전투 시작 시 궁극기 충전량이 100%가 된다. 마나를 쓰지 않는 특수 궁극기 보유자에게는 효과가 없다." }
    - { id: 8, verbalName: 창세의 노래, codeName: SeiFirstSong, description: "<전수 불가> 전투 중 최초로 궁극기를 발동하면 아군 전체의 궁극기 충전량이 100%가 된다. 특수 궁극기 보유자에게도 적용된다." }

    # ── 베다 진영 ──
    - { id: 261, verbalName: 죽음의 계약, codeName: YamaDeathContract, description: "야마가 필드에 있는 동안 모든 아군이 가하는 지속피해 +30%. 저주(123)의 강화 등급이며 높은 쪽만 적용된다. <고유 패시브> <전수 불가능>" }
