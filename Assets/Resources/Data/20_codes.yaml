codes:
  passive:
    - { id: 303, verbalName: 아르고의 응답, codeName: JasonArgonautResponse, description: "<고유 패시브> <전수 불가> 아군이 궁극기를 발동하면 아르고의 지원을 추가행동으로 예약한다. 아군의 궁극기 한 번에 최대 1회 반응하며, 자신의 턴이 오면 다시 반응할 수 있다." }
    - { id: 139, verbalName: 가정 신의 가호, codeName: JasonHouseholdBlessing, description: "카피바라의 금색 상위 코드. 우정도 획득량이 50% 증가한다." }
    - { id: 141, verbalName: 포수, codeName: JasonGunner, description: "필드에 배치되어 있을 경우 모든 아군의 궁극기 피해 +10%. 여러 포수 효과는 중첩된다." }
    - { id: 454, verbalName: 황금양모의 광휘, codeName: GoldenFleeceItemPassive, description: "착용자의 LUK만큼 내구도를 얻는다. <장비 전용>" }
    - { id: 208, verbalName: 질량 보존, codeName: LavoisierMassConservation, description: "<고유 패시브> <전수 불가> 아군의 치유·보호막·버프를 받으면 각각 연료·안정제·촉매를 얻는다. 저장 한도는 각 20+CON, 수신량은 한도의 50%. 같은 아군·종류는 자신의 턴 간격마다 1회. 과잉 치유는 연료로만 센다. 자가 지원은 제외. 마나 대신 일반행동으로 반응 준비도를 얻는다." }
    - { id: 209, verbalName: 군상극, codeName: HugoEnsemble, description: "필드에 존재하면 모든 아군 소환수 피해 +1%. 아군이 소환수를 소환할 때마다 소환수 피해 +1%가 전투 중 중첩된다. <고유 패시브> <전수 불가능>" }
    - { id: 210, verbalName: 언어의 창조자, codeName: ShakespeareLanguageCreator, description: "아군 소환수가 생성·소멸·행동할 때 언어 1을 얻는다. 아군 소환수의 공격 시 언어 1을 소비해 확정 치명타를 만들고, 기존 치명타 확률을 치명타 피해로 전환한다. <고유 패시브> <전수 불가능>" }
    - { id: 144, verbalName: 시인, codeName: HugoPoet, description: "자신의 소환수가 공격할 때 치명타 피해 +20%. 상위: 대문호(145)." }
    - { id: 145, verbalName: 대문호, codeName: HugoGreatWriter, description: "시인의 금색 상위 코드. 자신의 소환수가 공격할 때 치명타 피해 +40%." }
    - { id: 456, verbalName: 은총, codeName: GraceItemPassive, description: "자가치유의 금색 상위 코드. 자신의 턴마다 CON×2만큼 회복한다. <장비 전용> <전수 불가능>" }
    - { id: 457, verbalName: 레미제라블, codeName: LesMiserablesItemPassive, description: "보유한 소환수 하나마다 착용자가 보유한 소환수의 피해 +10%. <장비 전용> <전수 불가능>" }
    - { id: 458, verbalName: 이름모를 용병의 방패, codeName: NamelessMercenaryShieldItemPassive, description: "내구로 타격을 완전히 상쇄할 때마다 영속 중첩 +1. 중첩마다 내구 +1. 전투가 끝나도 유지되며 장착 해제·소유자 변경 시 초기화된다. <장비 전용> <전수 불가능>" }
    - { id: 459, verbalName: 저주받은 왕관, codeName: CursedCrownItemPassive, description: "치명타는 대상 내구의 50%를 무시한다. 착용한 채 전투 패배로 LIFE가 감소하면 감소량이 2배가 된다. <장비 전용> <전수 불가능>" }
    - { id: 460, verbalName: 주문 복제, codeName: SpellReplicationItemPassive, description: "공격 코드를 발동하면 그 공격의 순수 피해만 20% 위력으로 즉시 반복한다. 부가 효과는 반복하지 않으며 이전 공격과 하나의 행동으로 취급한다. <장비 전용> <전수 불가능>" }
    - { id: 461, verbalName: 제국의 메아리, codeName: ImperialEchoItemPassive, description: "주문 복제의 금색 상위 코드. 공격 코드를 발동하면 그 공격의 순수 피해만 40% 위력으로 즉시 반복한다. <장비 전용> <전수 불가능>" }
    - { id: 462, verbalName: 황금 갑주, codeName: GoldenArmorItemPassive, description: "현재 파티가 보유한 골드 1당 착용자가 가하는 피해가 0.1% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 463, verbalName: 마네키네코, codeName: ManekiNekoItemPassive, description: "전투 후 획득하는 골드가 20% 증가한다. <장비 전용> <전수 불가능>" }
    - { id: 464, verbalName: 지구온난화의 원흉, codeName: PirateDrumItemPassive, description: "받는 피해를 착용자의 LUK만큼 덜어 낸다. <장비 전용> <전수 불가능>" }
    - { id: 465, verbalName: 아마존의 가죽, codeName: AmazonArmorItemPassive, description: "지속피해로 받는 피해가 50% 감소한다. <장비 전용> <전수 불가능>" }
    - { id: 466, verbalName: 찰(扎), codeName: AmazonSpearItemPassive, description: "찌르기 태그 공격이 가하는 피해 +10%. <장비 전용> <전수 불가능>" }
    - { id: 467, verbalName: 순결의 서약, codeName: VowOfChastityItemPassive, description: "적의 피해로 체력이 줄지 않은 동안 가하는 피해 +25%. 전투가 끝나면 초기화된다. <장비 전용> <전수 불가능>" }
    - id: 180
      verbalName: 홀리 인챈트
      codeName: HolyEnchant
      description: "모든 아군의 치명타 확률이 10% 증가한다. <전수 불가능>"
    - id: 221
      verbalName: 약점 추적
      codeName: AtalanteWeaknessTracker
      description: "공격 대상의 디버프 1개당 방어력을 5% 무시한다(최대 20%). <고유 패시브> <전수 불가능>"
    - { id: 44, verbalName: 궁수, codeName: AtalanteArcher, description: "활 계열 무기를 장착하고 숙련되어 있으면 STR +5%." }
    - { id: 45, verbalName: 민첩함, codeName: AtalanteAgility, description: "DEX +5%." }
    - { id: 46, verbalName: 유리대포, codeName: AtalanteGlassCannon, description: "최대 체력 -25%, 적 방어력 20% 무시." }
    - { id: 47, verbalName: 사냥꾼, codeName: AtalanteHunter, description: "짐승 또는 괴수 분류의 적에게 가하는 피해 +30%." }
    - { id: 48, verbalName: 맹독, codeName: AtalanteVirulentPoison, description: "스킬 공격 적중 시 2턴간 턴마다 20+CON의 5% 지속피해를 부여한다." }
    - { id: 49, verbalName: 저격수, codeName: AtalanteSniper, description: "후열에서 적 후열 공격 시 가하는 피해 +20%." }
    - { id: 50, verbalName: 사냥신의 가호, codeName: AtalanteHuntressBlessing, description: "최대 체력이 아닌 적과 지속피해 대상에게 조건당 가하는 피해 +20%." }
    - { id: 260, verbalName: 니샤카라, codeName: ChandraNishakara, description: "<고유 패시브> <전수 불가능> 전투 시작 시 자신의 CON 10%를 아군 전체에게 부여한다." }
    - id: 220
      verbalName: 갈라테아
      codeName: GalateaPassive
      description: "필드에 배치되어 있으면 모든 아군 소환수가 가하는 피해 +30%. 피그말리온도 소환수 판정을 받아 소환수 대상 효과를 적용받는다. <고유 패시브> <전수 불가능>"
    - id: 202
      verbalName: 시의 종언
      codeName: ShiFinalVerse
      description: "일반행동 적중으로 종언 스택을 쌓는다. 3중첩에서는 레벨에 따라 위력 20/31/68(Lv.1/50/100)의 추가행동을 발동하며, 상위 단계는 6/9중첩에서 분할 피해를 발동한다. <전수 불가능>"
    - { id: 9, verbalName: 검의 달인, codeName: ShiSwordMaster, description: "베기류 공격의 가하는 피해가 25% 증가한다." }
    - { id: 10, verbalName: 신속, codeName: ShiSwiftness, description: "바람 원소가 부착되어 있는 동안 DEX +10." }
    - { id: 11, verbalName: 천살성, codeName: HeavenlyKiller, description: "공격 후 최대 체력의 8% 미만인 적을 즉시 처형한다. 일반 등급의 적에게만 적용된다." }
    - { id: 12, verbalName: 화무십일홍, codeName: ShiTenDaysNoFlower, description: "체력 10% 미만인 적 공격 시 확정 치명타. 치명타 확률의 2배가 해당 공격의 치명타 피해에 더해진다." }
    - { id: 13, verbalName: 당연한 운명, codeName: ShiCertainDestiny, description: "천살성 보유 시 처형 기준을 최대 체력의 12% 미만으로 대체한다. 일반 등급의 적에게만 적용된다." }
    - id: 182
      verbalName: 막기
      codeName: Block
      description: "2턴마다 [5/15/25]% 확률로 CON*0.8+[100/200/300]의 방어막 획득 #물리"
    - id: 1
      verbalName: 성채
      codeName: ChandraBastion
      description: "방어막 보너스 +25%"
    - id: 181
      verbalName: 갑옷 숙련
      codeName: ArmorTrainingPassive
      description: "받는 피해가 3% 감소한다. <장비 전용>"
    - id: 2
      verbalName: 기사회생
      codeName: ChandraSecondWind
      description: "체력이 25% 미만으로 떨어지면 3턴에 걸쳐 최대 체력의 60%를 회복한다. 전투당 1회."
    - id: 3
      verbalName: 보루
      codeName: ChandraBulwark
      description: "아군에게 이로운 효과를 얻으면 2턴간 STR +4"
    - id: 4
      verbalName: 배수의 진
      codeName: ChandraLastStandFormation
      description: "전열에 자신 외 아군이 없을 경우, CON +12"
    - id: 5
      verbalName: 목욕제계
      codeName: ChandraPurificationBath
      description: "전투 페이즈 종료 후, 모든 아군의 체력을 최대 체력의 CON%만큼 치유"
    - { id: 267, verbalName: 사비타, codeName: SuryaSavitr, description: "<고유 패시브> <전수 불가> 고유 중첩(최대 100). 햇빛 필드에서 자신과 원소·무기 숙련·속성이 일치하는 아군이 행동하면 일치한 수만큼 중첩을 얻는다. 최대 중첩에 닿으면 즉시 일반행동(라비)을 추가행동으로 발동한다." }
    - { id: 110, verbalName: 특별함, codeName: SuryaDistinction, description: "특수행동을 할 때마다 올스탯 +3%. 중첩된다." }
    - { id: 111, verbalName: 폭주, codeName: SuryaOverrun, description: "과부하 원소반응으로 가하는 피해가 25% 증가한다." }
    - { id: 112, verbalName: 면벽수련, codeName: SuryaWallMeditation, description: "서포트 카드로서 어느 훈련에 배치되든 그 훈련의 CON 상승량 +10%(부 스탯 몫 포함)." }
    - { id: 113, verbalName: 미트라, codeName: SuryaMitra, description: "봉우(108)의 금색 상위 코드. 우정 훈련이 발동하면 우정 보너스가 75% 증가한다." }
    - { id: 109, verbalName: 카피바라, codeName: ChandraCapybara, description: "우정도 획득량이 25% 증가한다." }
    - { id: 108, verbalName: 봉우, codeName: ChandraSwornFriend, description: "우정 훈련이 발동하면 우정 보너스가 50% 증가한다." }
    - id: 6
      verbalName: 철벽
      codeName: IronWallPassive
      description: "일반행동을 할 때마다 이번 전투 동안 CON +2. 중첩된다."
    - { id: 340, verbalName: 풍요의 축복, codeName: QuetzalcoatlBounty, description: "필드의 풀 아군 1명당 아군 전체의 가하는 피해가 [5/10/15]% 증가한다. <전수 불가능>" }
    - { id: 14, verbalName: 숙련된 조교, codeName: SkilledInstructor, description: "서포트 카드로서 어느 훈련이든 배치되면 그 훈련의 효율 +10%. 스탯을 가리지 않아 부 스탯 몫에도 붙는다." }
    - { id: 15, verbalName: 학식, codeName: ScholarshipPassive, description: "서포트 카드로서 어느 훈련에 배치되든 그 훈련의 INT 상승량 +10%(부 스탯 몫 포함)." }
    - { id: 16, verbalName: 행운아, codeName: QuetzalcoatlLucky, description: "서포트 카드로서 어느 훈련에 배치되든 그 훈련의 LUK 상승량 +10%(부 스탯 몫 포함). 상위: 사랑 신의 가호(54)." }
    - { id: 17, verbalName: 예리함, codeName: QuetzalcoatlOvercritScholar, description: "100%를 초과한 치명타 확률의 1.5배를 치명타 피해로 전환한다." }
    - { id: 18, verbalName: 명상, codeName: QuetzalcoatlMeditation, description: "전투 중 턴마다 INT +1." }
    - { id: 19, verbalName: 날개 달린 뱀, codeName: QuetzalcoatlWingedSerpent, description: "10턴마다 3턴간 모든 아군이 턴마다 케찰코아틀 INT/10만큼 마나를 회복한다. <전수 불가능>" }
    - { id: 222, verbalName: 시리우스, codeName: OrionGeoAffinity, description: "피해를 받거나 HP를 소모하면 한 행동당 충전 1스택을 얻는다(최대 5). 5스택이 되면 모두 소비하고 적 전체에게 STR×1.2 피해를 가한다. #물리 #접촉 #추가행동 #반격 <고유 패시브> <전수 불가능>" }
    - { id: 20, verbalName: 중갑병, codeName: OrionHeavyInfantry, description: "숙련된 중갑을 장착했다면 중갑 아이템이 제공하는 내구도 +20%." }
    - { id: 21, verbalName: 명사수, codeName: OrionMarksman, description: "활 계열 무기 장착 중 단일 대상 피해를 입히면 STR만큼 고정 피해를 추가한다." }
    - { id: 22, verbalName: 파수꾼, codeName: OrionSentinel, description: "전열에 있을 때 필드의 후열 아군 하나당 STR +1." }
    - { id: 223, verbalName: 코드 직조, codeName: TheseusCodeWeave, description: "일반 코드 발동 시 0.25스택, 궁극기 코드 발동 시 1스택을 얻는다(최대 3). 1스택을 소비해 다음 일반행동을 강화한다. <고유 패시브> <전수 불가능>" }
    - { id: 23, verbalName: 원소 친화 - 물, codeName: TheseusHydroAffinity, description: "물 원소 보유 중 올스탯 +1, 마나 회복 효율 +20%." }
    - { id: 183, verbalName: 팔랑크스, codeName: GreekPhalanx, description: "팔랑크스를 가진 필드의 아군 수 n에 비례해 전투 시작 시 CON 기반 위력 30*n의 보호막을 얻고, 상시 가하는 피해가 5%*n 증가한다. 모든 Greek 유닛이 자동 보유. <전수 불가능>" }
    - { id: 25, verbalName: 자가치유, codeName: TheseusSelfHealing, description: "턴마다 CON만큼 회복한다. 물 또는 풀 원소 보유 시 2배이며 두 원소가 중첩되어도 2배를 넘지 않는다." }
    - { id: 26, verbalName: 과다치유, codeName: TheseusOverheal, description: "최대 체력을 넘긴 회복량의 25%를 보호막으로 전환한다." }
    - { id: 224, verbalName: 생명의 잔, codeName: AsclepiusChaliceOfLife, description: "현재 체력이 부족한 아군이 행동하면 20 + CON×0.6만큼 치유한다. 유효 치유를 한 행동마다 궁극기 자원을 5% 회복한다. 다수를 치유해도 한 행동에는 1회만 적용한다. <고유 패시브> <전수 불가능>" }
    - { id: 240, verbalName: 태양의 박자, codeName: AmaterasuSunRhythm, description: "일반행동 적중 시 3턴간 DEX +4. 최대 6중첩. <고유 패시브> <전수 불가능>" }
    - { id: 27, verbalName: 투명, codeName: AmaterasuConcealment, description: "체력이 35% 이하일 때 대상 지정 우선도 -1." }
    - { id: 28, verbalName: 폭죽놀이, codeName: AmaterasuFireworks, description: "4번째 일반행동마다 무작위 적에게 DEX 기반 위력 20의 단일 피해를 주는 폭죽 4발을 발사한다." }
    - { id: 29, verbalName: 파죽지세, codeName: AmaterasuBreakthrough, description: "피해를 준 적의 처치에 관여하면 2턴간 주스탯 +12." }
    - { id: 30, verbalName: 치명적인 치유, codeName: AsclepiusCriticalTreatment, description: "치유와 보호막이 치명타 확률로 치명타 피해 배율만큼 증가한다." }
    - { id: 31, verbalName: 마나 호흡법, codeName: AsclepiusManaBreathing, description: "INT가 제공하는 마나 회복 효율 기여분을 1.2배로 만든다." }
    - { id: 32, verbalName: 의신의 가호, codeName: AsclepiusDivineMedicine, description: "부여하는 치유와 보호막이 50% 증가하고 받은 대상의 부정 상태를 모두 제거한다." }
    - { id: 51, verbalName: 약자 멸시, codeName: PygmalionWeaklingContempt, description: "공격자의 지속피해 종류 하나당 받는 피해가 1% 감소한다(최대 20%)." }
    - { id: 52, verbalName: 천천히 꾸준히, codeName: PygmalionSlowAndSteady, description: "자신이 부여하는 지속피해가 25% 증가한다." }
    - { id: 53, verbalName: 날카로운 가시, codeName: PygmalionSharpThorns, description: "접촉 피해를 받으면 공격자에게 2턴간 받는 치유량 50% 감소를 부여한다." }
    - { id: 54, verbalName: 사랑 신의 가호, codeName: PygmalionLoveGodBlessing, description: "행운아(16)의 금색 상위 코드. 서포트 카드로서 어느 훈련에 배치되든 그 훈련의 LUK 상승량 +20%(부 스탯 몫 포함)." }
    - { id: 24, verbalName: 광신도, codeName: SabahFanatic, description: "메인으로 훈련받을 때 어느 훈련이든 LUK 상승량 +10%(부 스탯 몫 포함)." }
    - { id: 119, verbalName: 영감, codeName: Inspiration, description: "서포트 카드로서 훈련에 배치되면 스킬 힌트 발생률 +50%." }
    - { id: 133, verbalName: 부여사, codeName: GaudiInfuser, description: "적에게 원소를 부착하면 2턴간 CON +10." }
    - { id: 134, verbalName: 자연에 대한 이해, codeName: GaudiNatureUnderstanding, description: "턴 시작 시 자신에게 부착된 원소가 없다면 바위 원소를 부착한다." }
    - { id: 135, verbalName: 재충전, codeName: GaudiRecharge, description: "휴식 시 컨디션 상승 확률이 20%p 증가한다." }
    - { id: 136, verbalName: 해커, codeName: GaudiHacker, description: "적에게 원소를 부착하면 대상에게 2턴간 방어력 -20%를 부여한다." }
    - { id: 137, verbalName: 근성, codeName: LightGrit, description: "서포트 카드로서 배치된 훈련의 실패율이 25% 감소한다." }
    - { id: 138, verbalName: 소환술사, codeName: LightSummoner, description: "필드에 있다면 모든 아군 소환수가 가하는 피해 +10%. 여러 소환술사가 중첩된다." }
    - { id: 142, verbalName: 느긋함, codeName: UsaLeisurely, description: "메인 카드로 배치되면 훈련 보너스 -25%, 훈련 체력 소모 -25%." }
    - { id: 143, verbalName: 정기 회복, codeName: UsaEssenceRecovery, description: "필드에서 적이 쓰러지면 그 적의 최대 체력만큼 자신을 치유한다." }
    - { id: 149, verbalName: 약탈, codeName: DrakePlunder, description: "필드에서 적이 처치될 때마다 전투 후 획득 골드 +5%. 중첩된다." }
    - { id: 211, verbalName: 사략면장, codeName: DrakePrivateerCharter, description: "아군의 공격 뒤 그 대상이 최대 체력 25% 이하로 남으면 추가행동 골드 하운드를 발동한다. 이 공격으로 처치하면 대상 레벨×10의 골드를 얻는다. <고유 패시브> <전수 불가능>" }
    - { id: 212, verbalName: 고결한 장미, codeName: ElizabethNobleRose, description: "자신 외 아군이 공격하면 적 하나에 장미 문장을 남긴다(1행동당 1장). 필드에 12장이 모이면 추가행동 제국주의의 선봉장을 발동한다. <고유 패시브> <전수 불가능>" }
    - { id: 227, verbalName: 아마조네스, codeName: HippolyteAmazoness, description: "필드에 사냥감이 없으면 추가행동 공세 명령으로 찍고, 사냥감이 맞을 때마다 추가행동 공세 지원을 발동한다. 사냥감은 방어력 -10%, 받는 치유량 -20%, 대상 우선도 +2를 얻는다. <고유 패시브> <전수 불가능>" }
    - { id: 244, verbalName: 신탁, codeName: HimikoOracle, description: "아군이 추가행동을 할 때마다 그 아군의 신탁 중첩이 1 오른다. 중첩 하나마다 그 아군의 추가공격 피해 +5%. <고유 패시브> <전수 불가능>" }
    - { id: 380, verbalName: 도사란 무엇인가, codeName: UsaTaoistNature, description: "고유 소환수 '분신'을 최대 3기까지 거느린다. 피격 시 분신 하나를 소모해 그 타격을 완전히 무효화한다. <고유 패시브> <전수 불가능>" }
    # 옛 열화 전수본(230·231·233)은 제도 폐지와 함께 삭제했다.
    # 232의 기능만 전수 가능한 독립 해금 패시브 '주문 가속'(55)으로 남는다.
