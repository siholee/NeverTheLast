      description: "단일 적에게 공격력 90% 피해를 주고 보물 +1. #단일 #일반 #비접촉 #사격"
    - id: 121
      verbalName: 심장의 저울
      codeName: AnubisHeartScale
      description: "단일 적에게 최대 체력 6% 피해를 주고 준 피해의 30%를 회복한다. 사자의 서 동안 10% · 60% · 바위 부착. #단일 #일반 #접촉 #찌르기"
    - id: 180
      verbalName: 분신술
