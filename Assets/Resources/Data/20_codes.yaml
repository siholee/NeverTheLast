      description: "마나100. 자신의 방어력 D 기준 재보 min(10,6+floor(D/100)) 획득. 아군 공격력·특수공격력 min(24%,8%+D×0.04%p) 증가. 만사 일반행동2회 지속·갱신."
    - id: 220
      verbalName: "왕권의 일제 포격"
      codeName: IshtarRoyalBarrage
      description: "마나140·재보1 이상 필요. 사용 가능 재보를 탄창에 예약해 탄마다1 소비하여 공격력120% 단일 연사. 독립 치명·처치 시 표적 재선정. 첫 유효 탄만 풀 부착. 전체 초월기1회. 취소 시 미발사 재보 반환."
    - id: 81
      verbalName: "아직 꺼지지 않은 종말"
      codeName: SurtrRagnarok
      description: "마나 120. 적 전체에 공격력 180% 피해 및 불 부착(효과 명중). 시전 시 체력이 60% 이상이면 최대 체력 20%를 소모하고 모든 대상에게 최대 체력 14% 계수를 더한다. 두 계수 모두 치명타 가능. 자해는 보호막·피해 경감·피격 효과를 적용하지 않는다. #초월기 #전체 #비접촉 #베기"
    - id: 82
      verbalName: "브리싱가멘의 기억"
      codeName: FreyaBrisingamen
      description: "상시형. 자신이 실제 회복한 체력을 온기로 저장(최대 자신의 최대 체력 75%). 필드 아군 가하는 피해 +저장 온기/자신 최대 체력×40%(최대30%). 자신의 일반행동 시작마다 현재 온기 25% 감소 후 치유. 아군 체력이 30% 이하이면 자신의 최대 체력 18% 온기를 선소모해 우선 추가행동으로 같은 양 치유. 긴급 치유는 온기를 채우지 않으며 발동 조건이 사라지면 선소모 반환. 과잉 치유·다른 치유사의 치유는 저장하지 않는다."
    - id: 63
      verbalName: 팔방의 소집
      codeName: IndraGathering
      description: "<마나 100> 로카팔라 묶음을 연다 — 필드의 로카팔라 참여자 전원의 특수행동을 순서대로 예약한다. 피해는 없다."
    - id: 61
      verbalName: 언젠가 다다를 마지막
      codeName: YamaLastArrival
      description: "<마나 120> 적 전체에 공격력 280% 피해를 주고 번개를 부착한 뒤, 대상별로 모든 지속피해를 min(5, 2q) 비율로 즉시 발동한다. #전체 #궁극기 #비접촉 #주문"
    - id: 66
      verbalName: 동일한 법 아래
      codeName: VarunaUnderSameLaw
      description: "<마나 100> 적 전체에 공격력 120% 피해를 주고 물을 부착하며, 생존한 필드 아군 전원(자신 포함)에게 바루나 현재 방어력 160%의 보호막을 준다. 물 부착으로 제방 보호막(자신 70%)도 따로 얻는다. #전체 #궁극기 #비접촉 #주문"
    - id: 64
      verbalName: 만류의 회랑
      codeName: VayuStorm
      description: "<마나 100> 적 전체에 공격력 100% 피해를 주고 2턴간 방어력 -20%(바람의 침식). 특수방어력은 깎지 않고 바람도 붙이지 않는다. #전체 #궁극기 #비접촉 #주문"
    - id: 62
      verbalName: 내가 판을 키워 주지
      codeName: AgniRaiseTheStakes
      description: "<마나 120> 자신을 포함한 필드 아군 전원의 궁극기 피해 +20%(판돈 — 아그니가 일반행동을 세 번 마칠 때까지). 판돈 동안 아그니의 특성 추공은 궁극기 판정을 함께 받는다. 아군별 특성 횟수를 되돌린다. 피해는 없다."
    - id: 67
      verbalName: 도망칠 곳은 없어
      codeName: SuryaNoEscape
      description: "적 전체에 종언 표식 2중첩 부여. 자신의 일반행동 2회 동안 공격력 +25%. 다음 일반 사격부터 종언탄을 사용할 수 있다. 마나 140. 표식은 적별 효과 명중 판정."
    - id: 65
      verbalName: "복리의 보고"
      codeName: KuberaTreasury
      description: "마나120. 사용 가능한 재보 R을 읽고 1+floor(R×25%) 충전. 예약 제외·공용 상한12. 재보3 미만이고 개시자와 동시에 준비되면 먼저 예약. 미충전 초월기는 기다리지 않음. 피해·소환·원소 부착 없음."
    - id: 121
      verbalName: 사자의 서
      codeName: AnubisBookOfTheDead
      description: "<마나 120> 자신의 3턴(영혼 150 이후 4턴) 동안 심장의 저울이 최대 체력 13% · 회복 75% · 바위 부착으로 강화된다."
    - id: 180
      verbalName: 만천화우
      codeName: UchiManchunhwau
      description: "<마나 100> 분신을 모두 소모해 각각 우선도 적에게 우치 공격력 525% 피해. 분신이 없으면 분신 2기를 만든다. #다중 #궁극기 #접촉 #타격"
    - id: 1
      verbalName: 창세의 노래
      codeName: SeiSongOfGenesis
      description: "<마나 120> 시전 시 아군 전체에게 1200 + 레벨×48 + 방어력720% 보호막과 가하는 피해 +25%(각자의 일반행동3회)를 부여한다. 별도의 <집중> 오라가 세이의 턴3회 동안 받는 피해25% 감소와 공격 적중마다 세이 현재 방어력25% 추가 고정 피해를 제공한다. 집중이 끊겨도 시전 보호막·피해 증가 버프는 유지된다. 지속·반응·덧붙는 피해는 추가 피해를 발동하지 않는다."
    - id: 2
      verbalName: 만종
      codeName: ShiFinalBell
      description: "<패시브형> 멸참을 사용할 때마다 만종 1중첩을 얻는다. 3중첩에는 멸참 대상에게 공격력의 🔸50~170% 추가 피해를, 6중첩에는 적 전체에 공격력 250%의 분배 피해를, 9중첩에는 적 전체에 공격력 375%의 분배 피해를 준 뒤 0중첩으로 돌아간다. #단일/전체 #궁극기 #분배 #비접촉"
    - id: 3
      verbalName: 아즈라엘
      codeName: SabahAzrael
      description: "<아즈라엘 7> 아즈라엘 7중첩을 모두 소모해 적 전체에 150 + 특수공격력의 100% 피해를 입힌다. 대상마다 한 번 판정한다. #전체 #궁극기 #베기 #접촉 #특수"
    - id: 7
      verbalName: 텐션 오르는데!
      codeName: JeanTensionRising
      description: "<마나 120> 3턴 동안 자신의 타겟 우선도가 1 증가하고, 추가공격으로 가하는 피해가 20% 증가한다. 받는 피해가 10% 감소하며 접촉 공격이면 총 20% 감소한다."
    - id: 20
      verbalName: 날카로운 가시
      codeName: PygmalionSharpThorns
      description: "<집중> <마나 100> 3턴 동안 타겟 우선도 +1, 받는 피해 -50%를 얻는다. 접촉 공격을 받을 때에는 방어력을 2배로 계산하며 공격자에게 맹독을 부여한다. 맹독은 대상 일반행동 시작에 최대 체력 1.5% 피해, 대상 일반행동 2회 유지. 효과 명중을 사용하고 재부여는 기간만 갱신한다."
    - id: 44
      verbalName: 맹화의 제전
