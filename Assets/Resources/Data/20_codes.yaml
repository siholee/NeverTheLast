codes:
  passive:
    - id: 1
      verbalName: 홀리 인챈트
      codeName: HolyEnchant
    - id: 2
      verbalName: 사냥꾼의 독
      codeName: HuntersVenom
    - id: 3
      verbalName: 니샤카라
      codeName: ChandraNishakara
      description: "<전수 불가능> INT의 [25/50/100]%에 해당하는 CON을 획득한다."
    - id: 4
      verbalName: 갈라테아
      codeName: Galatea
    - id: 5
      verbalName: 시의 종언
      codeName: ShiFinalVerse
    - id: 11
      verbalName: 막기
      codeName: Block
      description: "4초마다 [5/15/25]% 확률로 CON*0.8+[100/200/300]의 방어막 획득 #물리"
    - id: 8
      verbalName: 성채
      codeName: ChandraBastion
      description: "방어막 보너스 +25%"
    - id: 12
      verbalName: 기사회생
      codeName: ChandraSecondWind
      description: "체력이 25% 미만으로 떨어지면 5초에 걸쳐 체력을 30% 회복한다."
    - id: 20
      verbalName: 보루
      codeName: ChandraBulwark
      description: "아군에게 이로운 효과를 얻으면 4초간 STR +4"
    - id: 27
      verbalName: 배수의 진
      codeName: ChandraLastStandFormation
      description: "전열에 자신 외 아군이 없을 경우, CON +12"
    - id: 35
      verbalName: 목욕제계
      codeName: ChandraPurificationBath
      description: "전투 페이즈 종료 후, 모든 아군의 체력을 최대 체력의 CON%만큼 치유"
    - id: 38
      verbalName: 철벽
      codeName: ChandraIronWall
      description: "전투 시작 후 6초가 지나면 CON +6"
    - id: 43
      verbalName: 로카팔라
      codeName: ChandraLokapala
      description: "<전수 불가능> 해당 코드를 보유한 아군의 수에 따라 INT*3을 획득"
    - id: 62
      verbalName: 월광
      codeName: ChandraMoonlight
      description: "아군에게 이로운 효과를 부여할 경우, 바람 원소 부여"
    - id: 70
      verbalName: 요리스틀리
      codeName: QuetzalcoatlYorisGuard
      description: "요리스틀리를 최대 [6/9/12]개 저장한다. 적에게 피해를 받을 때 1개를 소모해 피해를 무효화한다."
    - id: 71
      verbalName: 재생력
      codeName: QuetzalcoatlRegeneration
      description: "매초 CON만큼 체력을 회복한다."
    - id: 72
      verbalName: 흡혈
      codeName: QuetzalcoatlLifesteal
      description: "입힌 피해의 20%만큼 체력을 회복한다."
    - id: 73
      verbalName: 숲의 은총
      codeName: QuetzalcoatlForestGrace
      description: "풀 원소를 보유하면 CON과 INT가 1.5배가 된다."
    - id: 74
      verbalName: 주문 저격수
      codeName: QuetzalcoatlSpellSniper
      description: "후열에서 상대 후열을 공격할 때 가하는 피해가 1.5배가 된다."
    - id: 75
      verbalName: 뿌리박기
      codeName: QuetzalcoatlRooting
      description: "공격 가능한 동안 4초마다 CON과 INT +1."
    - id: 76
      verbalName: 베푸는 자
      codeName: QuetzalcoatlGiver
      description: "입힌 피해의 20%만큼 현재 체력이 가장 낮은 아군을 치유한다."
    - id: 77
      verbalName: 학자
      codeName: QuetzalcoatlScholar
      description: "INT로 얻는 마나 회복 상승량이 1.5배가 된다."
    - id: 78
      verbalName: 초월
      codeName: QuetzalcoatlTranscendence
      description: "전투 시작 8초 후 성장 스탯의 1.5배를 추가로 획득한다."
    - id: 79
      verbalName: 개척
      codeName: QuetzalcoatlPioneer
      description: "궁극기 발동 시 아군 전체에게 풀 원소를 부여한다."
    - id: 80
      verbalName: 케찰코아틀의 부름
      codeName: QuetzalcoatlCall
      description: "전열의 빈 공간에 독수리전사 또는 재규어전사를 소환한다. 재사용 대기시간 6초."
    - id: 81
      verbalName: 수호자의 의지
      codeName: QuetzalcoatlGuardianWill
      description: "소환한 전사가 생존해 있는 동안 받는 피해가 30% 감소한다."
    - id: 82
      verbalName: 시팍틀리를 살해한 자
      codeName: QuetzalcoatlCipactliSlayer
      description: "풀 원소를 보유한 아군 유닛의 모든 스탯이 2배가 된다."
    - id: 90
      verbalName: 마카나
      codeName: MacanaGrowth
      description: "적 처치 시 25% 확률로 영구적으로 무작위 스탯 +1."
  normal:
    - id: 1
      verbalName: 아탈란테
      codeName: a005-NAtlanta
    - id: 2
      verbalName: 피그말리온
      codeName: a004-NPygmalion
    - id: 10
      verbalName: 마력탄
      codeName: MagicBolt
      description: "단일 적에게 INT+[100/200/300]만큼의 피해를 입힌다. #비접촉 #특수"
    - id: 11
      verbalName: 사격
      codeName: Shoot
      description: "단일 적에게 STR+[100/200/300]만큼의 피해를 입힌다. #비접촉 #물리"
    - id: 12
      verbalName: 사친
      codeName: Sachi
      description: "INT의 40%에 해당하는 단일 피해를 입힌다. #비접촉 #특수"
    - id: 70
      verbalName: 태양의 공
      codeName: QuetzalcoatlBall
      description: "단일 적에게 INT*60 피해와 풀 원소를 부여한다. 요리스틀리 수만큼 추가로 튕기며 INT*30 피해를 입힌다."
  ultimate:
    - id: 1
      verbalName: 레바테인
      codeName: Levateinn
    - id: 2
      verbalName: 대애충독
      codeName: ApplyPoison
    - id: 3
      verbalName: 달빛 폭격
      codeName: a005_U_Moonfall
    - id: 4
      verbalName: 화상부여
      codeName: ApplyBurn
    - id: 5
      verbalName: 소마
      codeName: a012_U_Soma
      description: "CON의 100%에 해당하는 방어막을 획득하고 모든 후방의 아군에게 INT만큼의 공격속도를 부여한다."
    - id: 6
      verbalName: 사랑의 대가
      codeName: a004_U_LovesPrize
    - id: 7
      verbalName: 만종
      codeName: a002_U_FinalBell
    - id: 70
      verbalName: 요리스틀리의 맹세
      codeName: QuetzalcoatlYorisUltimate
      description: "요리스틀리를 1개 획득한다. 공격으로 취급되지 않는 즉시 발동 버프다."
