# 파티 시너지 · 추천 조합 데이터
#
# 캐릭터 편성 화면이 "이 메인에게는 이런 조합"을 띄우기 위한 원본이다.
# 기획 근거와 갈래 설명은 Assets/Docs/Design/Detail_15_Party_Synergy.md에 있다.
#
# ─ 편성 규칙 (CharacterSelectionManager) ─────────────────────────────
#   파티는 메인 1 + 서포트 4, 다섯 명 전원이 필드에 선다.
#   메인 슬롯   : characterType이 Support가 아니고, 해금되었거나 육성 완료된 캐릭터
#   서포트 슬롯 : canStartAsSupport(= Support 유형) 또는 해금/육성 완료된 캐릭터
#   → 런 1회차에는 메인 후보 7명(Starter), 서포트 후보 17명(Support)뿐이다.
#
# ─ 두 가지 조합 ──────────────────────────────────────────────────────
#   best  (고점) : 전 캐릭터 해금 + 코드 전수까지 끝났다는 가정. 서포트를 38명에서 고른다
#   basic (대체) : 최초 로스터만. 서포트를 Support 유형 17명에서 고르고, 전수 코드는 없다고 본다
#
# ─ 점수 축 ───────────────────────────────────────────────────────────
#   combat   전투 기여 (필드에서 실제로 만들어 내는 것)
#   training 육성 기여 (집중 스탯 일치 → 강화량과 패시브 전수 확률)
#   두 값 모두 0~5. UI는 combat을 기본 정렬로, training을 보조 표기로 쓴다.
#
# ⚠ 서포트는 전투 EXP를 늘 함께 받고 육성 EXP는 그 훈련에 참여했을 때만 받아,
#   메인의 약 80% 레벨에 선다(100스테이지 메인 Lv.86 · 서포트 Lv.65~75).
#   Lv.60 이상에서 열리는 팀 버프 코드는 서포트 슬롯에서 마지막 한두 라운드에나 열린다고 보고 배점했다.

# ══════════════════════════════════════════════════════════════════════
# 1. 역할군 정의
# ══════════════════════════════════════════════════════════════════════
roles:
  - id: TAUNT
    name: 도발
    description: 대상 지정 우선도를 끌어와 아군 후열을 가린다. 아군 전체에서 스카디·잔뿐이다.
  - id: BULWARK
    name: 방벽
    description: 도발 없이 방어막·피해 경감으로 전열을 유지한다.
  - id: HEAL
    name: 치유
    description: 전투 중에 체력을 되돌린다.
  - id: SHIELD
    name: 보호막
    description: 아군에게 방어막을 부여한다.
  - id: CLEANSE
    name: 정화
    description: 해로운 상태를 제거한다.
  - id: REVIVE
    name: 부활
    description: 쓰러진 아군을 되돌린다.
  - id: DPS_ST
    name: 단일 딜
    description: 보스·엘리트 한 기를 녹인다.
  - id: DPS_AOE
    name: 광역 딜
    description: 다수 편성을 정리한다. 생명력 차감이 '남은 적 수'라 광역이 곧 생존이다.
  - id: MULTIHIT
    name: 다타수
    description: 한 행동을 여러 발로 쪼갠다. 타격당 고정 효과와 곱해진다.
  - id: EXECUTE
    name: 처형
    description: 체력이 낮은 적을 즉시 정리한다.
  - id: DOT
    name: 지속피해
    description: 턴마다 깎는 피해를 남긴다.
  - id: AMP_DMG
    name: 피해 증폭
    description: 아군 전체의 가하는 피해를 올린다.
  - id: AMP_CRIT
    name: 치명타 증폭
    description: 아군의 치명타 확률·피해를 올린다.
  - id: AMP_REACT
    name: 반응 증폭
    description: 원소 반응 피해를 올린다.
  - id: AMP_SUMMON
    name: 소환 증폭
    description: 소환수 피해를 올린다.
  - id: AMP_TOUGH
    name: 강인도 증폭
    description: 강인도 효율과 강인도→실피 전환을 올린다.
  - id: ELEM_APPLY
    name: 원소 부착
    description: 반응 재료를 깐다. 적 대상과 아군 대상이 서로 다른 축이다.
  - id: DEF_SHRED
    name: 방어 무시
    description: 방어력을 무시하거나 깎는다.
  - id: ULT_BATTERY
    name: 궁극기 가속
    description: 마나·궁극기 자원을 채워 궁극기 회전을 앞당긴다.
  - id: ACT_ACCEL
    name: 행동 가속
    description: 행동 게이지나 DEX를 밀어 행동 횟수를 늘린다.
  - id: CONTROL
    name: 제어
    description: 에어본·기절·빙결·행동 지연으로 적 턴을 지운다.
  - id: SUMMON
    name: 소환
    description: 소환수를 세운다.
  - id: EXTRA_ACT
    name: 추가행동
    description: 추가행동·반격을 발생시킨다.
  - id: TOUGHNESS
    name: 강인도
    description: 적에게 가상 체력을 씌워 처치 판정을 앞당긴다.
  - id: ECON
    name: 경제
    description: 골드·EXP 획득을 올린다.
  - id: SPECIAL
    name: 특수행동
    description: >
      인드라의 궁극기 <신들의 왕>만이 여는 행동. 필드의 로카팔라가 한꺼번에 나선다.
      추가행동과 판정이 다르며, 세울수록 인드라 궁극기 한 번의 값이 커진다.

# 훈련 특기 — 서포트 카드의 specialtyTraining은 80% 확률로 그 캐릭터의 최고 스탯이 된다.
# 집중 스탯이 특기와 일치해야 특기 보너스·우정 훈련·패시브 전수가 모두 열린다.
trainerCoverage:
  STR: [7]                                  # 잔
  DEX: [100]                                # 아그리파
  CON: [5, 60, 64, 65, 66, 81, 83, 125]     # 라이트·찬드라·바유·쿠베라·바루나·프레이아·스카디·이시스
  INT: [1, 4, 6, 62, 124]                   # 세이·가우디·니콜·아그니·토트
  LUK: [25, 160]                            # 오르페우스·마리

