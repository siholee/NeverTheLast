# 파티 시너지 · 추천 조합 데이터
#
# 캐릭터 편성 화면과 자료실이 "이 캐릭터는 어떤 자리인가 · 어떤 조합이 좋은가"를 띄우는 원본이다.
# 기획 근거는 Assets/Docs/Design/Detail_15_Party_Synergy.md에 있다.
#
# 2026-09 전면 개편으로 옛 로스터의 유닛 · 갈래 · 추천 편성을 모두 걷어냈다. 역할군 정의만 남기고,
# 캐릭터를 다시 만들 때마다 units / archetypes / recommendations에 더한다.
# supportValue.training(육성 기여)은 훈련이 사라져 0으로 둔다.

# ══════════════════════════════════════════════════════════════════════
# 1. 역할군 정의
# ══════════════════════════════════════════════════════════════════════
roles:
  - id: TAUNT
    name: 도발
    description: 대상 지정 우선도를 끌어와 아군 후열을 가린다. 초기 서포트 중에는 잔이 담당한다.
  - id: BULWARK
    name: 방벽
    description: 도발 없이 방어막·피해 경감으로 전열을 유지한다.
  - id: HEAL
    name: 치유
    description: 전투 중에 체력을 되돌린다.
  - id: SHIELD
    name: 보호막
    description: 아군에게 방어막을 부여한다.
  - id: CLEANSE
    name: 정화
    description: 해로운 상태를 제거한다.
  - id: REVIVE
    name: 부활
    description: 쓰러진 아군을 되돌린다.
  - id: DPS_ST
    name: 단일 딜
    description: 보스·엘리트 한 기를 녹인다.
  - id: DPS_AOE
    name: 광역 딜
    description: 다수 편성을 정리한다. 생명력 차감이 '남은 적 수'라 광역이 곧 생존이다.
  - id: MULTIHIT
    name: 다타수
    description: 한 행동을 여러 발로 쪼갠다. 타격당 고정 효과와 곱해진다.
  - id: EXECUTE
    name: 처형
    description: 체력이 낮은 적을 즉시 정리한다.
  - id: DOT
    name: 지속피해
    description: 턴마다 깎는 피해를 남긴다.
  - id: AMP_DMG
    name: 피해 증폭
    description: 아군 전체의 가하는 피해를 올린다.
  - id: AMP_CRIT
    name: 치명타 증폭
    description: 아군의 치명타 확률·피해를 올린다.
  - id: AMP_REACT
    name: 반응 증폭
    description: 원소 반응 피해를 올린다.
  - id: AMP_SUMMON
    name: 소환 증폭
    description: 소환수 피해를 올린다.
  - id: AMP_TOUGH
    name: 강인도 증폭
    description: 강인도 효율과 강인도→실피 전환을 올린다.
  - id: ELEM_APPLY
    name: 원소 부착
    description: 반응 재료를 깐다. 적 대상과 아군 대상이 서로 다른 축이다.
  - id: DEF_SHRED
    name: 방어 무시
    description: 방어력을 무시하거나 깎는다.
  - id: ULT_BATTERY
    name: 궁극기 가속
    description: 마나·궁극기 자원을 채워 궁극기 회전을 앞당긴다.
  - id: ACT_ACCEL
    name: 행동 가속
    description: 행동 게이지나 속도를 밀어 행동 횟수를 늘린다.
  - id: CONTROL
    name: 제어
    description: 에어본·기절·빙결·행동 지연으로 적 턴을 지운다.
  - id: SUMMON
    name: 소환
    description: 소환수를 세운다.
  - id: EXTRA_ACT
    name: 추가행동
    description: 추가행동·반격을 발생시킨다.
  - id: TOUGHNESS
    name: 강인도
    description: 적에게 가상 체력을 씌워 처치 판정을 앞당긴다.
  - id: ECON
    name: 경제
    description: 골드·EXP 획득을 올린다.
  - id: SPECIAL
    name: 특수행동
    description: >
      인드라의 궁극기 <신들의 왕>만이 여는 행동. 필드의 로카팔라가 한꺼번에 나선다.
      추가행동과 판정이 다르며, 세울수록 인드라 궁극기 한 번의 값이 커진다.

# 훈련 특기 — 서포트 카드의 specialtyTraining은 80% 확률로 그 캐릭터의 최고 스탯이 된다.
# 집중 스탯이 특기와 일치해야 특기 보너스·우정 훈련·패시브 전수가 모두 열린다.
trainerCoverage:
  STR: [7]                                  # 잔
  DEX: [100]                                # 아그리파
  CON: [5, 60, 64, 65, 66, 81, 83, 125]     # 라이트·찬드라·바유·쿠베라·바루나·프레이아·스카디·이시스
  INT: [1, 4, 6, 9, 62, 124]                # 세이·가우디·니콜·위고·아그니·토트
  LUK: [25, 103, 160]                       # 오르페우스·이아손·마리

# ══════════════════════════════════════════════════════════════════════
# 2. 유닛
# ══════════════════════════════════════════════════════════════════════
units:
  - id: 1
    name: 세이
    type: Unlocked
    element: Geo
    mainStat: Defense
    topStat: Defense
    row: Front
    roles: [BULWARK, SHIELD, AMP_DMG, MULTIHIT]
    supportValue: { combat: 4, training: 0 }
    provides:
      - { key: AMP_DMG, text: "창세의 노래 — 아군 전체 공격력 +(50 + 방어력 15%), 타격마다 고정 피해 추가(집중 3턴)" }
      - { key: MULTIHIT, text: "빅뱅 — 창세의 결정 7개로 무작위 적에게 바위 조각 7발, 이어서 아군 전체에 100 + 방어력 5% 보호막" }
      - { key: SHIELD, text: "창세의 노래 — 아군 전체에 레벨 × 2 + 방어력 25% 보호막" }
    wants: [TAUNT, DPS_ST]
    caution: "첫 빅뱅은 궁극기의 보호막이 깔린 뒤에야 쌓이기 시작한다. 집중은 세이가 기절하면 풀린다(보호막은 남는다)."

  - id: 2
    name: 시
    type: Unlocked
    element: Anemo
    mainStat: Attack
    topStat: Attack
    row: Rear
    roles: [DPS_ST, EXECUTE, EXTRA_ACT, ACT_ACCEL]
    supportValue: { combat: 1, training: 0 }
      provides:
        - { key: EXECUTE, text: "멸망의 시 — 아군 공격 후 멸참으로 끝낼 수 있는 적을 방어력·현재 체력만 보고 특수행동으로 정리" }
        - { key: EXTRA_ACT, text: "멸참 — 일반·특성 멸참 처치 시 특수행동 멸참을 한 번 더 사용" }
        - { key: MULTIHIT, text: "만종 — 멸참 3/6/9회째에 단일 추가 피해 또는 적 전체 분배 피해" }
    wants: [AMP_DMG, SHIELD]
      caution: "처형 예측은 보호막과 피해 증감을 보지 않는다. 재행동 멸참으로 처치해도 세 번째 멸참은 이어지지 않는다."

  - id: 3
    name: 사바흐
    type: Unlocked
    element: Electro
    mainStat: Attack
    topStat: Speed
    row: Rear
    roles: [DPS_ST, DPS_AOE, ULT_BATTERY, ELEM_APPLY]
    supportValue: { combat: 3, training: 0 }
    provides:
      - { key: DPS_ST, text: "검격 — 110 + 공격력 100%의 단일 접촉 베기" }
      - { key: DPS_AOE, text: "아즈라엘 — 디버프 연계로 모은 7중첩을 소모해 적 전체를 한 번씩 공격" }
      - { key: ELEM_APPLY, text: "번개 베기 — 일반행동 3번째마다 최대 3명에게 번개 원소 부착" }
    wants: [DOT, CONTROL, AMP_DMG]
    caution: "아즈라엘은 공용 마나로 차지 않는다. 아군의 해로운 상태 부여·갱신과 지속피해 틱이 있어야 회전한다."

  - id: 7
    name: 잔
    type: Unlocked
    element: Cryo
    mainStat: MaxHp
    topStat: MaxHp
    row: Front
    roles: [TAUNT, BULWARK, DPS_ST, EXTRA_ACT]
    supportValue: { combat: 5, training: 0 }
    provides:
      - { key: TAUNT, text: "텐션 오르는데! — 자신에게 공격을 모으고 피해를 줄인다" }
      - { key: EXTRA_ACT, text: "철권제재 — 직접 공격 대상으로 확정되면 공격자보다 먼저 신성한 일격" }
      - { key: DPS_ST, text: "신성한 일격 — 일반행동과 선제 반격이 공유하는 단일 접촉 공격" }
    wants: [HEAL, SHIELD, AMP_DMG]
    caution: "철권제재는 잔의 일반행동 사이에 정해진 횟수만 쓸 수 있으며 간접 피해에는 반응하지 않는다."

  - id: 60
    name: 찬드라
    type: Unlocked
    element: Geo
    mainStat: MaxHp
    topStat: MaxHp
    row: Rear
    roles: [BULWARK, HEAL, AMP_DMG, AMP_CRIT, DPS_AOE, SPECIAL]
    supportValue: { combat: 4, training: 0 }
    provides:
      - { key: AMP_DMG, text: "소마 — 가장 공격력이 높은 아군에게 공격력 10% + 찬드라 최대 체력 10%" }
      - { key: AMP_CRIT, text: "창야 — 로카팔라 특수행동 묶음 동안 아군 전체 치명타 확률 +25%" }
      - { key: HEAL, text: "니샤카라/창야 — 월광 위기 회복과 광역 피해 기반 자가 회복" }
    wants: [SPECIAL, SHIELD]
    caution: "현 로스터에는 로카팔라 특수행동을 자연스럽게 여는 유닛이 없어 창야는 트리거가 추가되어야 발동한다."

  - id: 44
    name: 히미코
    type: Unlocked
    element: Pyro
    mainStat: SpecialAttack
    topStat: SpecialAttack
    row: Rear
    roles: [DEF_SHRED, CONTROL, AMP_DMG]
    supportValue: { combat: 4, training: 0 }
    provides:
      - { key: DEF_SHRED, text: "맹화의 제전 — 집중 2턴 동안 아군 전체 방어 무시 20%" }
      - { key: CONTROL, text: "맹화 3중첩 — 행동을 빼앗지 않고 집중만 중단" }
      - { key: AMP_DMG, text: "맹화 3중첩 — 받는 피해 +15% 2턴" }
    wants: [ACT_ACCEL, MULTIHIT]
    caution: "맹화 1~2중첩은 디버프로 세지 않고, 3중첩 폭발의 취약만 디버프 하나로 센다."

  - id: 20
    name: 피그말리온
    type: Unlocked
    element: Pyro
    mainStat: Defense
    topStat: MaxHp
    row: Front
    roles: [TAUNT, BULWARK, DOT, AMP_DMG, AMP_SUMMON]
    supportValue: { combat: 5, training: 0 }
    provides:
      - { key: AMP_DMG, text: "갈라테아 — 필드에 있는 동안 아군 피해 +15%" }
      - { key: AMP_SUMMON, text: "갈라테아 — 소환수 피해 +30%, 자신도 소환수 판정" }
      - { key: TAUNT, text: "날카로운 가시 — 집중 3턴 동안 타겟 우선도 +1·받는 피해 -50%" }
      - { key: DOT, text: "날카로운 가시 — 접촉 공격자에게 맹독" }
    wants: [HEAL, SHIELD]
    caution: "맹독 반사는 접촉 공격에만 발동한다. 비접촉 위주의 적에게는 궁극기의 반격 가치가 낮다."

  - id: 122
    name: 바스테트
    type: Unlocked
    element: Geo
    mainStat: Attack
    topStat: Speed
    row: Rear
    roles: [DPS_ST, EXTRA_ACT, ACT_ACCEL]
    supportValue: { combat: 2, training: 0 }
    provides:
      - { key: DPS_ST, text: "냥냥펀치 — 공격력 100%의 빠른 단일 접촉 공격" }
      - { key: EXTRA_ACT, text: "미운 놈 한 대 더 때리기 — 아군 반격이 실제 피해를 주면 같은 대상에게 냥냥펀치 추가행동" }
      - { key: ACT_ACCEL, text: "기초 속도 116 — 현 로스터 최고 속도로 일반행동 회전을 확보" }
    wants: [TAUNT, EXTRA_ACT, AMP_DMG]
    caution: "경호는 견고 또는 반격 아군이 필요하다. 현 로스터에는 자연 반격 공격자가 없어 초월기 추가행동은 이후 반격 유닛과 조합할 때 열린다."

archetypes:
  - id: JEAN_BASTET_COUNTER
    name: 잔·바스테트 선제 반격 편성
    core: [7, 122, 1, 44, 60]
    description: "잔이 바스테트의 공격을 넘겨받아 먼저 반격하고, 바스테트가 같은 공격자에게 후속 냥냥펀치를 잇는다. 세이의 보호막과 찬드라의 회복이 잔의 집중 피격을 받친다."
    partners: [20]
    counterplay: "잔의 반격 기회가 소진되거나 비행동 피해 위주인 적에게는 연계가 멈춘다."
  - id: BASTET_GUARD
    name: 바스테트 경호 편성
    core: [122, 7, 60, 44, 20]
    description: "잔이 바스테트의 직접 공격을 대신 받아 선제 반격하고, 바스테트가 같은 공격자에게 후속 냥냥펀치를 잇는다."
    partners: []
    counterplay: "잔의 철권제재 기회가 소진되면 반격 후속이 멈추며, 간접 피해는 경호·반격을 열지 않는다."
  - id: REWORK_FIVE
    name: 현행 5인 균형 편성
    core: [1, 2, 60, 44, 20]
    description: "두 전열이 버티는 동안 처형·맹화·단일 강화·방어 무시를 함께 운용한다."
    partners: []
    counterplay: "광역 회복·정화가 없고, 로카팔라 특수행동을 자연 개방하지 못한다."
  - id: SABAH_EXECUTION
    name: 사바흐 빈틈 처형 편성
    core: [3, 2, 60, 44, 20]
    description: "히미코·피그말리온이 해로운 상태와 지속피해를 공급해 아즈라엘을 채우고, 시와 사바흐가 단일·광역 처형을 나눈다."
    partners: []
    counterplay: "맹화 1~2중첩은 디버프가 아니며, 적이 해로운 상태에 강하면 아즈라엘 회전이 느려진다."

recommendations:
  - mainId: 7
    mainName: 잔
    axis: "선제 반격·도발·바스테트 후속"
    starterRecommended: true
    best:
      archetype: JEAN_BASTET_COUNTER
      members: [122, 1, 44, 60]
      rows: { 7: Front, 122: Rear, 1: Front, 44: Rear, 60: Rear }
      reason: "잔이 공격을 모아 선제 반격을 만들고, 바스테트가 그 반격을 실제 추가행동으로 전환한다. 보호막·취약·위기 회복이 전열 유지와 단일 압박을 보완한다."
    basic:
      archetype: JEAN_BASTET_COUNTER
      members: [122, 1, 44, 60]
      rows: { 7: Front, 122: Rear, 1: Front, 44: Rear, 60: Rear }
      reason: "현재 해금 로스터만으로 경호→선제 반격→바스테트 추격을 모두 확인하는 기본 편성."
    warning: "잔이 공격자를 선제 처치하면 원래 공격과 죽은 대상을 향한 바스테트 추격은 모두 취소된다."

  - mainId: 122
    mainName: 바스테트
    axis: "고속 일반행동·경호·반격 후속"
    starterRecommended: true
    best:
      archetype: BASTET_GUARD
      members: [7, 60, 44, 20]
      rows: { 122: Rear, 7: Front, 60: Rear, 44: Rear, 20: Front }
      reason: "잔이 경호와 선제 반격을 함께 제공해 바스테트의 상시 초월기 후속을 자연스럽게 연다."
    basic:
      archetype: BASTET_GUARD
      members: [7, 60, 44, 20]
      rows: { 122: Rear, 7: Front, 60: Rear, 44: Rear, 20: Front }
      reason: "5인 전장에서 경호→잔 선제 반격→바스테트 후속의 전체 연결을 확인하는 기본 편성."
    warning: "잔이 공격자를 선제 처치하거나 철권제재 기회가 0이면 후속 냥냥펀치는 예약되지 않는다."

  - mainId: 3
    mainName: 사바흐
    axis: "디버프·지속피해·아즈라엘 광역"
    starterRecommended: true
    best:
      archetype: SABAH_EXECUTION
