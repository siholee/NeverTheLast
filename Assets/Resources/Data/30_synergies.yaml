archetypes:
  - id: LOKAPALA_GATE
    name: 로카팔라 묶음 편성
    core: [63, 64, 65, 60]
    description: "인드라의 팔방의 소집이 바유 → 쿠베라 → 인드라 → 찬드라 순으로 특수행동을 연다. 바유의 방깍과 데바의 왕 +25% 위에서 쿠베라가 모아 둔 골드로 친다."
    partners: [2]
    counterplay: "인드라가 쓰러지면 묶음을 열 수 없다. 골드를 쓰면 골드 러쉬가 약해진다."
  - id: LOKAPALA_SHOCK
    name: 로카팔라 감전 편성
    core: [61, 66, 63, 60]
    description: "바루나의 물과 인드라 · 야마의 번개가 만나 감전이 생기고, 야마의 선고(+20%)와 지속피해 즉시 발동이 그 위에 얹힌다. 묶음 순서는 바루나(-50) → 인드라(+50) → 야마(+75) → 찬드라(+100)이다."
    partners: [20]
    counterplay: "인드라가 쓰러지면 묶음을 열 수 없다. 반응 지속피해는 특수방어력으로 경감되고 보호막을 우회한다."
  - id: VEDIC_FIRE
    name: 베다 불길 편성
    core: [62, 63, 64, 66]
    description: "바루나의 물을 바유가 퍼뜨리고, 인드라의 팔방의 소집에서 아그니가 인드라의 표 한 장을 보류해 물이 붙은 적을 중심으로 집중 포격한다. 순서는 바유(-100) → 바루나(-50) → 아그니(+25) → 인드라(+50) → 찬드라(+100)."
    partners: [60]
    counterplay: "인드라가 쓰러지면 묶음을 열 수 없다. 물이 없으면 증발 대신 계수만 남는다."
  - id: SUMMON_CYCLE
    name: 분신 순환 편성
    core: [121, 180, 65, 20]
    description: "우치의 분신 생성이 쿠베라의 보물을, 소멸이 아누비스의 영혼을 채운다. 피그말리온은 후열에서 갈라테아로 분신 피해를 올린다."
    partners: [1]
    counterplay: "아누비스는 스스로 공격을 끌지 못한다. 기수 코드 등으로 우선도를 받쳐야 한다."
  - id: JEAN_BASTET_COUNTER
    name: 잔·바스테트 선제 반격 편성
    core: [7, 122, 1, 44, 60]
    description: "잔이 바스테트의 공격을 넘겨받아 먼저 반격하고, 바스테트가 같은 공격자에게 후속 냥냥펀치를 잇는다. 세이의 보호막과 찬드라의 회복이 잔의 집중 피격을 받친다."
    partners: [20]
    counterplay: "잔의 반격 기회가 소진되거나 비행동 피해 위주인 적에게는 연계가 멈춘다."
