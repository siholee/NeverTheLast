      - { key: AMP_DMG, text: "창세의 노래 — 아군 전체 공격력 +(50 + 방어력 15%), 타격마다 고정 피해 추가(집중 3턴)" }
      - { key: MULTIHIT, text: "빅뱅 — 창세의 결정 7개로 무작위 적에게 바위 조각 7발, 이어서 아군 전체에 100 + 방어력 5% 보호막" }
      - { key: SHIELD, text: "창세의 노래 — 아군 전체에 레벨 × 2 + 방어력 25% 보호막" }
    wants: [TAUNT, DPS_ST]
    caution: "첫 빅뱅은 궁극기의 보호막이 깔린 뒤에야 쌓이기 시작한다. 집중은 세이가 기절하면 풀린다(보호막은 남는다)."

