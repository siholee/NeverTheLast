# 게임 시작 시 재생되는 인트로 시퀀스.
# 사건(StageEventData)과 같은 구조를 쓰므로 비주얼 노벨 화면이 그대로 재생한다.
# choices가 없으면 마지막 대사 후 자동으로 종료되고 다음 흐름(캐릭터 선택)으로 넘어간다.
#
# 대사에 쓸 수 있는 연출 필드:
#   portrait  : 초상화 파일명 (Resources/Sprite/Portraits 기준, 확장자 제외)
#               생략 시 speaker 이름을 유닛 이름과 대조해 자동 해석. 둘 다 없으면 내레이션.
#   emotion   : 표정. "{portrait}_{emotion}" 파일을 우선 사용하고 없으면 기본 초상화로 폴백
#   effect    : shake(흔들림) / bounce(톡 튀기) / flash(화면 번쩍) / none
#   sfx       : 1회 재생할 효과음 (Resources/Audio/SFX/{sfx})
#   bgm       : 이 대사부터 재생할 BGM (Resources/Audio/BGM/{bgm}), "stop"이면 정지
#   textSpeed : 타자기 속도 배율 (1 = 기본, 0.5 = 느리게, 2 = 빠르게)
#
# 오디오/표정 파일이 아직 없어도 안전하게 무시되므로, 파일을 넣으면 그대로 살아난다.

intros:
  - id: new_game_intro
    title: 새로운 여정
    dialogue:
      # "???"는 YAML 특수문자(?)로 시작하므로 반드시 따옴표로 감싼다.
      - speaker: "???"
        text: …끝나지 않는 밤이 세계를 삼킨 지, 얼마나 지났을까.
        textSpeed: 0.6
        bgm: intro_theme

      - speaker: "???"
        text: 신들은 침묵했고, 사람들은 별을 잃었다. 남은 것은 무너진 신전과, 그 사이를 걷는 몇 안 되는 이들뿐.
        textSpeed: 0.8

      - speaker: 기록자
        text: 그대는 그 마지막 이들 중 하나. 이름을 되찾기 위해 걷는 자.
        effect: flash
        sfx: intro_reveal

      - speaker: 기록자
        text: 이 여정에서 그대는 동료를 만나고, 그들을 단련하고, 때로는 신과 마주하게 될 것이다.

      # 아래 두 줄은 초상화 연출 확인용 카메오.
      # 화자 "츠쿠요미"가 유닛 이름과 일치하므로 초상화가 자동 해석되고,
      # emotion(smile) 이미지가 아직 없으므로 기본 초상화로 조용히 폴백된다.
      - speaker: 츠쿠요미
        text: …달이 지켜보고 있다. 네 걸음이 어디까지 닿는지.
        effect: flash
        sfx: intro_reveal

      - speaker: 츠쿠요미
        text: 함께 걸을 자를 고르는 일부터 시작해라. 첫 선택이 곧 네 길이 된다.
        emotion: smile
        effect: bounce

      - speaker: 기록자
        text: 자, 가자. 마지막까지 남는 자가 되어라.
        sfx: intro_start
