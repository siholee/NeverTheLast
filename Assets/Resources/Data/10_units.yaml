  # 보호막을 두른 아군이 맞을 때마다 결정을 모아 빅뱅을 터뜨리고, 터뜨린 뒤 아군 전체에 보호막을 둘러
  # 다음 결정의 재료를 스스로 깐다. 궁극기로 파티 전체의 공격력을 올리고 두꺼운 보호막을 두르며
  # 모든 타격에 고정 피해를 덧붙인다(집중).
  # 개편 전의 세이를 새 규칙으로 다시 만든 캐릭터다.
