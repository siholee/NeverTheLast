# 아군 유닛 데이터
#
# 스탯 규격 (2026-09 전면 개편) — 원본은 Detail_03 §2.
#   · 전투 스탯은 여덟이다.
#       최대 체력 · 공격력 · 특수공격력 · 방어력 · 특수방어력 · 속도 · 치명타 확률 · 치명타 피해
#   · 롤처럼 스탯마다 기초값(…Base)과 레벨당 성장치(…Growth)를 적는다.
#       스탯 = 기초값 + 성장치 × (레벨 − 1)
#     훈련 강화 · 주/부 스탯 배율은 없다. 아군의 레벨은 전투 EXP로만 오른다.
#   · 치명타 두 스탯은 퍼센트 포인트로 적는다(5 = 5%). 적지 않으면 5% / 50%, 속도는 100이다.
#   · 특수공격력은 피해 계수가 아니다 — 원소 반응 위력과 해로운 효과 명중에만 쓴다.
#     특수방어력은 지속피해 · 원소 반응 피해를 줄이고 해로운 효과를 피한다.
#   · 피해는 코드마다 "고정값 + 스탯 × 계수"로 적는다. 대부분 공격력 계수, 일부만 방어력 · 최대 체력.
#   · manaMax는 궁극기 마나. 일반행동 +20 · 피격 +5 · 처치 +10으로 찬다.
#
# 표준 성장(참고): 체력 +90 · 공격 +5 · 특공 +3.5 · 방어 +5 · 특방 +4 / Lv.
#   방어 경감의 기준값이 100 + 6 × (공격자 레벨 − 1)이라 같은 레벨끼리의 경감률은 레벨과 무관하게 일정하다.
#
# 캐릭터 분류 (characterType) — 해금 / 미해금 둘뿐이다. 메인 · 서포트 구분은 없다.
#   Unlocked — 처음부터 쓸 수 있다.
#   Locked   — 계정 해금(영입 사건 등) 전에는 쓸 수 없다(unlockCondition에 조건을 적는다).
# 게임 모드는 무한 모드 하나다. 해금한 캐릭터는 누구나 1~5인 편성에 오른다.
# 해금 패시브(levelPassives)는 없다. 기본 슬롯은 특성 · 일반행동 · 초월기이며,
# 특정 트리거가 여는 유닛만 선택적으로 special 슬롯을 가진다.
#
# archetypeTags는 전투 성향 UI 태그다(표시 이름은 UnitTagCatalog). Swift 신속 · Support 지원 · Shielding 방어 …
#
# 2026-09 개편으로 옛 로스터 52명을 모두 걷어냈다. 캐릭터를 하나씩 다시 만든다.

