# 아군 유닛 데이터
#
# 스탯 규격 (2026-08 개편):
#   · 공격력/방어력 스탯은 존재하지 않는다. 모든 전투 수치는 5스탯에서 파생된다.
#       피해     = 스킬 위력 × 주스탯 × 0.2   (포켓몬식 — 위력은 스킬마다 고정)
#       최대체력 = CON × 100
#       방어력   = STR × 1      (롤 방식: 받는 피해 배율 = 기준값 / (기준값 + 방어력))
#     기준값은 레벨에 비례해 커지므로 감소율은 레벨과 무관하게 일정하다.
#   · 스탯 = base + incrementLvl × (Level − 1) + incrementUpgrade × 강화횟수
#   · 아군의 Level은 EXP로 오른다 (킬 / 스테이지 클리어 / 육성).
#   · 일반 트레이닝 보너스: mainStat +20%, subStats +10% (부스탯 2개면 각 +5%)
#   · 특수 트레이닝 보너스(세이·시): mainStat +25%, subStats +15%
#
# mainStat은 5스탯 어느 것이든 쓸 수 있다.
# 스탯마다 공격 외의 고유 역할이 따로 있으므로, 주스탯이 이중 이득을 갖는 것은 의도된 설계다.
#   STR — 방어력 (받는 피해 비율 감소) + 장비 중량 한도
#   DEX — 행동 속도
#   CON — 최대 체력
#   INT — 마나 획득 효율
#   LUK — 치명타 확률
#
# 캐릭터 분류 (characterType)
#   Starter — 게임 초기부터 메인으로 사용 가능. 육성 완료 시 서포트 카드에도 추가되며
#             그 카드는 무한 모드에서도 쓸 수 있다.
#   Support — 게임 초기부터 서포터 카드로만 편성 가능. 무한 모드에서는 사용 불가.
#   Locked  — 초기에는 사용 불가. 육성 모드 중 아군으로 합류하면(포켓로그식) 영구 해금되어
#             이후 런부터 Starter처럼 메인으로 쓸 수 있다.
#
# 플래그 대응:
#   Starter → canStartAsMain: true,  canStartAsSupport: false, canUseInInfinite: true
#   Support → canStartAsMain: false, canStartAsSupport: true,  canUseInInfinite: false
#   Locked  → 셋 다 false (해금되면 런타임에서 Starter로 승격)
#
# 획득처 미정 캐릭터도 기획이 끝났다면 Locked로 등록해 둔다.
# 새 테마를 추가할 때 영입 사건을 붙여 획득 경로를 부여한다.

