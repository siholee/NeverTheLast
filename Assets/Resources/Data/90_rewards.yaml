# 공용 드랍 — 어느 적을 처치하든 보상 후보에 오르는 식량.
# 한 전투에서 처치한 적들의 drops(60_enemies.yaml) + 이 목록 + 아래 소모품이 한 풀로 합쳐지고,
# 라운드 티어 확률로 카드마다 티어를 굴려 뽑는다(3장, 25스테이지마다 +1, 최대 6장).
# 적 드랍이 안 나올 수도, 소모품이 안 나올 수도 있다. 소모품 장수 상한은 없다.
commonDropItemIds:
  [5001, 5003]

# 보상 카드 한 장의 분류 비율과 코드 가중치(Detail_17 §5.1).
rewardCategoryWeights: { code: 55, consumable: 30, drop: 15 }
codeTagWeights: { match: 2, universal: 1, other: 0.5 }
upperCodeWeight: 1.5

rewardTierOdds:
  - round: 1
    tierWeights: [100, 0, 0, 0, 0]
  - round: 2
    tierWeights: [75, 25, 0, 0, 0]
  - round: 3
    tierWeights: [55, 35, 10, 0, 0]
  - round: 4
    tierWeights: [35, 40, 20, 5, 0]
  - round: 5
    tierWeights: [20, 35, 35, 10, 0]
  - round: 6
    tierWeights: [10, 25, 40, 20, 5]
  - round: 7
    tierWeights: [5, 20, 35, 30, 10]
  - round: 8
    tierWeights: [0, 15, 30, 40, 15]
  - round: 9
    tierWeights: [0, 10, 25, 45, 20]
  - round: 10
    tierWeights: [0, 5, 20, 45, 30]

