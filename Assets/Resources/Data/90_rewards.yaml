# 공용 드랍 — 어느 적을 처치하든 보상 후보에 오르는 장비·귀중품.
# 한 전투에서 처치한 적들의 drops(60_enemies.yaml) + 이 목록 + 아래 소모품이 한 풀로 합쳐지고,
# 라운드 티어 확률로 카드마다 티어를 굴려 뽑는다(3장, 25스테이지마다 +1, 최대 6장).
# 적 드랍이 안 나올 수도, 소모품이 안 나올 수도 있다. 소모품 장수 상한은 없다. 적 전용 장비(enemyOnly)는 여기 적지 않는다.
# 캐릭터 전용 장비는 여기 있어도 주인이 덱에 없으면 빠진다(requiredUnitIds).
commonDropItemIds:
  # T1 기본 장비
  [4101, 4102, 4103, 4104, 4105, 4106, 4107, 4108, 4109, 4115, 4110, 4111, 4112, 4113, 4114,
  # T2 범용 목걸이 · 상점 매대 20종
