   4301, 4302, 4305, 4401, 4402, 4403, 4404, 4501, 4502, 4503, 4504, 4505,
  # 범용 귀중품
   4901, 4902, 4903, 4904, 4905,
  # 캐릭터 전용 — 사바흐 · 시구르드 · 브륀힐드 · 츠쿠요미 · 스사노오 · 세이메이
