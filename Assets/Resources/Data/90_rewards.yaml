# 강화제 — 파티 전체의 5스탯 하나를 <5전투 동안> 올린다. 포켓로그의 플러스 파워 계열이다.
#   T1~T3은 합연산(tonicFlat), T4~T5는 곱연산(tonicMultiplier)이다.
#   합연산은 초반에, 곱연산은 스탯이 커지는 후반에 강하다 — 티어가 곧 <언제 쓰는 물건인가>다.
#   지속 전투 수는 코드 상수(PartyTonicState.BattleDuration)가 한 벌만 들고 있다.
#   상점에는 올리지 않는다(goldCost 없음). 보상 카드로만 얻는다.

