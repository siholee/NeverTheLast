# 이상한 사탕 — 경험치를 건너뛰고 레벨을 직접 올린다.
#   T3부터 나온다. 쌓아 둔 EXP는 그대로 두므로 "먹기 전에 레벨을 올려 두는 것이 이득"이
#   되지 않는다. 전체 사탕은 쓰러진 아군에게도 들어간다 — 한 판 진 것 때문에 성장에서만
#   뒤처지면 되돌릴 방법이 없기 때문이다.
#   상점가는 소모품 중 가장 비싸다. 레벨은 런의 주축이라 값싸게 사 모을 수 있으면 안 된다.

  - id: rare_candy_t3
    displayName: 이상한 사탕
    description: 지정한 아군의 레벨 +1
    tier: 3
    themeIds: []
    levelGrant: 1
    goldCost: 400
  - id: rare_candy_t4
    displayName: 이상한 사탕 다발
    description: 아군 전원의 레벨 +2
    tier: 4
    themeIds: []
    levelGrant: 2
    levelGrantParty: true
    goldCost: 900

# 육성 소모품 — 육성 모드에서만 나온다(무한 모드의 보상 풀 · 상점에는 오르지 않는다).
#   훈련은 체력만 쓰고 컨디션을 건드리지 않는다. 컨디션은 휴식(낮은 확률) · 드문 사건으로 오르고,
#   메인이 전투에서 쓰러지면 내려간다 — 영약은 그것을 확실히 되돌리는 수단이다.
#   써도 달라지는 것이 없으면(컨디션 최상 · 체력 가득 · 노트 상한) 보상 후보에도, 상점에서도 막힌다.
#   상점에서는 소모품 탭이 8칸을 넘어 잘리므로 [육성] 탭에 따로 진열한다.
#   값(체력 20/40/65 · 노트 +20/40/60%)은 우마무스메의 비타민 · 노트 단계를 옮겼다.

