      # 6슬롯부터 판이 갈린다. 광전사가 에인하르로, 볼바가 노른으로 바뀌고 발키리가 선다.
      # 발키리의 전장의 선택자가 노르드 수를 세므로 편성이 커질수록 세진다.
      - stageInRound: 6
