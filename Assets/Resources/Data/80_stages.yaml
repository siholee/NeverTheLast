# 테마 / 사건 / 고정 보스 정의
#
# 운영 테마는 로마 군단(5)·메히코(6)·아스완(7)·공허 8종(8~15)·노르드 3부작(16~18)·천공 전선(19)·해안 전선(20)이다.
# 콜로세움(id 4)은 리메이크가 필요해 enabled: false로 잠시 빼두었다.
#   데이터는 그대로 두었으므로 다시 켤 때는 그 줄만 지우거나 true로 바꾸면 된다.
# 일본은 천공·해안 전선이 돌아왔다. 지상(아마테라스) 전선은 아직 없다.
# 케찰코아틀은 메히코 9스테이지 조우로 복귀했으며, 영웅 획득 경로는 아직 별도다.
#
# 테마를 다시 늘릴 때 필요한 것:
#   1. 전용 적 초상화 자산
#   2. 60_enemies.yaml에 해당 themeId의 normal/elite/boss 등록
#   3. 여기 stageThemes에 항목 추가 (enemyThemeId를 적 themeId와 일치시킬 것)
#   4. 필요하면 events에 테마 사건 추가
#
# stagePatterns가 있는 스테이지는 midBossId/bossId 단독 스폰보다 우선한다.
# 보스에게 호위를 붙이고 싶으면 그 스테이지의 패턴에 보스 ID를 직접 적으면 된다.
# midBossStageInRound를 비워 두면 기존 규칙대로 8스테이지가 중간 보스 슬롯이다.

stageThemes:
  # ── 콜로세움 (일시 비활성) ─────────────────────────────────────────
  # 리메이크 예정이라 런 로테이션에서 빼두었다. 편성·보스는 그대로 두었다.
  # 5슬롯 사건(가면 쓴 검투사)은 리메이크 때 새로 쓰기 위해 삭제했다 — 다시 켜면 5슬롯이 비어 있다.
  # ── 콜로세움 ──────────────────────────────────────────────────────
  # 아홉 전투 슬롯에 <b>한 명씩</b> 선다. 검투사 여섯을 엘리트로 올려
  # 테마 전체가 엘리트·보스로만 채워지는 유일한 구성이다.
  #
  #   * 천살성(11)은 일반 등급만 잡으므로 이 테마에서는 한 번도 통하지 않는다.
  #   * 광역은 값을 잃고 단일 화력이 그대로 산다. 편성의 성격을 정면으로 시험한다.
  #   * 적이 하나뿐이라 상단 체력 띠와 카드 확대가 매 판 켜진다.
  #
  # 검투사마다 다른 원소를 두르고 자기 원소를 부착하므로, 겹치면 자기 짝 반응이 터진다 —
  # 진동(기절) · 착근(지연) · 화상(지속피해) · 확산(전파) · 둔화를 결투마다 하나씩 배운다.
  # 물(정수 INT+)과 전기(축전 LUK+)는 버프가 되므로 쓰지 않는다.
  - id: 4
    name: 콜로세움
    tags: [Colosseum, Rome, Festival]
    enemyThemeId: 5
    description: 로마 각지의 검투사가 하나씩 모래 위에 선다. 여럿을 상대할 일은 없고, 매번 한 명이다.
    midBossId: 2004
    midBossStageInRound: 8
    bossId: 3003
    ambientColor: "#5A3A1E"   # 콜로세움 — 모래와 횃불
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { frontIds: [1020], weight: 100 }   # 무르밀로 — 바위 · 진동
      - stageInRound: 2
        patterns:
          - { frontIds: [1021], weight: 100 }   # 호플로마쿠스 — 풀 · 착근
      - stageInRound: 3
        patterns:
          - { frontIds: [1022], weight: 100 }   # 트라엑스 — 불 · 화상
      - stageInRound: 4
        patterns:
          - { rearIds: [1023], weight: 100 }    # 레티아리우스 — 바람 · 확산. 그물잡이라 후열이다
      - stageInRound: 6
        patterns:
          - { frontIds: [1024], weight: 100 }   # 세쿠토르 — 얼음 · 둔화
      - stageInRound: 7
        patterns:
          - { frontIds: [1025], weight: 100 }   # 디마카이루스 — 불 · 화상
      - stageInRound: 8
        patterns:
          - { frontIds: [2004], weight: 100 }   # 프리무스 팔루스 마르켈루스 — 중간 보스
      - stageInRound: 9
        patterns:
          - { rearIds: [2005], weight: 100 }    # 베스티아리우스 사비나
      - stageInRound: 10
        patterns:
          - { frontIds: [3003], weight: 100 }   # 스파르타쿠스

  # ── 로마 군단 ──────────────────────────────────────────────────────
  # 콜로세움이 '축제'라면 이쪽은 '전쟁'이다. 전열 사다리를 그대로 밟아 올라가는 편성이라
  # 스테이지가 진행될수록 같은 자리에 더 단단한 병종이 들어선다.
  #
