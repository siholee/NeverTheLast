events:
  - id: colosseum_masked_gladiator
    themeId: 4
    stageInRound: 5
    oncePerRun: true
    title: 가면 쓴 검투사
    dialogue:
      - speaker: 일행
        text: 축제의 함성이 경기장 밖까지 울린다. 다음 시합을 기다리는 검투사들 사이에서 유난히 여유로운 사내 하나가 손을 흔든다.
      - speaker: 가면 쓴 검투사
        text: 처음 보는 얼굴들이군. 오늘은 오래 버티는 쪽이 이기는 날이라던데, 내기는 했나?
        portrait: SHI_PORTRAIT
        standing: SPARTACUS_STANDING
      - speaker: 일행
        text: 트라키아식 억양, 목에 남은 오래된 사슬 자국, 그리고 자유를 말할 때만 잠깐 사라지는 웃음. 역사에서 읽었던 인물이 떠오른다.
      - speaker: 주인공
        text: 스파르타쿠스.
      - speaker: 스파르타쿠스
        text: 하하, 들켰나? 이름 하나 숨기는 게 칼 휘두르는 것보다 어렵군. 그래도 축제는 끝까지 즐겨야지. 결승에서 보자고.
        portrait: SPARTACUS_PORTRAIT
        standing: SPARTACUS_STANDING
    choices:
      - id: keep_spartacus_secret
        text: 관중 앞에서는 모르는 척한다.
        action: continue
        successText: 스파르타쿠스는 웃으며 경기장으로 돌아갔다. 결승전에서 그의 진짜 실력을 확인하게 될 것이다.
      - id: warn_spartacus
        text: 로마 경비대가 눈치채기 전에 떠나라고 경고한다.
        action: continue
        successText: 그는 고맙다는 듯 고개를 끄덕였지만, 받은 의뢰와 결승전은 끝내겠다며 자리를 지켰다.

  - id: legion_crossing_the_rubicon
    themeId: 5
    stageInRound: 5
    oncePerRun: true
    title: 강가의 야영지
    dialogue:
      - speaker: 일행
        text: 강 건너편에 군단의 야영지가 늘어서 있다. 보초는 이쪽을 보고도 창을 내리지 않는다. 싸울 상대로 세지 않았다는 뜻이다.
      - speaker: 백인대장
        text: 여기서부터는 군단의 관할이다. 지나가려면 이름을 대라.
        portrait: MARCELLUS_PORTRAIT
        standing: MARCELLUS_STANDING
      - speaker: 일행
        text: 천막 사이로 지휘관 하나가 걸어 나온다. 갑옷은 병사들과 다를 바 없는데, 지나가는 병사마다 하던 일을 멈추고 고개를 숙인다.
      - speaker: 카이사르
        text: 이름은 됐다. 강을 건널 셈이면 건너라. 어차피 한 번 건넌 다리는 되돌아갈 수 없으니, 서로 각오만 확인해 두자고.
        portrait: CAESAR_PORTRAIT
        standing: CAESAR_STANDING
    choices:
      - id: legion_accept_challenge
        text: 결승에서 보자고 답한다.
        action: continue
        successText: 카이사르는 짧게 웃고 돌아섰다. 야영지의 병사들이 길을 터 준다.
      - id: legion_observe_camp
        text: 대답 없이 야영지의 진형을 눈에 담는다.
        action: continue
        successText: 전열과 후열이 칼같이 나뉘어 있다. 어느 자리에 누가 서는지 미리 알아 둔 것만으로도 소득이다.

  - id: mexica_smoking_mirror
    themeId: 6
    stageInRound: 5
    oncePerRun: true
    title: 연기 나는 거울
    dialogue:
      - speaker: 일행
        text: 흑요석 거울 위로 검은 연기가 피어오른다. 재규어의 울음과 독수리의 날갯짓이 한 박자 늦게 메아리친다.
      - speaker: 테스카틀리포카
        text: 전열은 제물이고 후열은 증인이다. 너희는 어느 쪽에 설 테냐.
        portrait: AZTEC_TEZCATLIPOCA_PORTRAIT
        standing: AZTEC_TEZCATLIPOCA_STANDING
    choices:
      - id: mexica_face_the_mirror
        text: 거울을 똑바로 바라본다.
        action: continue
        successText: 연기가 걷히며 다음 전장으로 이어지는 검은 길이 열린다.
      - id: mexica_break_the_ritual
        text: 의식의 북을 끊는다.
        action: continue
        successText: 북소리는 멎었지만 전사들의 발걸음은 더 빨라졌다.

  - id: aswan_the_first_seal
    themeId: 7
    stageInRound: 5
    oncePerRun: true
    title: 첫 번째 봉인
    dialogue:
      - speaker: 일행
        text: 강 상류의 채석장이 통째로 불에 그을려 있다. 무너진 신전 기둥마다 같은 문장이 새로 새겨져 있다 — 종말을 선포하는 사도들의 것이다.
      - speaker: 호루스
        text: 여기서부터는 아버지의 땅이다. 사도들이 불을 놓았고, 그 재 밑에서 무언가가 걸어 나오고 있다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
      - speaker: 일행
        text: 그가 활을 내리지 않은 채 강 건너편을 가리킨다. 모래 위로 발자국이 이어지는데, 발자국을 남긴 것들의 그림자가 보이지 않는다.
      - speaker: 호루스
        text: 사령은 죽여도 한 번은 다시 일어선다. 두 번 죽일 각오가 없다면 강을 건너지 마라.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
    choices:
      - id: aswan_ask_about_osiris
        text: 재 밑에서 걸어 나온 것이 무엇인지 묻는다.
        action: continue
        successText: 호루스는 대답 대신 상류를 오래 바라보았다. 그 이름을 입에 올리지 않는 것만으로도 답이 되었다.
      - id: aswan_burn_the_seal
        text: 기둥에 새겨진 문장을 지운다.
        action: continue
        successText: 문장은 지워졌지만 그을음은 남았다. 사도들은 곧 같은 자리에 다시 새길 것이다.

  # 아문·라 최초 격파 직후 한 번만 동적 큐에 들어가는 합류 대화.
  - id: aswan_bastet_first_amun_ra_clear
    themeId: 0
    stageInRound: 0
    requiresBossDefeatId: 3012
    title: 모래 위의 고양이 발자국
    dialogue:
      - speaker: 일행
        text: 아문·라의 빛이 꺼진 자리에서 가벼운 발소리가 들린다. 무너진 기둥 위에 앉아 있던 여인이 천천히 내려온다.
      - speaker: 바스테트
        text: 태양이 너무 오래 하늘을 독차지했어. 쓰러뜨린 솜씨는 마음에 드는데, 다음 사냥터도 이만큼 재미있을까?
        portrait: BASTET_PORTRAIT
        standing: BASTET_STANDING
      - speaker: 바스테트
        text: 자리가 남는다면 같이 가지. 발소리는 죽이고, 적의 목숨만 깨워 줄게.
        portrait: BASTET_PORTRAIT
        standing: BASTET_STANDING
    choices:
      - id: recruit_bastet_after_amun_ra
        text: 바스테트를 동료로 맞이한다.
        action: continue
        grantUnitId: 122
        successText: 바스테트가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_bastet_after_amun_ra
        text: 이번에는 각자의 길을 간다.
        action: continue
        successText: 바스테트는 아쉬운 듯 웃더니 모래바람 속으로 사라졌다.

  # 아문·라 격파 이후 모든 테마의 사건 슬롯에서 출현 가능한 별개의 T4 영입 사건.
  - id: t4_horus_falcon_without_throne
    themeId: 0
    stageInRound: 5
    tier: 4
    requiresBossDefeatId: 3012
    oncePerRun: true
    title: 왕좌 없는 매
    dialogue:
      - speaker: 일행
        text: 길목의 폐허 위로 매 한 마리가 원을 그린다. 그림자가 세 번째로 겹친 순간, 활을 든 전사가 돌기둥 뒤에서 모습을 드러낸다.
      - speaker: 호루스
        text: 아문·라는 쓰러졌지만 하늘의 질서는 돌아오지 않았다. 왕좌를 되찾기 전에, 그 빈자리를 노리는 것부터 막아야 한다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
      - speaker: 호루스
        text: 너희의 길이 종말을 거슬러 간다면 내 화살도 같은 곳을 향할 것이다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
    choices:
      - id: recruit_horus_after_amun_ra
        text: 호루스에게 함께 싸우자고 청한다.
        action: continue
        grantUnitId: 120
        successText: 호루스가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_horus_after_amun_ra
        text: 아직은 각자의 전장을 지킨다.
        action: continue
        successText: 호루스는 매의 울음과 함께 하늘 너머로 사라졌다.

  - id: t4_set_red_desert_compact
    themeId: 0
    stageInRound: 5
    tier: 4
    requiresBossDefeatId: 3012
    oncePerRun: true
    title: 붉은 사막의 맹약
    dialogue:
      - speaker: 일행
        text: 바람이 멎자 붉은 모래가 벽처럼 솟는다. 모래 장막 한가운데서 거대한 검을 멘 전사가 웃음을 터뜨린다.
      - speaker: 세트
        text: 태양의 왕을 꺾었다고 질서까지 네 편이 된 건 아니다. 사막은 늘 가장 강한 자의 발자국만 남기지.
        portrait: SET_PORTRAIT
        standing: SET_STANDING
      - speaker: 세트
        text: 네가 더 큰 혼돈을 찾아간다면 내가 앞장서 주마. 대신 지루하게 만들지는 마라.
        portrait: SET_PORTRAIT
        standing: SET_STANDING
    choices:
      - id: recruit_set_after_amun_ra
        text: 세트와 맹약을 맺는다.
        action: continue
        grantUnitId: 123
        successText: 세트가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_set_after_amun_ra
        text: 혼돈과 손잡지 않는다.
        action: continue
        successText: 세트는 다음 선택은 달라질 거라며 붉은 모래 속으로 돌아갔다.

# 고정 보스는 현재 없다.
# 25/50/75/100 지점의 고정 보스는 아직 설계되지 않았다.
# 🔸 '고정 보스 라운드에서는 2번 스테이지를 건너뛰고 이후 스테이지를 1씩 당긴다'는
#    규칙이 기획에 있으나 아직 구현하지 않았다. 현재 엔진은 그 대신
#    보스 슬롯을 10 → 9로 당기는 기존 방식을 쓴다. Design_Backlog 항목 13을 볼 것.

  - id: nord_the_raiders_fire
    themeId: 16
    stageInRound: 5
    oncePerRun: true
    title: 꺼지지 않는 불
    dialogue:
      - speaker: 일행
        text: 눈밭 한가운데 모닥불이 타고 있다. 주인은 보이지 않는데 불은 조금도 사그라들지 않는다. 둘레의 눈만 녹지 않고 그대로다.
      - speaker: 볼바
        text: 손을 쬐고 가라. 우리는 저 불로 얼음을 녹이지 않는다. 얼음 위에 얹을 뿐이지.
        portrait: VOLVA_PORTRAIT
        standing: VOLVA_STANDING
      - speaker: 일행
        text: 노파는 지팡이로 불을 한 번 휘젓고, 튄 불똥이 눈에 닿자 그 자리가 하얗게 터진다. 광전사들이 왜 그렇게 달려드는지 이제야 알겠다.
    choices:
      - id: nord_warm_hands
        text: 불을 쬐고 간다.
        action: continue
        successText: 언 손이 풀렸다. 다음 싸움의 첫 수가 한 박자 빨라질 것 같다.
      - id: nord_douse_the_fire
        text: 불을 눈으로 덮어 끈다.
        action: continue
        successText: 불은 꺼졌지만 노파는 웃기만 했다. 얼음 위에 불을 얹는 수는 그들이 먼저 배운 것이다.

  - id: nord_north_the_white_silence
    themeId: 17
    stageInRound: 5
    oncePerRun: true
    title: 그치지 않는 눈
    dialogue:
      - speaker: 일행
        text: 사흘째 눈이 그치지 않는다. 발밑에서 무언가 규칙적으로 울린다. 눈을 걷어 내자 금속 껍질이 드러난다.
      - speaker: 일행
        text: 씨앗이다. 아직 깨어나지 않았고, 껍질 안쪽에서 천천히 빛이 돈다. 건드리면 깨어날 것이고 깨어나면 터질 것이다.
      - speaker: 일행
        text: 북쪽으로 갈수록 눈이 두꺼워진다. 이 추위는 하늘이 아니라 땅에서 올라오고 있다.
    choices:
      - id: nord_north_leave_the_seed
        text: 덮어 두고 돌아간다.
        action: continue
        successText: 눈을 다시 덮었다. 깨우지 않는 것도 한 가지 답이다.
      - id: nord_north_break_the_shell
        text: 껍질을 깨 본다.
        action: continue
        successText: 껍질 안은 비어 있었다. 대신 안쪽 벽에 서리가 낀 무늬가 있다 — 터질 때 무엇이 퍼지는지 미리 본 셈이다.

