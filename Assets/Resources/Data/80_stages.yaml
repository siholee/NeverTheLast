  # enemyThemeId를 15로 둔 것은 편성을 전부 명시 ID로 못 박아 소환에는 읽히지 않고,
  # 슬롯을 빠뜨렸을 때 폴백이 얼음 공허 적을 대신 세우게 하기 위해서다.
  # 🔸 보스 자리는 혹한의 거인이 대신 선다. 3061 공허의 거인이 서면 그때 바꿔 끼운다.
  # 🔸 chainNextThemeId는 노르드 중부(18)가 생기면 18로 적는다. 지금은 여기서 연작이 끝난다.
  - id: 17
