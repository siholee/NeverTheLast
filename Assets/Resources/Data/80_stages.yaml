  # 18(노르드 중부)이 서면 같은 방식으로 세 배가 된다.
  - id: 16
    name: 노르드
    tags: [Nord, Human]
    enemyThemeId: 17
    description: "약탈 무리가 눈밭을 건너온다. 볼바가 얼음을 깔고 광전사가 그 위에 불을 얹는다."
    midBossId: 2050
    midBossStageInRound: 4
    bossId: 3060
    chainNextThemeId: 17
    ambientColor: "#2A3B4E"   # 노르드 — 눈과 쇠
    stagePatterns:
      # 1~3슬롯은 약탈 무리다. 볼바가 1에서 2로 늘어나는 3슬롯이 첫 학습 지점이다 —
      # 하나일 때는 밀어붙여도 되지만 둘이 겹치면 회복량이 화력을 넘는다.
      - stageInRound: 1
        patterns:
          - { frontIds: [1120, 1120], rearIds: [1122], weight: 100 }
      - stageInRound: 2
        patterns:
          - { frontIds: [1120, 1120, 1120], rearIds: [1122], weight: 100 }
      - stageInRound: 3
        patterns:
          - { frontIds: [1120, 1120, 1120], rearIds: [1122, 1122], weight: 100 }
      # 4슬롯 — 두목. 중간 보스를 8이 아니라 여기 둔 것은 3슬롯의 시험을 바로 이어받기 위해서다.
