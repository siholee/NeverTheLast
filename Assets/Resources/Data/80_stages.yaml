  #   4    호루스 조우 — 앞 절반의 마침표.
  #   6~8  사령 — 되살아나고 스스로 수를 불리는 편성. 처리 속도를 시험한다.
  #   9    오시리스 — 깎을수록 단단해지는 부위 파괴 보스. 깰 때마다 사령이 쏟아진다.
  #   10   아문·라 — 스택을 쌓아 한 번에 터뜨리는 최종 보스.
