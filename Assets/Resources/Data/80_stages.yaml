events:
  - id: trial_the_quiet_sand
    themeId: 1
    stageInRound: 5
    oncePerRun: false
    title: 고요한 모래
    dialogue:
      - speaker: 일행
        text: 짐승들의 발소리가 잠시 끊겼다. 모래 위에 깨진 돌 조각들이 흩어져 있다 — 방금까지 누군가 싸운 흔적이다.
      - speaker: 세이
        text: 땅이 울퉁불퉁하네. 조금만 골라 두면 다음 싸움이 편해질 거야.
      - speaker: 일행
        text: 세이가 손을 뻗자 흩어진 조각들이 금빛으로 떠올라 그녀의 주위를 한 바퀴 돈다.
    choices:
      - id: trial_rest_a_moment
        text: 잠시 숨을 고른다.
        action: continue
        successText: 모래바람이 가라앉았다. 일행은 다시 걸음을 옮긴다.
      - id: trial_press_on
        text: 쉬지 않고 앞으로 나아간다.
        action: continue
        successText: 멀리서 다시 짐승들의 울음이 들려온다.

  - id: odyssey_the_long_way_home
    themeId: 21
    stageInRound: 5
    oncePerRun: true
    title: 돌아가지 못한 배
    dialogue:
    - speaker: 일행
      text: 부서진 뱃머리가 모래에 반쯤 묻혀 있다. 삭은 밧줄에 아직 사람 손자국이 남아 있는 것을 보면, 버려진 지 오래된 배는 아니다.
    - speaker: 일행
      text: 뱃전에 칼끝으로 긁은 글자가 줄줄이 새겨져 있다. 날짜다. 스무 해치가 넘는다. 마지막 줄만 숫자가 없고, 대신 한 문장이 있다.
    - speaker: 일행
      text: 「집이 어디였는지 잊기 전에 돌아간다.」
    - speaker: 일행
      text: 파도가 밀려와 글자 절반을 지우고 물러난다. 바닷물이 닿은 자리에서 희미하게 푸른 빛이 번진다. 공허다.
    choices:
    - id: odyssey_carve_the_date
      text: 빈 자리에 오늘 날짜를 새겨 넣는다.
      action: continue
      successText: 칼끝이 삭은 나무를 파고든다. 누군가 이 배를 다시 찾는다면, 적어도 여기서 끝나지 않았다는 것은 알 것이다.
    - id: odyssey_push_the_hull
      text: 뱃머리를 파도 쪽으로 밀어 준다.
      action: continue
      successText: 배는 몇 번 흔들리다 물살에 실려 나간다. 돌아갈 곳을 찾지 못하더라도, 모래에 묻혀 있는 것보다는 낫다.
    blockedUnitIds: []
  - id: legion_crossing_the_rubicon
    themeId: 23
    stageInRound: 5
    oncePerRun: true
    title: 강가의 야영지
    dialogue:
    - speaker: 일행
      text: 강 건너편에 군단의 야영지가 늘어서 있다. 보초는 이쪽을 보고도 창을 내리지 않는다. 싸울 상대로 세지 않았다는 뜻이다.
    - speaker: 백인대장
      text: 여기서부터는 군단의 관할이다. 지나가려면 이름을 대라.
      portrait: MARCELLUS_PORTRAIT
      standing: MARCELLUS_STANDING
    - speaker: 일행
      text: 천막 사이로 지휘관 하나가 걸어 나온다. 갑옷은 병사들과 다를 바 없는데, 지나가는 병사마다 하던 일을 멈추고 고개를 숙인다.
    - speaker: 카이사르
      text: 이름은 됐다. 강을 건널 셈이면 건너라. 어차피 한 번 건넌 다리는 되돌아갈 수 없으니, 서로 각오만 확인해 두자고.
      portrait: CAESAR_PORTRAIT
      standing: CAESAR_STANDING
    choices:
    - id: legion_accept_challenge
      text: 결승에서 보자고 답한다.
      action: continue
      successText: 카이사르는 짧게 웃고 돌아섰다. 야영지의 병사들이 길을 터 준다.
    - id: legion_observe_camp
      text: 대답 없이 야영지의 진형을 눈에 담는다.
      action: continue
      successText: 전열과 후열이 칼같이 나뉘어 있다. 어느 자리에 누가 서는지 미리 알아 둔 것만으로도 소득이다.
