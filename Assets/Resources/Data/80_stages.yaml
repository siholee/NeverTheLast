    dialogue:
    - speaker: 일행
      text: 두 사람은 무기를 내려놓지 않았다. 다만 겨누지도 않는다. 창끝이 우리를 지나 길 끝을 향해 있다.
    - speaker: 브륀힐드
      text: 우리는 저 사람을 막으라고 세워진 것이 아니라, 저 사람에게 세워진 거다. 그 차이를 이제야 알았다.
      portrait: BRYNHILD_PORTRAIT
      standing: BRYNHILD_STANDING
    - speaker: 시구르드
      text: 맹세는 아직 유효하다. 다만 대상이 바뀌었을 뿐이지. 한 사람은 남아 길을 지켜야 하니, 데려갈 쪽을 골라라.
      portrait: SIGURD_PORTRAIT
      standing: SIGURD_STANDING
    choices:
    - id: nord_central_take_sigurd
      text: 이곳의 전선을 맡기고 작별한다.
      action: continue
      successText: 그는 이곳의 전선을 지키기로 했다. 일행은 다음 여정을 향해 떠난다.
    - id: nord_central_take_brynhild
      text: 이곳의 전선을 맡기고 작별한다.
      action: continue
      successText: 그는 이곳의 전선을 지키기로 했다. 일행은 다음 여정을 향해 떠난다.
    - id: nord_central_take_neither
      text: 둘 다 두고 간다.
      action: continue
      successText: 두 사람은 길을 비켜 주었다. 다음에 만날 때는 같은 편일 것이다.
