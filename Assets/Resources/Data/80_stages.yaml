# 테마 / 사건 / 고정 보스 정의
#
# 운영 테마는 로마 군단(id 5), 메히코(id 6), 아스완(id 7)이다.
# 콜로세움(id 4)은 리메이크가 필요해 enabled: false로 잠시 빼두었다.
#   데이터는 그대로 두었으므로 다시 켤 때는 그 줄만 지우거나 true로 바꾸면 된다.
# 노르드·일본 테마는 전용 적 스프라이트가 없어 제거되었다.
# 케찰코아틀은 메히코 9스테이지 조우로 복귀했으며, 영웅 획득 경로는 아직 별도다.
#
# 테마를 다시 늘릴 때 필요한 것:
#   1. 전용 적 초상화 자산
#   2. 60_enemies.yaml에 해당 themeId의 normal/elite/boss 등록
#   3. 여기 stageThemes에 항목 추가 (enemyThemeId를 적 themeId와 일치시킬 것)
#   4. 필요하면 events에 테마 사건 추가
#
# stagePatterns가 있는 스테이지는 midBossId/bossId 단독 스폰보다 우선한다.
# 보스에게 호위를 붙이고 싶으면 그 스테이지의 패턴에 보스 ID를 직접 적으면 된다.
# midBossStageInRound를 비워 두면 기존 규칙대로 8스테이지가 중간 보스 슬롯이다.

stageThemes:
  # ── 콜로세움 (일시 비활성) ─────────────────────────────────────────
  # 리메이크 예정이라 런 로테이션에서 빼두었다. 편성·보스·사건은 손대지 않았으므로
  # enabled를 true로 되돌리면 그대로 돌아온다.
  - id: 4
    name: 콜로세움
    enabled: false
    tags: [Colosseum, Rome, Festival]
    enemyThemeId: 5
    description: 로마 각지의 인간 검투사와 속주에서 붙잡아 온 괴수가 맞붙는 대축제입니다.
    midBossId: 2005
    bossId: 3003
    ambientColor: "#5A3A1E"   # 콜로세움 — 모래와 횃불
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { enemyIds: [1020, 1023], weight: 100 }
      - stageInRound: 2
        patterns:
          - { enemyIds: [1021, 1022], weight: 100 }
      - stageInRound: 3
        patterns:
          - { enemyIds: [1023, 1024, 1020], weight: 60 }
          - { enemyIds: [1025, 1021, 1020], weight: 40 }
      - stageInRound: 4
        patterns:
          - { enemyIds: [2004, 1023], weight: 100 }
      - stageInRound: 6
        patterns:
          - { enemyIds: [1020, 1025, 1023, 1024], weight: 50 }
          - { enemyIds: [1021, 1022, 1023, 1024], weight: 50 }
      - stageInRound: 7
        patterns:
          - { enemyIds: [1020, 1021, 1023, 1024, 1025], weight: 100 }
      - stageInRound: 9
        patterns:
          - { enemyIds: [2004, 1022, 1024, 1025], weight: 50 }
          - { enemyIds: [1020, 1021, 1023, 1024, 1025], weight: 50 }

  # ── 로마 군단 ──────────────────────────────────────────────────────
  # 콜로세움이 '축제'라면 이쪽은 '전쟁'이다. 전열 사다리를 그대로 밟아 올라가는 편성이라
  # 스테이지가 진행될수록 같은 자리에 더 단단한 병종이 들어선다.
  #
  # 중간 보스 슬롯을 9로 옮겼다. 아그리파는 옥타비아를 밀어 주는 서포터라
  # 단독으로 세우면 위협이 되지 않고, 둘을 함께 세우려면 호위가 붙는 패턴이 필요하다.
  # 보스 슬롯(10)도 패턴으로 적어 카이사르에게 호위를 붙였다.
