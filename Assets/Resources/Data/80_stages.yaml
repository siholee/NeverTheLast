          - { frontIds: [1096, 1100], rearIds: [1108, 1068], weight: 100 }
      # 3슬롯부터 공허의 갑주. 돌격대장이 물을 맡고 얼음 기사·사수·프리즘이 뒤따른다.
      - stageInRound: 3
        patterns:
          - { frontIds: [1140, 1100], rearIds: [1108, 1068], weight: 100 }
      - stageInRound: 4
        patterns:
          - { frontIds: [1140, 1100], rearIds: [1108, 1108, 1068], weight: 100 }
      # 선봉대장은 전열에만 바위를, 사냥꾼은 후열에만 불을 붙인다 — 열이 달라 단조가 잘 나지 않는다.
      - stageInRound: 6
        patterns:
          - { frontIds: [1141, 1141], rearIds: [1142], weight: 100 }
      - stageInRound: 7
        patterns:
          - { frontIds: [1140, 1141], rearIds: [1142, 1108], weight: 100 }
      # 8슬롯 — 중간 보스.
      - stageInRound: 8
        patterns:
          - { frontIds: [1140], rearIds: [2071, 1142], weight: 100 }
      - stageInRound: 9
        patterns:
          - { frontIds: [1140, 1141, 1141], rearIds: [1142], weight: 100 }
      - stageInRound: 10
        patterns:
          - { frontIds: [3080], weight: 100 }

  # ── 오디세이 I ────────────────────────────────────────────────────
  # 공허가 삼킨 바다를 건넌다. 이 테마가 가르치는 것은 <b>원소가 붙은 판</b>이다.
  #   1~2  공허의 정찰병 — 특징이 없는 대신 처치되면 제 진영을 함께 태운다. 몰아 잡으면 손해다.
  #   3~5  공허의 사냥꾼(불)이 전열을 맡고, 그 뒤에서 학살자·세이렌이 불어난다.
  #        세이렌은 노래할수록 세진다 — 빠르게 끊거나 행동 제어로 중첩을 지워야 한다.
  #   6    사건 — 이타케로 돌아가려는 자의 이야기.
  #   7    케토스(풀) + 정찰병(번개) — 활성 약화가 처음으로 아군을 갉는다.
  #   8    히포캅투스가 전열을 통째로 막고 그 뒤에서 세이렌이 노래한다. 도발을 뚫을 수단이 필요하다.
  #   9    심연의 공포 — 해안 전선에서 이미 만나 본 엘리트다.
  #   10   스킬라 — 체력 세 칸. 칸이 깨질 때마다 권능이 하나씩 열린다.
  #
  # 공허의 파도가 매 턴 판 전체를 적신다. 1브레이크 이후의 혼돈의 소용돌이는 곧 전체 감전이므로,
  # 물을 씻어낼 수단이 없다면 브레이크 직후의 궁극기를 끊는 것이 유일한 해법이다.
  - id: 21
    name: 오디세이
    tags: [Greek, Void, Sea]
    enemyThemeId: 22
    description: "공허가 삼킨 바다. 파도는 쉬지 않고 판을 적시고, 그 위로 번개가 떨어진다."
    midBossId: 2071
    midBossStageInRound: 9
    bossId: 3090
    ambientColor: "#0F2A2E"   # 오디세이 — 빛이 닿지 않는 심해의 청록
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { frontIds: [1143], rearIds: [1143, 1143], weight: 100 }
      - stageInRound: 2
        patterns:
          - { frontIds: [1143, 1143], rearIds: [1143, 1143, 1143], weight: 100 }
      # 3슬롯부터 공허의 사냥꾼이 앞을 맡는다. 뒤에 무엇이 서느냐로 반응이 갈린다.
      - stageInRound: 3
        patterns:
          - { frontIds: [1142, 1142], rearIds: [1143, 1143, 1143], weight: 100 }
      # 불(사냥꾼) + 번개(학살자) = 과부하. 뭉쳐 서면 아군이 통째로 밀려난다.
      - stageInRound: 4
        patterns:
          - { frontIds: [1142, 1142], rearIds: [1144, 1144, 1144], weight: 100 }
      # 불(사냥꾼) + 물(세이렌) = 증발. 노래가 쌓이기 전에 후열을 끊어야 한다.
      - stageInRound: 5
        patterns:
          - { frontIds: [1142, 1142], rearIds: [1145, 1145, 1145], weight: 100 }
      # 풀(케토스) + 번개(정찰병) = 활성. 케토스의 생명의 메아리가 그 약화를 그대로 되먹는다.
      - stageInRound: 7
        patterns:
          - { frontIds: [1143, 1143, 1143], rearIds: [1147, 1147], weight: 100 }
      # 히포캅투스가 도발로 전열을 통째로 붙잡고, 그 뒤에서 세이렌이 안전하게 노래한다.
      - stageInRound: 8
        patterns:
          - { frontIds: [1146, 1146, 1146], rearIds: [1145, 1145], weight: 100 }
      # 9슬롯 — 중간 보스.
      - stageInRound: 9
        patterns:
          - { frontIds: [1146], rearIds: [2071, 1145], weight: 100 }
      - stageInRound: 10
        patterns:
          - { frontIds: [3090], weight: 100 }

events:
  - id: odyssey_the_long_way_home
    themeId: 21
    stageInRound: 6
    oncePerRun: true
    title: 돌아가지 못한 배
    dialogue:
      - speaker: 일행
        text: 부서진 뱃머리가 모래에 반쯤 묻혀 있다. 삭은 밧줄에 아직 사람 손자국이 남아 있는 것을 보면, 버려진 지 오래된 배는 아니다.
      - speaker: 일행
        text: 뱃전에 칼끝으로 긁은 글자가 줄줄이 새겨져 있다. 날짜다. 스무 해치가 넘는다. 마지막 줄만 숫자가 없고, 대신 한 문장이 있다.
      - speaker: 일행
        text: "「집이 어디였는지 잊기 전에 돌아간다.」"
      - speaker: 일행
        text: 파도가 밀려와 글자 절반을 지우고 물러난다. 바닷물이 닿은 자리에서 희미하게 푸른 빛이 번진다. 공허다.
    choices:
      - id: odyssey_carve_the_date
        text: 빈 자리에 오늘 날짜를 새겨 넣는다.
        action: continue
        successText: 칼끝이 삭은 나무를 파고든다. 누군가 이 배를 다시 찾는다면, 적어도 여기서 끝나지 않았다는 것은 알 것이다.
      - id: odyssey_push_the_hull
        text: 뱃머리를 파도 쪽으로 밀어 준다.
        action: continue
        successText: 배는 몇 번 흔들리다 물살에 실려 나간다. 돌아갈 곳을 찾지 못하더라도, 모래에 묻혀 있는 것보다는 낫다.

  - id: legion_crossing_the_rubicon
    themeId: 5
    stageInRound: 5
    oncePerRun: true
    title: 강가의 야영지
    dialogue:
      - speaker: 일행
        text: 강 건너편에 군단의 야영지가 늘어서 있다. 보초는 이쪽을 보고도 창을 내리지 않는다. 싸울 상대로 세지 않았다는 뜻이다.
      - speaker: 백인대장
        text: 여기서부터는 군단의 관할이다. 지나가려면 이름을 대라.
        portrait: MARCELLUS_PORTRAIT
        standing: MARCELLUS_STANDING
      - speaker: 일행
        text: 천막 사이로 지휘관 하나가 걸어 나온다. 갑옷은 병사들과 다를 바 없는데, 지나가는 병사마다 하던 일을 멈추고 고개를 숙인다.
      - speaker: 카이사르
        text: 이름은 됐다. 강을 건널 셈이면 건너라. 어차피 한 번 건넌 다리는 되돌아갈 수 없으니, 서로 각오만 확인해 두자고.
        portrait: CAESAR_PORTRAIT
        standing: CAESAR_STANDING
    choices:
      - id: legion_accept_challenge
        text: 결승에서 보자고 답한다.
        action: continue
        successText: 카이사르는 짧게 웃고 돌아섰다. 야영지의 병사들이 길을 터 준다.
      - id: legion_observe_camp
        text: 대답 없이 야영지의 진형을 눈에 담는다.
        action: continue
        successText: 전열과 후열이 칼같이 나뉘어 있다. 어느 자리에 누가 서는지 미리 알아 둔 것만으로도 소득이다.

  - id: mexica_smoking_mirror
    themeId: 6
    stageInRound: 5
    oncePerRun: true
    title: 연기 나는 거울
    dialogue:
      - speaker: 일행
        text: 흑요석 거울 위로 검은 연기가 피어오른다. 재규어의 울음과 독수리의 날갯짓이 한 박자 늦게 메아리친다.
      - speaker: 테스카틀리포카
        text: 전열은 제물이고 후열은 증인이다. 너희는 어느 쪽에 설 테냐.
        portrait: AZTEC_TEZCATLIPOCA_PORTRAIT
        standing: AZTEC_TEZCATLIPOCA_STANDING
    choices:
      - id: mexica_face_the_mirror
        text: 거울을 똑바로 바라본다.
        action: continue
        successText: 연기가 걷히며 다음 전장으로 이어지는 검은 길이 열린다.
      - id: mexica_break_the_ritual
        text: 의식의 북을 끊는다.
        action: continue
        successText: 북소리는 멎었지만 전사들의 발걸음은 더 빨라졌다.

  - id: aswan_the_first_seal
    themeId: 7
    stageInRound: 5
    oncePerRun: true
    title: 첫 번째 봉인
    dialogue:
      - speaker: 일행
        text: 강 상류의 채석장이 통째로 불에 그을려 있다. 무너진 신전 기둥마다 같은 문장이 새로 새겨져 있다 — 종말을 선포하는 사도들의 것이다.
      - speaker: 호루스
        text: 여기서부터는 아버지의 땅이다. 사도들이 불을 놓았고, 그 재 밑에서 무언가가 걸어 나오고 있다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
      - speaker: 일행
        text: 그가 활을 내리지 않은 채 강 건너편을 가리킨다. 모래 위로 발자국이 이어지는데, 발자국을 남긴 것들의 그림자가 보이지 않는다.
      - speaker: 호루스
        text: 사령은 죽여도 한 번은 다시 일어선다. 두 번 죽일 각오가 없다면 강을 건너지 마라.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
    choices:
      - id: aswan_ask_about_osiris
        text: 재 밑에서 걸어 나온 것이 무엇인지 묻는다.
        action: continue
        successText: 호루스는 대답 대신 상류를 오래 바라보았다. 그 이름을 입에 올리지 않는 것만으로도 답이 되었다.
      - id: aswan_burn_the_seal
        text: 기둥에 새겨진 문장을 지운다.
        action: continue
        successText: 문장은 지워졌지만 그을음은 남았다. 사도들은 곧 같은 자리에 다시 새길 것이다.

  # 아문·라 최초 격파 직후 한 번만 동적 큐에 들어가는 합류 대화.
  - id: aswan_bastet_first_amun_ra_clear
    themeId: 0
    stageInRound: 0
    triggerBossId: 3012
    title: 모래 위의 고양이 발자국
    dialogue:
      - speaker: 일행
        text: 아문·라의 빛이 꺼진 자리에서 가벼운 발소리가 들린다. 무너진 기둥 위에 앉아 있던 여인이 천천히 내려온다.
      - speaker: 바스테트
        text: 태양이 너무 오래 하늘을 독차지했어. 쓰러뜨린 솜씨는 마음에 드는데, 다음 사냥터도 이만큼 재미있을까?
        portrait: BASTET_PORTRAIT
        standing: BASTET_STANDING
      - speaker: 바스테트
        text: 자리가 남는다면 같이 가지. 발소리는 죽이고, 적의 목숨만 깨워 줄게.
        portrait: BASTET_PORTRAIT
        standing: BASTET_STANDING
    choices:
      - id: recruit_bastet_after_amun_ra
        text: 바스테트를 동료로 맞이한다.
        action: continue
        grantUnitId: 122
        successText: 바스테트가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_bastet_after_amun_ra
        text: 이번에는 각자의 길을 간다.
        action: continue
        successText: 바스테트는 아쉬운 듯 웃더니 모래바람 속으로 사라졌다. 이후 런부터 메인 캐릭터로 선택할 수 있다.

  # 아문·라 격파 이후 모든 테마의 사건 슬롯에서 출현 가능한 별개의 T4 영입 사건.
  - id: t4_horus_falcon_without_throne
    themeId: 0
    stageInRound: 5
    tier: 4
    requiresBossDefeatId: 3012
    oncePerRun: true
    title: 왕좌 없는 매
    dialogue:
      - speaker: 일행
        text: 길목의 폐허 위로 매 한 마리가 원을 그린다. 그림자가 세 번째로 겹친 순간, 활을 든 전사가 돌기둥 뒤에서 모습을 드러낸다.
      - speaker: 호루스
        text: 아문·라는 쓰러졌지만 하늘의 질서는 돌아오지 않았다. 왕좌를 되찾기 전에, 그 빈자리를 노리는 것부터 막아야 한다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
      - speaker: 호루스
        text: 너희의 길이 종말을 거슬러 간다면 내 화살도 같은 곳을 향할 것이다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
    choices:
      - id: recruit_horus_after_amun_ra
        text: 호루스에게 함께 싸우자고 청한다.
        action: continue
        grantUnitId: 120
        successText: 호루스가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_horus_after_amun_ra
        text: 아직은 각자의 전장을 지킨다.
        action: continue
        successText: 호루스는 매의 울음과 함께 하늘 너머로 사라졌다. 이후 런부터 메인 캐릭터로 선택할 수 있다.

  - id: t4_set_red_desert_compact
    themeId: 0
    stageInRound: 5
    tier: 4
    requiresBossDefeatId: 3012
    oncePerRun: true
    title: 붉은 사막의 맹약
    dialogue:
      - speaker: 일행
        text: 바람이 멎자 붉은 모래가 벽처럼 솟는다. 모래 장막 한가운데서 거대한 검을 멘 전사가 웃음을 터뜨린다.
      - speaker: 세트
        text: 태양의 왕을 꺾었다고 질서까지 네 편이 된 건 아니다. 사막은 늘 가장 강한 자의 발자국만 남기지.
        portrait: SET_PORTRAIT
        standing: SET_STANDING
      - speaker: 세트
        text: 네가 더 큰 혼돈을 찾아간다면 내가 앞장서 주마. 대신 지루하게 만들지는 마라.
        portrait: SET_PORTRAIT
        standing: SET_STANDING
    choices:
      - id: recruit_set_after_amun_ra
        text: 세트와 맹약을 맺는다.
        action: continue
        grantUnitId: 123
        successText: 세트가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_set_after_amun_ra
        text: 혼돈과 손잡지 않는다.
        action: continue
        successText: 세트는 다음 선택은 달라질 거라며 붉은 모래 속으로 돌아갔다. 이후 런부터 메인 캐릭터로 선택할 수 있다.

# 고정 보스는 현재 없다.
# 25/50/75/100 지점의 고정 보스는 아직 설계되지 않았다.
# 🔸 '고정 보스 라운드에서는 2번 스테이지를 건너뛰고 이후 스테이지를 1씩 당긴다'는
#    규칙이 기획에 있으나 아직 구현하지 않았다. 현재 엔진은 그 대신
#    보스 슬롯을 10 → 9로 당기는 기존 방식을 쓴다. Design_Backlog 항목 13을 볼 것.

  - id: nord_the_raiders_fire
    themeId: 16
    stageInRound: 5
    oncePerRun: true
    title: 꺼지지 않는 불
    dialogue:
      - speaker: 일행
        text: 눈밭 한가운데 모닥불이 타고 있다. 주인은 보이지 않는데 불은 조금도 사그라들지 않는다. 둘레의 눈만 녹지 않고 그대로다.
      - speaker: 볼바
        text: 손을 쬐고 가라. 우리는 저 불로 얼음을 녹이지 않는다. 얼음 위에 얹을 뿐이지.
        portrait: VOLVA_PORTRAIT
        standing: VOLVA_STANDING
      - speaker: 일행
        text: 노파는 지팡이로 불을 한 번 휘젓고, 튄 불똥이 눈에 닿자 그 자리가 하얗게 터진다. 광전사들이 왜 그렇게 달려드는지 이제야 알겠다.
    choices:
      - id: nord_warm_hands
        text: 불을 쬐고 간다.
        action: continue
        successText: 언 손이 풀렸다. 다음 싸움의 첫 수가 한 박자 빨라질 것 같다.
      - id: nord_douse_the_fire
        text: 불을 눈으로 덮어 끈다.
        action: continue
        successText: 불은 꺼졌지만 노파는 웃기만 했다. 얼음 위에 불을 얹는 수는 그들이 먼저 배운 것이다.

  # triggerBossId가 방아쇠다 — 토르(3060)를 넘어선 직후 추첨 없이 예약된다.
  # 슬롯 추첨을 타지 않으므로 themeId/stageInRound는 0이다.
  #
  # 거절해도 로키는 해금된다. 사건을 끝까지 본 것만으로 다음 런부터 골라 쓸 수 있으므로,
  # '정중하게 거절한다'는 이번 런에 데려가지 않겠다는 뜻일 뿐 함정이 아니다.
  - id: nord_loki_after_thor
    themeId: 0
    stageInRound: 0
    triggerBossId: 3060
    title: 형의 뒤에 서 있던 자
    dialogue:
      - speaker: 일행
        text: 천둥이 그친 자리에 눈이 도로 내려앉는다. 쓰러진 토르 너머, 아까까지 아무도 없던 바위 위에 한 사람이 앉아 있다.
      - speaker: 로키
        text: 형이 넘어지는 건 처음 봤어. 그것도 이런 애들한테. 재미있네.
        portrait: LOKI_PORTRAIT
        standing: LOKI_STANDING
      - speaker: 로키
        text: 나는 저쪽 편도, 이쪽 편도 아니었어. 그냥 끝이 어떻게 오는지 보고 싶었을 뿐이야.
        portrait: LOKI_PORTRAIT
        standing: LOKI_STANDING
      - speaker: 로키
        text: 그런데 너희를 보니, 구경만 하기엔 아까운 길인 것 같거든. 나도 끼워 줄래?
        portrait: LOKI_PORTRAIT
        standing: LOKI_STANDING
    choices:
      - id: welcome_loki_after_thor
        text: 합류를 환영한다.
        action: continue
        grantUnitId: 82
        rosterFullText: 자리가 없다. 로키를 영입하기 위해서는 누군가가 떠나야 할 것 같다.
        successText: 로키가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
        failureText: 결국 자리를 비우지 못했다. 로키는 어깨를 으쓱하고 눈보라 속으로 사라졌다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_loki_after_thor
        text: 정중하게 거절한다.
        action: continue
        successText: 로키는 기분 나빠 하지도 않았다. "그럼 다음에 보자"는 말만 남기고 눈 위의 발자국까지 지우고 갔다. 이후 런부터 메인 캐릭터로 선택할 수 있다.

  - id: nord_north_the_white_silence
    themeId: 17
    stageInRound: 5
    oncePerRun: true
    title: 그치지 않는 눈
    dialogue:
      - speaker: 일행
        text: 사흘째 눈이 그치지 않는다. 발밑에서 무언가 규칙적으로 울린다. 눈을 걷어 내자 금속 껍질이 드러난다.
      - speaker: 일행
        text: 씨앗이다. 아직 깨어나지 않았고, 껍질 안쪽에서 천천히 빛이 돈다. 건드리면 깨어날 것이고 깨어나면 터질 것이다.
      - speaker: 일행
        text: 북쪽으로 갈수록 눈이 두꺼워진다. 이 추위는 하늘이 아니라 땅에서 올라오고 있다.
    choices:
      - id: nord_north_leave_the_seed
        text: 덮어 두고 돌아간다.
        action: continue
        successText: 눈을 다시 덮었다. 깨우지 않는 것도 한 가지 답이다.
      - id: nord_north_break_the_shell
        text: 껍질을 깨 본다.
        action: continue
        successText: 껍질 안은 비어 있었다. 대신 안쪽 벽에 서리가 낀 무늬가 있다 — 터질 때 무엇이 퍼지는지 미리 본 셈이다.

  # 씨앗 사건 — 테마를 가리지 않는다(themeId 0). 한 런에 한 번만 뜬다.
  #
  # tier가 붙은 범용 사건이라 그 스테이지의 테마 사건보다 먼저 잡힌다. 1로 둔 것은
  # 영입 사건(T4)이 뜰 자리를 빼앗지 않기 위해서다.
  #
  # 덮어 두는 쪽은 아무것도 주지 않는다. "안전하게 넘어갔다"가 곧 보상이며,
  # 되돌아올 수 없다. 깨는 쪽은 강화된 씨앗(종말의 씨앗)과 싸우고 귀중품을 얻는다.
  - id: seed_beneath_the_ground
    themeId: 0
    stageInRound: 5
    tier: 1
    oncePerRun: true
    title: 땅속의 것
    dialogue:
      - speaker: 일행
        text: 발밑에서 규칙적인 진동이 올라온다. 흙을 걷어내자 금속 껍질이 드러난다. 이음매마다 서리가 껴 있고, 안쪽에서 무언가 천천히 빛이 돈다.
      - speaker: 일행
        text: 아직 깨어나지 않았다. 건드리면 깨어날 것이고, 깨어나면 터질 것이다. 그리고 이런 껍질 안에는 대개 값나가는 것이 함께 봉인되어 있다.
      - speaker: 일행
        text: 진동이 조금 빨라진다. 오래 볼 수 있는 물건은 아니다.
    choices:
      - id: seed_leave_it_buried
        text: 덮어 두고 간다.
        action: continue
        successText: 흙을 다시 덮었다. 몇 걸음 걷자 진동은 들리지 않았다. 무엇이 들어 있었는지는 끝내 알 수 없다.
      - id: seed_crack_the_shell
        text: 껍질을 깬다.
        action: continue
        battleEnemyId: 2032
        successText: 껍질이 갈라지며 씨앗이 일어섰다. 쓰러뜨리고 나니 이음매 안쪽에 봉인된 병이 하나 남아 있다.
        failureText: 씨앗은 터지지 않았고, 우리가 물러섰다. 땅속의 것은 그대로 남았다.
        grantItemId: 4903

  - id: nord_central_the_kings_road
    themeId: 18
    stageInRound: 5
    oncePerRun: true
    title: 왕의 길
    dialogue:
      - speaker: 일행
        text: 길 양쪽에 창이 꽂혀 있다. 창마다 노르드의 문장이 걸려 있는데, 자루를 감은 천 아래로 익숙한 보랏빛이 배어 나온다.
      - speaker: 일행
        text: 공허다. 이 땅의 병사들이 쓰는 무기에 이미 섞여 있었다. 누가 들여왔는지는 길 끝에 있을 것이다.
      - speaker: 일행
        text: 앞쪽에서 두 사람이 길을 막고 서 있다. 창을 내리지 않은 것을 보면 여기서부터는 통행이 아니라 시험이다.
    choices:
      - id: nord_central_read_the_banner
        text: 문장을 확인하고 간다.
        action: continue
        successText: 왕의 문장이 맞다. 다만 아래에 덧대인 무늬는 노르드의 것이 아니었다.
      - id: nord_central_press_on
        text: 그냥 지나간다.
        action: continue
        successText: 창을 지나쳤다. 등 뒤에서 천이 바람에 들리는 소리가 오래 따라왔다.

  # 합류 사건 — 6슬롯의 시구르드·브륀힐드를 이기면 예약된다.
  # 둘 중 하나만 데려가도 <b>양쪽 모두</b> 영구 해금된다. 만났다는 사실이 해금 조건이다.
  - id: nord_central_oathbound_pair
    themeId: 0
    triggerBossId: 2051
    oncePerRun: true
    title: 맹세한 자들
    dialogue:
      - speaker: 일행
        text: 두 사람은 무기를 내려놓지 않았다. 다만 겨누지도 않는다. 창끝이 우리를 지나 길 끝을 향해 있다.
      - speaker: 브륀힐드
        text: 우리는 저 사람을 막으라고 세워진 것이 아니라, 저 사람에게 세워진 거다. 그 차이를 이제야 알았다.
        portrait: BRYNHILD_PORTRAIT
        standing: BRYNHILD_STANDING
      - speaker: 시구르드
        text: 맹세는 아직 유효하다. 다만 대상이 바뀌었을 뿐이지. 한 사람은 남아 길을 지켜야 하니, 데려갈 쪽을 골라라.
        portrait: SIGURD_PORTRAIT
        standing: SIGURD_STANDING
    choices:
      - id: nord_central_take_sigurd
        text: 시구르드를 데려간다.
        action: continue
        grantUnitId: 84
        successText: 시구르드가 그람을 들고 뒤를 따랐다. 브륀힐드는 길에 남아 창을 세웠다.
      - id: nord_central_take_brynhild
        text: 브륀힐드를 데려간다.
        action: continue
        grantUnitId: 85
        successText: 브륀힐드가 창을 고쳐 쥐고 앞장섰다. 시구르드는 길에 남아 검을 세웠다.
      - id: nord_central_take_neither
        text: 둘 다 두고 간다.
        action: continue
        successText: 두 사람은 길을 비켜 주었다. 다음에 만날 때는 같은 편일 것이다.

  # 케찰코아틀 합류 — 메히코 9슬롯(중간 보스)을 이기면 예약된다.
  #
  # 10슬롯의 테스카틀리포카가 이 테마의 최종 보스이고 둘은 형제다.
  # 깃털 뱀은 제 뜻으로 길을 막은 것이 아니라 거울에 비친 명령을 따르고 있었다 —
  # 그 명령이 끊기는 자리가 곧 합류 분기다.
  - id: mexica_quetzalcoatl_after_duel
    themeId: 0
    triggerBossId: 3201
    oncePerRun: true
    title: 거울에서 풀려난 깃털
    dialogue:
      - speaker: 일행
        text: 깃털 뱀이 무너지자 몸을 감고 있던 검은 실이 한 올씩 풀린다. 흑요석 거울의 무늬였다.
      - speaker: 케찰코아틀
        text: 고맙다고 해야 하나. 저 거울에 비친 명령을 듣고 있었을 뿐, 너희를 막고 싶었던 적은 없었다.
        portrait: QUETZALCOATL_PORTRAIT
        standing: QUETZALCOATL_STANDING
      - speaker: 케찰코아틀
        text: 형은 아직 위에 있다. 내가 못 끊은 것을 너희가 끊었으니, 이번엔 내가 따라가 볼 차례겠지.
        portrait: QUETZALCOATL_PORTRAIT
        standing: QUETZALCOATL_STANDING
    choices:
      - id: welcome_quetzalcoatl
        text: 함께 올라가자고 답한다.
        action: continue
        grantUnitId: 140
        rosterFullText: 자리가 없다. 케찰코아틀을 영입하려면 누군가가 떠나야 할 것 같다.
        successText: 케찰코아틀이 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
        failureText: 자리를 비우지 못했다. 깃털 뱀은 고개를 끄덕이고 먼저 계단을 올랐다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: decline_quetzalcoatl
        text: 여기서 쉬라고 말한다.
        action: continue
        successText: 깃털 뱀은 풀린 실을 손에 쥔 채 남았다. "위에서 보자"고만 했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.

  # ── 천공 전선 — 츠쿠요미 합류 체인 ────────────────────────────────
  # 슬롯 추첨을 타지 않는다. 방아쇠는 테마 19의 내용 슬롯 승리다(triggerThemeId + triggerStageInRound).
  #
  # A  1슬롯 승리 — 합류. 츠쿠요미가 일행에 없을 때(해금 여부와 무관하게 다시 제안한다).
  # A' 1슬롯 승리 — 이미 동행 중일 때의 대사만. 중복 영입·추가 보상은 없다.
  # B  6슬롯 승리 — 고치의 연결과 나비의 인분을 예고한다.
  # C  9슬롯 승리 — 익룡이 떨구는 두 결정을 예고한다.
  # D  10슬롯 승리 — 방어선 확보. 기본 보스 보상 외에 주는 것은 없다.
  #
  # 거절해도 츠쿠요미는 해금된다. 만났다는 사실이 해금 조건이다.
  - id: japan_sky_moonlit_reinforcement
    themeId: 0
    stageInRound: 0
    triggerThemeId: 19
    triggerStageInRound: 1
    allowUnlockedRecruit: true
    oncePerRun: true
    title: 달빛 아래의 증원
    dialogue:
      - speaker: 일행
        text: 떨어진 괴조의 깃이 땅에 닿기도 전에 푸른 빛에 삭아 사라진다. 올려다보니 갈라진 하늘 가장자리에 누군가 서 있다.
      - speaker: 츠쿠요미
        text: …처음 내려온 무리치고는 잘 막았다. 하지만 저건 선발대다.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
      - speaker: 츠쿠요미
        text: 이 뒤로 오는 것들은 한 번 베어서는 쓰러지지 않는다. 결정을 두르고, 서로를 꿰매고, 쓰러지면서 불을 뿌린다.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
      - speaker: 츠쿠요미
        text: 상처를 남겨 둬라. 달빛이 닿는 곳이라면 누구의 칼이든 더 깊이 들어가게 해 주지.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
    choices:
      - id: japan_sky_hold_the_line_together
        text: 함께 전선을 지킨다.
        action: continue
        grantUnitId: 41
        rosterFullText: 자리가 없다. 츠쿠요미를 맞이하려면 누군가가 떠나야 할 것 같다.
        successText: 츠쿠요미가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
        failureText: 자리를 비우지 못했다. 츠쿠요미는 말없이 하늘로 돌아갔다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: japan_sky_move_separately
        text: 이번에는 따로 움직인다.
        action: continue
        successText: 츠쿠요미는 고개만 한 번 끄덕였다. "그럼 초소에서 보겠다." 이후 런부터 메인 캐릭터로 선택할 수 있다.

  - id: japan_sky_moonlit_reinforcement_companion
    themeId: 0
    stageInRound: 0
    triggerThemeId: 19
    triggerStageInRound: 1
    requiresUnitInParty: 41
    oncePerRun: true
    title: 달빛 아래의 전선
    dialogue:
      - speaker: 일행
        text: 떨어진 괴조의 깃이 땅에 닿기도 전에 푸른 빛에 삭아 사라진다. 츠쿠요미가 갈라진 하늘을 오래 올려다본다.
      - speaker: 츠쿠요미
        text: 내 전선이다. 선발대가 이 정도면 뒤는 한 번 베어서 쓰러지지 않는 것들이 온다.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
      - speaker: 츠쿠요미
        text: 상처를 남겨 둬라. 그 위에 달빛을 얹는 건 내 몫이다.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
    choices:
      - id: japan_sky_companion_onward
        text: 고개를 끄덕이고 앞으로 나아간다.
        action: continue
        successText: 달빛이 한층 짙어졌다. 다음 무리가 내려오기 전에 자리를 잡는다.

  - id: japan_sky_sever_the_connection
    themeId: 0
    stageInRound: 0
    triggerThemeId: 19
    triggerStageInRound: 6
    requiresRunEventIds: [japan_sky_moonlit_reinforcement, japan_sky_moonlit_reinforcement_companion]
    oncePerRun: true
    title: 꿰매는 고치
    dialogue:
      - speaker: 일행
        text: 쓰러진 포식자 곁에 매달려 있던 고치가 금이 간 채 흔들린다. 안쪽에서 끊어진 실 한 가닥이 아직 빛을 낸다.
      - speaker: 츠쿠요미
        text: 저 실이 포식자를 꿰매고 있었다. 무적을 다 벗겨도 고치가 살아 있는 한 상처는 다시 닫힌다.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
      - speaker: 츠쿠요미
        text: 다음은 붉은 나비가 섞인다. 쓰러질 때 인분이 제 편을 태운다. 먼저 깰지 나중에 깰지는 네가 정해라.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
    choices:
      - id: japan_sky_noted_the_thread
        text: 실과 인분을 기억해 둔다.
        action: continue
        successText: 끊어진 실은 곧 빛을 잃었다.

  - id: japan_sky_falling_scales
    themeId: 0
    stageInRound: 0
    triggerThemeId: 19
    triggerStageInRound: 9
    requiresRunEventIds: [japan_sky_moonlit_reinforcement, japan_sky_moonlit_reinforcement_companion]
    oncePerRun: true
    title: 떨어지는 결정
    dialogue:
      - speaker: 일행
        text: 하늘 높은 곳에서 무언가가 떨어져 바위에 박힌다. 하나는 맥동하는 붉은 결정이고, 하나는 바람을 머금어 부푼 비늘이다.
      - speaker: 츠쿠요미
        text: 익룡이 떨군 것이다. 저 위에서 싸우는 내내 계속 떨굴 거다.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
      - speaker: 츠쿠요미
        text: 붉은 것은 삼키고, 부푼 것은 터진다. 둘 다 몇 번이고 막아 내지만 몸은 얇다. 셋을 세기 전에 깨라.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
    choices:
      - id: japan_sky_ready_for_the_wyvern
        text: 결정을 깨뜨리고 올라간다.
        action: continue
        successText: 부서진 비늘에서 새어 나온 바람이 한참을 울었다.

  - id: japan_sky_frontline_secured
    themeId: 0
    stageInRound: 0
    triggerThemeId: 19
    triggerStageInRound: 10
    requiresRunEventIds: [japan_sky_moonlit_reinforcement, japan_sky_moonlit_reinforcement_companion]
    oncePerRun: true
    title: 되찾은 밤하늘
    dialogue:
      - speaker: 일행
        text: 익룡이 떨어진 자리에서 결정 조각들이 한꺼번에 빛을 잃는다. 갈라졌던 하늘이 천천히 닫힌다.
      - speaker: 츠쿠요미
        text: 방어선은 지켰다. 오늘 밤은 달이 온전히 뜨겠군.
        portrait: TSUKUYOMI_PORTRAIT
        standing: TSUKUYOMI_STANDING
    choices:
      - id: japan_sky_look_at_the_moon
        text: 닫힌 하늘을 올려다본다.
        action: continue
        successText: 구름 사이로 둥근 달이 떠올랐다.

  # ── 해안 전선 — 세이메이 합류 · 예고 · 스사노오 합류 ─────────────────
  # 슬롯 추첨을 타지 않는다. 1슬롯 승리 뒤 세이메이, 2·8슬롯 승리 뒤 예고, 집정관 격파 뒤 스사노오.
  # 거절해도 해금된다. 만났다는 사실이 해금 조건이다.
  #
  # 세이메이는 테마의 안전장치다. 제어가 없는 파티도 관통으로 갑주를 넘기게, 해금 뒤에도 이번 런에 없으면 다시 제안한다.
  - id: japan_coast_seimei_on_the_shore
    themeId: 0
    stageInRound: 0
    triggerThemeId: 20
    triggerStageInRound: 1
    allowUnlockedRecruit: true
    oncePerRun: true
    title: 물가의 음양사
    dialogue:
      - speaker: 일행
        text: 쓰러진 공허의 기사 곁 모래 위에 종이 부적 몇 장이 꽂혀 있다. 밀려온 파도가 부적 앞에서만 둘로 갈라진다.
      - speaker: 세이메이
        text: 결계가 버텨 준 덕에 한숨 돌렸군요. 저것들은 선발대입니다. 뒤따라오는 것들은 갑주를 두르고 올라옵니다.
        portrait: SEIMEI_PORTRAIT
        standing: SEIMEI_STANDING
      - speaker: 세이메이
        text: 갑주는 멈춰 세우면 벗겨지지만, 매번 멈출 수는 없겠지요. 그럴 때는 제가 틈을 엽니다. 제가 서 있는 동안은 여러분의 칼끝이 껍질을 지나갈 겁니다.
        portrait: SEIMEI_PORTRAIT
        standing: SEIMEI_STANDING
    choices:
      - id: japan_coast_walk_with_seimei
        text: 함께 해안을 지킨다.
        action: continue
        grantUnitId: 43
        rosterFullText: 자리가 없다. 세이메이를 맞이하려면 누군가가 떠나야 할 것 같다.
        successText: 세이메이가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
        failureText: 자리를 비우지 못했다. 세이메이는 부적 한 장을 남기고 안개 속으로 물러났다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: japan_coast_part_with_seimei
        text: 이번에는 따로 움직인다.
        action: continue
        successText: 세이메이는 부채로 입가를 가리고 웃었다. "그럼 결계 너머에서 뵙지요." 이후 런부터 메인 캐릭터로 선택할 수 있다.

  - id: japan_coast_seimei_companion
    themeId: 0
    stageInRound: 0
    triggerThemeId: 20
    triggerStageInRound: 1
    requiresUnitInParty: 43
    oncePerRun: true
    title: 물가의 결계
    dialogue:
      - speaker: 일행
        text: 세이메이가 모래 위에 부적을 꽂자 밀려오던 파도가 둘로 갈라진다.
      - speaker: 세이메이
        text: 뒤따라오는 것들은 갑주를 두르고 올라옵니다. 제가 서 있는 동안은 여러분의 칼끝이 껍질을 지나갈 겁니다.
        portrait: SEIMEI_PORTRAIT
        standing: SEIMEI_STANDING
    choices:
      - id: japan_coast_seimei_companion_onward
        text: 결계를 뒤로하고 나아간다.
        action: continue
        successText: 갈라진 파도가 천천히 다시 닫혔다.

  - id: japan_coast_cracked_shells
    themeId: 0
    stageInRound: 0
    triggerThemeId: 20
    triggerStageInRound: 2
    oncePerRun: true
    title: 금이 간 껍질
    dialogue:
      - speaker: 일행
        text: 물러난 파도가 부서진 껍질 조각들을 모래 위에 남긴다. 결정처럼 반짝이는 갑각 한쪽에만 서리가 앉아 있고, 그 자리가 거미줄처럼 갈라져 있다.
      - speaker: 일행
        text: 방금 전 우리 편이 얼어붙었을 때는 한 발짝도 움직일 수 없었다. 저 껍질의 주인들도 마찬가지였던 모양이다. 멈춰 선 순간 갑주가 제 몸을 지탱하지 못했다.
      - speaker: 일행
        text: 수평선 너머에서 더 큰 껍질들이 올라오고 있다. 때려 부수기 전에, 먼저 멈춰 세워야 한다.
    choices:
      - id: japan_coast_remember_the_frost
        text: 얼음이 갑주를 가른다는 것을 기억해 둔다.
        action: continue
        successText: 서리 앉은 조각은 손끝에서 바스러졌다.

  - id: japan_coast_deep_breath
    themeId: 0
    stageInRound: 0
    triggerThemeId: 20
    triggerStageInRound: 8
    oncePerRun: true
    title: 들이쉬는 바다
    dialogue:
      - speaker: 일행
        text: 촉수가 모래 속으로 가라앉자 바다가 조용해진다. 파도가 밀려오지 않는다. 오히려 먼바다 쪽으로 물이 빨려 나가고 있다.
      - speaker: 일행
        text: 무언가 거대한 것이 숨을 들이쉬고 있다. 저 숨이 다시 나오는 순간 해안 전체가 잠길 것이다.
      - speaker: 일행
        text: 촉수가 폭풍을 모을 때 멈춰 세우자 폭풍은 흩어졌다. 숨을 들이쉬는 동안이라면, 같은 방법이 통할지도 모른다.
    choices:
      - id: japan_coast_hold_the_line
        text: 숨을 끊을 준비를 하고 물가로 나아간다.
        action: continue
        successText: 빠져나간 물이 드러낸 바닥에 거대한 그림자가 떠올랐다.

  - id: japan_coast_susanoo_after_archon
    themeId: 0
    stageInRound: 0
    triggerBossId: 3080
    allowUnlockedRecruit: true
    oncePerRun: true
    title: 폭풍을 몰고 온 자
    dialogue:
      - speaker: 일행
        text: 집정관의 몸이 결정 조각이 되어 흩어지자, 멎어 있던 바다가 한꺼번에 뒤집힌다. 거센 비바람 한가운데로 누군가 파도를 밟고 걸어 나온다.
      - speaker: 스사노오
        text: 하! 저 고래를 뭍에서 쓰러뜨린 게 너희란 말이냐? 내가 바다 밑까지 쫓아가려던 참이었는데.
        portrait: SUSANOO_PORTRAIT
        standing: SUSANOO_STANDING
      - speaker: 스사노오
        text: 멈춰 세우고, 벗기고, 베어 넘겼군. 누님들이 보면 칭찬하겠어. 나는 칭찬 대신 칼을 빌려주지.
        portrait: SUSANOO_PORTRAIT
        standing: SUSANOO_STANDING
      - speaker: 스사노오
        text: 파도가 또 올라온다면 내가 먼저 띄워 주마. 떨어지는 놈을 베는 건 내 특기거든.
        portrait: SUSANOO_PORTRAIT
        standing: SUSANOO_STANDING
    choices:
      - id: japan_coast_welcome_susanoo
        text: 함께 폭풍을 건넌다.
        action: continue
        grantUnitId: 42
        rosterFullText: 자리가 없다. 스사노오를 맞이하려면 누군가가 떠나야 할 것 같다.
        successText: 스사노오가 아군에 합류했다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
        failureText: 자리를 비우지 못했다. 스사노오는 호탕하게 웃으며 파도 너머로 사라졌다. 이후 런부터 메인 캐릭터로 선택할 수 있다.
      - id: japan_coast_part_with_susanoo
        text: 이번에는 각자의 길을 간다.
        action: continue
        successText: 스사노오는 어깨를 한 번 으쓱하고 폭풍 속으로 걸어 들어갔다. 이후 런부터 메인 캐릭터로 선택할 수 있다.

  - id: japan_coast_susanoo_companion
    themeId: 0
    stageInRound: 0
    triggerBossId: 3080
    requiresUnitInParty: 42
    oncePerRun: true
    title: 잠잠해진 바다
    dialogue:
      - speaker: 일행
        text: 집정관의 몸이 결정 조각이 되어 흩어진다. 스사노오가 칼끝으로 조각 하나를 튕겨 올리더니 바다로 던진다.
      - speaker: 스사노오
        text: 바다 밑에서 올라온 건 바다로 돌려보내야지. 오늘 파도는 이걸로 끝이다.
        portrait: SUSANOO_PORTRAIT
        standing: SUSANOO_STANDING
    choices:
      - id: japan_coast_companion_onward
        text: 잠잠해진 해안을 뒤로하고 떠난다.
        action: continue
        successText: 비바람이 걷히고 수평선이 다시 반듯해졌다.

