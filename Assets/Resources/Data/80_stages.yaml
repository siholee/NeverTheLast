  # 단독으로 세우면 위협이 되지 않고, 둘을 함께 세우려면 호위가 붙는 패턴이 필요하다.
  # 보스 슬롯(10)도 패턴으로 적어 카이사르에게 호위를 붙였다.
  - id: 5
