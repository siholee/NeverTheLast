  - id: mexica_quetzalcoatl_after_duel
    themeId: 0
    triggerBossId: 13201
    oncePerRun: true
    title: 거울에서 풀려난 깃털
    dialogue:
    - speaker: 일행
      text: 깃털 뱀이 무너지자 몸을 감고 있던 검은 실이 한 올씩 풀린다. 흑요석 거울의 무늬였다.
    - speaker: 케찰코아틀
      text: 고맙다고 해야 하나. 저 거울에 비친 명령을 듣고 있었을 뿐, 너희를 막고 싶었던 적은 없었다.
      portrait: QUETZALCOATL_PORTRAIT
      standing: QUETZALCOATL_STANDING
    - speaker: 케찰코아틀
      text: 형은 아직 위에 있다. 내가 못 끊은 것을 너희가 끊었으니, 이번엔 내가 따라가 볼 차례겠지.
      portrait: QUETZALCOATL_PORTRAIT
      standing: QUETZALCOATL_STANDING
    choices:
    - id: welcome_quetzalcoatl
      text: 이곳의 전선을 맡기고 작별한다.
      action: continue
      successText: 그는 이곳의 전선을 지키기로 했다. 일행은 다음 여정을 향해 떠난다.
    - id: decline_quetzalcoatl
      text: 여기서 쉬라고 말한다.
      action: continue
      successText: 깃털 뱀은 풀린 실을 손에 쥔 채 남았다. "위에서 보자"고만 했다. 이후 런부터 캐릭터로 선택할 수 있다.
