# 테마 / 사건 / 고정 보스 정의
#
# 현재는 콜로세움(로마) 테마 하나만 운영한다.
# 노르드·아즈텍·일본 테마는 전용 적 스프라이트가 없어 제거되었다.
# 해당 테마의 영입 사건(케찰코아틀/츠쿠요미)도 함께 제거되었으나,
# 유닛 데이터와 코드 구현은 10_units.yaml에 그대로 보관되어 있다. 수르트는 Starter로 개방했다.
#
# 테마를 다시 늘릴 때 필요한 것:
#   1. 전용 적 초상화 자산
#   2. 60_enemies.yaml에 해당 themeId의 normal/elite/boss 등록
#   3. 여기 stageThemes에 항목 추가 (enemyThemeId를 적 themeId와 일치시킬 것)
#   4. 필요하면 events에 테마 사건 추가

stageThemes:
  - id: 4
    name: 콜로세움
    tags: [Colosseum, Rome, Festival]
    enemyThemeId: 5
    description: 로마 각지의 인간 검투사와 속주에서 붙잡아 온 괴수가 맞붙는 대축제입니다.
    midBossId: 2005
    bossId: 3003
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { enemyIds: [1020, 1023], weight: 100 }
      - stageInRound: 2
        patterns:
          - { enemyIds: [1021, 1022], weight: 100 }
      - stageInRound: 3
        patterns:
          - { enemyIds: [1023, 1024, 1020], weight: 60 }
          - { enemyIds: [1025, 1021, 1020], weight: 40 }
      - stageInRound: 4
        patterns:
          - { enemyIds: [2004, 1023], weight: 100 }
      - stageInRound: 6
        patterns:
          - { enemyIds: [1020, 1025, 1023, 1024], weight: 50 }
          - { enemyIds: [1021, 1022, 1023, 1024], weight: 50 }
      - stageInRound: 7
        patterns:
          - { enemyIds: [1020, 1021, 1023, 1024, 1025], weight: 100 }
      - stageInRound: 9
        patterns:
          - { enemyIds: [2004, 1022, 1024, 1025], weight: 50 }
          - { enemyIds: [1020, 1021, 1023, 1024, 1025], weight: 50 }

events:
  - id: colosseum_masked_gladiator
    themeId: 4
    stageInRound: 5
    oncePerRun: true
    title: 가면 쓴 검투사
    dialogue:
      - speaker: 일행
        text: 축제의 함성이 경기장 밖까지 울린다. 다음 시합을 기다리는 검투사들 사이에서 유난히 여유로운 사내 하나가 손을 흔든다.
      - speaker: 가면 쓴 검투사
        text: 처음 보는 얼굴들이군. 오늘은 오래 버티는 쪽이 이기는 날이라던데, 내기는 했나?
        portrait: SHI_PORTRAIT
        standing: SPARTACUS_STANDING
      - speaker: 일행
        text: 트라키아식 억양, 목에 남은 오래된 사슬 자국, 그리고 자유를 말할 때만 잠깐 사라지는 웃음. 역사에서 읽었던 인물이 떠오른다.
      - speaker: 주인공
        text: 스파르타쿠스.
      - speaker: 스파르타쿠스
        text: 하하, 들켰나? 이름 하나 숨기는 게 칼 휘두르는 것보다 어렵군. 그래도 축제는 끝까지 즐겨야지. 결승에서 보자고.
        portrait: SPARTACUS_PORTRAIT
        standing: SPARTACUS_STANDING
    choices:
      - id: keep_spartacus_secret
        text: 관중 앞에서는 모르는 척한다.
        action: continue
        successText: 스파르타쿠스는 웃으며 경기장으로 돌아갔다. 결승전에서 그의 진짜 실력을 확인하게 될 것이다.
      - id: warn_spartacus
        text: 로마 경비대가 눈치채기 전에 떠나라고 경고한다.
        action: continue
        successText: 그는 고맙다는 듯 고개를 끄덕였지만, 받은 의뢰와 결승전은 끝내겠다며 자리를 지켰다.

# 고정 보스는 현재 없다.
# 테마가 하나뿐이라 10스테이지마다 스파르타쿠스가 반복 등장하므로,
# 25/50/75/100 지점의 고정 보스는 테마가 늘어난 뒤에 다시 설계한다.
fixedBossStages: []
