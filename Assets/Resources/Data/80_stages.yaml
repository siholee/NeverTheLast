# 테마 / 사건 / 고정 보스 정의
#
# 2026-09 전면 개편으로 옛 테마 20여 개와 사건을 모두 걷어냈다. 새 로스터가 들어오기 전까지
# 시험장(id 1) 하나가 런 전체를 돈다. 라운드가 바뀌면 같은 테마가 다시 뽑히고 적 레벨만 오른다.
#
# 테마를 다시 늘릴 때 필요한 것:
#   1. 전용 적 초상화 자산
#   2. 60_enemies.yaml에 해당 themeId의 normal/elite/boss 등록
#   3. 여기 stageThemes에 항목 추가 (enemyThemeId를 적 themeId와 일치시킬 것)
#   4. backgroundKey에 Resources 상대 전장 배경 키(확장자 제외)와 ambientColor 지정
#   5. events에 5슬롯 사건 추가
#
# stagePatterns가 있는 스테이지는 midBossId/bossId 단독 스폰보다 우선한다.
# frontIds/rearIds로 열을 못 박으면 archetype 판정을 건너뛴다.

stageThemes:
  # ── 공허의 시험장 ──────────────────────────────────────────────────
  # 새 스탯 · 전투 연출의 검증장. 돌격(카드 박치기) · 사격(투사체) · 기절(집중 해제)을
  # 스테이지마다 하나씩 더해 가며 보여 준다.
  #   1~2  늑대 · 사수 — 근접 돌진과 원거리 투사체
  #   3~4  선봉 합류 — 단단한 전열
  #   8    분쇄자 단독 — 대지 분쇄의 기절로 세이의 '집중'이 풀리는지 본다
  #   10   공허룡 단독 — 아군 전원을 치는 숨결
  - id: 1
    name: 공허의 시험장
    enabled: false
    tags: [Void, Trial]
    enemyThemeId: 1
    description: 공허가 빚어낸 짐승들이 끝없이 모래 위로 올라온다. 새 힘을 시험하기에 알맞은 곳이다.
    midBossId: 2001
    midBossStageInRound: 6
    bossId: 3001
    backgroundKey: UI/Chrome/board_environment_bright_1672x941
    ambientColor: "#2C2440"   # 공허 — 보랏빛 어둠
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { frontIds: [1001], weight: 100 }
      - stageInRound: 2
        patterns:
          - { frontIds: [1001], rearIds: [1002], weight: 100 }
      - stageInRound: 3
