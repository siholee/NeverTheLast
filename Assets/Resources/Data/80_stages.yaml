# 테마 / 사건 / 고정 보스 정의
#
# 운영 테마는 로마 군단(id 5), 메히코(id 6), 아스완(id 7)이다.
# 콜로세움(id 4)은 리메이크가 필요해 enabled: false로 잠시 빼두었다.
#   데이터는 그대로 두었으므로 다시 켤 때는 그 줄만 지우거나 true로 바꾸면 된다.
# 노르드·일본 테마는 전용 적 스프라이트가 없어 제거되었다.
# 케찰코아틀은 메히코 9스테이지 조우로 복귀했으며, 영웅 획득 경로는 아직 별도다.
#
# 테마를 다시 늘릴 때 필요한 것:
#   1. 전용 적 초상화 자산
#   2. 60_enemies.yaml에 해당 themeId의 normal/elite/boss 등록
#   3. 여기 stageThemes에 항목 추가 (enemyThemeId를 적 themeId와 일치시킬 것)
#   4. 필요하면 events에 테마 사건 추가
#
# stagePatterns가 있는 스테이지는 midBossId/bossId 단독 스폰보다 우선한다.
# 보스에게 호위를 붙이고 싶으면 그 스테이지의 패턴에 보스 ID를 직접 적으면 된다.
# midBossStageInRound를 비워 두면 기존 규칙대로 8스테이지가 중간 보스 슬롯이다.

stageThemes:
  # ── 콜로세움 (일시 비활성) ─────────────────────────────────────────
  # 리메이크 예정이라 런 로테이션에서 빼두었다. 편성·보스·사건은 손대지 않았으므로
  # enabled를 true로 되돌리면 그대로 돌아온다.
  - id: 4
    name: 콜로세움
    enabled: false
    tags: [Colosseum, Rome, Festival]
    enemyThemeId: 5
    description: 로마 각지의 인간 검투사와 속주에서 붙잡아 온 괴수가 맞붙는 대축제입니다.
    midBossId: 2005
    bossId: 3003
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { enemyIds: [1020, 1023], weight: 100 }
      - stageInRound: 2
        patterns:
          - { enemyIds: [1021, 1022], weight: 100 }
      - stageInRound: 3
        patterns:
          - { enemyIds: [1023, 1024, 1020], weight: 60 }
          - { enemyIds: [1025, 1021, 1020], weight: 40 }
      - stageInRound: 4
        patterns:
          - { enemyIds: [2004, 1023], weight: 100 }
      - stageInRound: 6
        patterns:
          - { enemyIds: [1020, 1025, 1023, 1024], weight: 50 }
          - { enemyIds: [1021, 1022, 1023, 1024], weight: 50 }
      - stageInRound: 7
        patterns:
          - { enemyIds: [1020, 1021, 1023, 1024, 1025], weight: 100 }
      - stageInRound: 9
        patterns:
          - { enemyIds: [2004, 1022, 1024, 1025], weight: 50 }
          - { enemyIds: [1020, 1021, 1023, 1024, 1025], weight: 50 }

  # ── 로마 군단 ──────────────────────────────────────────────────────
  # 콜로세움이 '축제'라면 이쪽은 '전쟁'이다. 전열 사다리를 그대로 밟아 올라가는 편성이라
  # 스테이지가 진행될수록 같은 자리에 더 단단한 병종이 들어선다.
  #
  # 중간 보스 슬롯을 9로 옮겼다. 아그리파는 옥타비아를 밀어 주는 서포터라
  # 단독으로 세우면 위협이 되지 않고, 둘을 함께 세우려면 호위가 붙는 패턴이 필요하다.
  # 보스 슬롯(10)도 패턴으로 적어 카이사르에게 호위를 붙였다.
  - id: 5
    name: 로마 군단
    tags: [Rome, Legion, War]
    enemyThemeId: 6
    description: 공화정 로마의 정규 군단이 진형을 갖추고 밀고 들어옵니다.
    midBossId: 2006
    midBossStageInRound: 9
    bossId: 3004
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { enemyIds: [1030, 1030, 1030, 1035, 1035], weight: 100 }
      - stageInRound: 2
        patterns:
          - { enemyIds: [1030, 1030, 1031, 1035, 1035], weight: 100 }
      - stageInRound: 3
        patterns:
          - { enemyIds: [1031, 1031, 1031, 1036, 1036], weight: 100 }
      - stageInRound: 4
        patterns:
          - { enemyIds: [1032, 1032, 1032, 1036, 1036], weight: 100 }
      - stageInRound: 6
        patterns:
          - { enemyIds: [1032, 1032, 1034, 1037, 1037], weight: 100 }
      - stageInRound: 7
        patterns:
          - { enemyIds: [1033, 1033, 1034, 1037, 1037], weight: 100 }
      - stageInRound: 8
        patterns:
          - { enemyIds: [1033, 1033, 1034, 1038, 1038], weight: 100 }
      - stageInRound: 9
        patterns:
          - { enemyIds: [1033, 1033, 1034, 2006, 2007], weight: 100 }
      - stageInRound: 10
        patterns:
          - { enemyIds: [1033, 1033, 1033, 3004, 1038], weight: 100 }

  # ── 메히코 ────────────────────────────────────────────────────────
  - id: 6
    name: 메히코
    tags: [Mexica, Ritual, Obsidian]
    enemyThemeId: 7
    description: 재규어와 독수리 전사들이 전열을 세우고 뱀 사제와 두 신이 의식을 완성합니다.
    bossId: 3010
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { enemyIds: [1040, 1040, 1040, 1041, 1041], weight: 100 }
      - stageInRound: 2
        patterns:
          - { enemyIds: [1040, 1040, 1040, 1040, 2011], weight: 100 }
      - stageInRound: 3
        patterns:
          - { enemyIds: [2010, 2010, 2010, 2011, 2011], weight: 100 }
      - stageInRound: 4
        patterns:
          - { enemyIds: [2010, 2010, 2010, 2010, 1042], weight: 100 }
      - stageInRound: 6
        patterns:
          - { enemyIds: [2010, 2010, 2010, 2010, 2012], weight: 100 }
      - stageInRound: 7
        patterns:
          - { enemyIds: [2010, 2010, 2010, 2012, 2012], weight: 100 }
      - stageInRound: 8
        patterns:
          - { enemyIds: [2010, 2010, 2011, 2012, 2012], weight: 100 }
      - stageInRound: 9
        patterns:
          - { enemyIds: [2010, 2010, 2011, 2012, 3201], weight: 100 }
      - stageInRound: 10
        patterns:
          - { enemyIds: [2010, 2010, 3010], weight: 100 }

  # ── 아스완 ────────────────────────────────────────────────────────
  # 한 테마 안에서 성격이 두 번 바뀐다.
  #   1~3  종말의 사도 — 불을 붙이고 화상으로 방어력을 벗겨 내는 정면 편성.
  #   4    호루스 조우 — 앞 절반의 마침표.
  #   6~8  사령 — 되살아나고 스스로 수를 불리는 편성. 처리 속도를 시험한다.
  #   9    오시리스 — 깎을수록 단단해지는 부위 파괴 보스. 깰 때마다 사령이 쏟아진다.
  #   10   아문·라 — 스택을 쌓아 한 번에 터뜨리는 최종 보스.
  #
  # 중간 보스 슬롯을 9로 옮겼다. 오시리스는 부위 파괴로 사령을 뿌리므로
  # 호위를 따로 붙이지 않아도 단독으로 필드가 가득 찬다.
  - id: 7
    name: 아스완
    tags: [Aswan, Egypt, Apocalypse]
    enemyThemeId: 8
    description: 종말을 선포한 사도들이 불을 놓고, 그 재 위로 명계의 사령이 걸어 나옵니다.
    midBossId: 3011
    midBossStageInRound: 9
    bossId: 3012
    stagePatterns:
      - stageInRound: 1
        patterns:
          - { enemyIds: [1050, 1050, 1050, 1051, 1051], weight: 100 }
      - stageInRound: 2
        patterns:
          - { enemyIds: [1050, 1050, 2020, 2021, 2021], weight: 100 }
      - stageInRound: 3
        patterns:
          - { enemyIds: [2020, 2020, 2020, 1051, 1051], weight: 100 }
      - stageInRound: 4
        patterns:
          - { enemyIds: [3203], weight: 100 }
      - stageInRound: 6
        patterns:
          - { enemyIds: [1052, 1052, 1052], weight: 100 }
      - stageInRound: 7
        patterns:
          - { enemyIds: [1052, 1052, 1053, 1053], weight: 100 }
      - stageInRound: 8
        patterns:
          - { enemyIds: [1052, 1052, 1053, 1053, 1053], weight: 100 }
      - stageInRound: 9
        patterns:
          - { enemyIds: [3011], weight: 100 }
      - stageInRound: 10
        patterns:
          - { enemyIds: [3012], weight: 100 }

events:
  - id: colosseum_masked_gladiator
    themeId: 4
    stageInRound: 5
    oncePerRun: true
    title: 가면 쓴 검투사
    dialogue:
      - speaker: 일행
        text: 축제의 함성이 경기장 밖까지 울린다. 다음 시합을 기다리는 검투사들 사이에서 유난히 여유로운 사내 하나가 손을 흔든다.
      - speaker: 가면 쓴 검투사
        text: 처음 보는 얼굴들이군. 오늘은 오래 버티는 쪽이 이기는 날이라던데, 내기는 했나?
        portrait: SHI_PORTRAIT
        standing: SPARTACUS_STANDING
      - speaker: 일행
        text: 트라키아식 억양, 목에 남은 오래된 사슬 자국, 그리고 자유를 말할 때만 잠깐 사라지는 웃음. 역사에서 읽었던 인물이 떠오른다.
      - speaker: 주인공
        text: 스파르타쿠스.
      - speaker: 스파르타쿠스
        text: 하하, 들켰나? 이름 하나 숨기는 게 칼 휘두르는 것보다 어렵군. 그래도 축제는 끝까지 즐겨야지. 결승에서 보자고.
        portrait: SPARTACUS_PORTRAIT
        standing: SPARTACUS_STANDING
    choices:
      - id: keep_spartacus_secret
        text: 관중 앞에서는 모르는 척한다.
        action: continue
        successText: 스파르타쿠스는 웃으며 경기장으로 돌아갔다. 결승전에서 그의 진짜 실력을 확인하게 될 것이다.
      - id: warn_spartacus
        text: 로마 경비대가 눈치채기 전에 떠나라고 경고한다.
        action: continue
        successText: 그는 고맙다는 듯 고개를 끄덕였지만, 받은 의뢰와 결승전은 끝내겠다며 자리를 지켰다.

  - id: legion_crossing_the_rubicon
    themeId: 5
    stageInRound: 5
    oncePerRun: true
    title: 강가의 야영지
    dialogue:
      - speaker: 일행
        text: 강 건너편에 군단의 야영지가 늘어서 있다. 보초는 이쪽을 보고도 창을 내리지 않는다. 싸울 상대로 세지 않았다는 뜻이다.
      - speaker: 백인대장
        text: 여기서부터는 군단의 관할이다. 지나가려면 이름을 대라.
        portrait: MARCELLUS_PORTRAIT
        standing: MARCELLUS_STANDING
      - speaker: 일행
        text: 천막 사이로 지휘관 하나가 걸어 나온다. 갑옷은 병사들과 다를 바 없는데, 지나가는 병사마다 하던 일을 멈추고 고개를 숙인다.
      - speaker: 카이사르
        text: 이름은 됐다. 강을 건널 셈이면 건너라. 어차피 한 번 건넌 다리는 되돌아갈 수 없으니, 서로 각오만 확인해 두자고.
        portrait: CAESAR_PORTRAIT
        standing: CAESAR_STANDING
    choices:
      - id: legion_accept_challenge
        text: 결승에서 보자고 답한다.
        action: continue
        successText: 카이사르는 짧게 웃고 돌아섰다. 야영지의 병사들이 길을 터 준다.
      - id: legion_observe_camp
        text: 대답 없이 야영지의 진형을 눈에 담는다.
        action: continue
        successText: 전열과 후열이 칼같이 나뉘어 있다. 어느 자리에 누가 서는지 미리 알아 둔 것만으로도 소득이다.

  - id: mexica_smoking_mirror
    themeId: 6
    stageInRound: 5
    oncePerRun: true
    title: 연기 나는 거울
    dialogue:
      - speaker: 일행
        text: 흑요석 거울 위로 검은 연기가 피어오른다. 재규어의 울음과 독수리의 날갯짓이 한 박자 늦게 메아리친다.
      - speaker: 테스카틀리포카
        text: 전열은 제물이고 후열은 증인이다. 너희는 어느 쪽에 설 테냐.
        portrait: AZTEC_TEZCATLIPOCA_PORTRAIT
        standing: AZTEC_TEZCATLIPOCA_STANDING
    choices:
      - id: mexica_face_the_mirror
        text: 거울을 똑바로 바라본다.
        action: continue
        successText: 연기가 걷히며 다음 전장으로 이어지는 검은 길이 열린다.
      - id: mexica_break_the_ritual
        text: 의식의 북을 끊는다.
        action: continue
        successText: 북소리는 멎었지만 전사들의 발걸음은 더 빨라졌다.

  - id: aswan_the_first_seal
    themeId: 7
    stageInRound: 5
    oncePerRun: true
    title: 첫 번째 봉인
    dialogue:
      - speaker: 일행
        text: 강 상류의 채석장이 통째로 불에 그을려 있다. 무너진 신전 기둥마다 같은 문장이 새로 새겨져 있다 — 종말을 선포하는 사도들의 것이다.
      - speaker: 호루스
        text: 여기서부터는 아버지의 땅이다. 사도들이 불을 놓았고, 그 재 밑에서 무언가가 걸어 나오고 있다.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
      - speaker: 일행
        text: 그가 활을 내리지 않은 채 강 건너편을 가리킨다. 모래 위로 발자국이 이어지는데, 발자국을 남긴 것들의 그림자가 보이지 않는다.
      - speaker: 호루스
        text: 사령은 죽여도 한 번은 다시 일어선다. 두 번 죽일 각오가 없다면 강을 건너지 마라.
        portrait: HORUS_PORTRAIT
        standing: HORUS_STANDING
    choices:
      - id: aswan_ask_about_osiris
        text: 재 밑에서 걸어 나온 것이 무엇인지 묻는다.
        action: continue
        successText: 호루스는 대답 대신 상류를 오래 바라보았다. 그 이름을 입에 올리지 않는 것만으로도 답이 되었다.
      - id: aswan_burn_the_seal
        text: 기둥에 새겨진 문장을 지운다.
        action: continue
        successText: 문장은 지워졌지만 그을음은 남았다. 사도들은 곧 같은 자리에 다시 새길 것이다.

# 고정 보스는 현재 없다.
# 25/50/75/100 지점의 고정 보스는 아직 설계되지 않았다.
# 🔸 '고정 보스 라운드에서는 2번 스테이지를 건너뛰고 이후 스테이지를 1씩 당긴다'는
#    규칙이 기획에 있으나 아직 구현하지 않았다. 현재 엔진은 그 대신
#    보스 슬롯을 10 → 9로 당기는 기존 방식을 쓴다. Design_Backlog 항목 13을 볼 것.
fixedBossStages: []
