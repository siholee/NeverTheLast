# 라운드 타입 (편성 패턴 폴백)
#
# 테마가 stagePatterns를 직접 정의하면 그쪽이 우선한다.
# 여기 정의는 stagePatterns가 없는 스테이지 슬롯에서만 쓰인다.
#
# archetype은 배치 열만 정한다. 7/8/9는 전열, 그 외는 후열이다.
#   7  전열 - 무르밀로, 마르켈루스 / 하스타티, 프린키페스, 트리아리, 센츄리온
#   8  전열 - 호플로마쿠스, 디마카이루스, 스파르타쿠스 / 에퀴테스, 카이사르
#   9  전열 - 트라엑스, 세쿠토르 / 명계의 사령
#   10 후열 - 레티아리우스, 사비나 / 벨리테스, 스콜피오
#   11 후열 - 옵티오, 트리뷴, 아그리파, 옥타비아 (지휘·지원형)
# 아래 roundTypes는 stagePatterns가 없는 스테이지 슬롯의 폴백일 뿐이다.
# 로마 군단 테마는 전투 스테이지 전부에 stagePatterns가 있어 여기까지 내려오지 않는다.
# 새 분류를 쓰려면 60_enemies.yaml에 해당 archetype의 적을 먼저 등록할 것.

roundTypes:
  - id: 1
    name: "Round Type 1"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [7, 10]
        weight: 40
      - archetypes: [7, 9, 10]
        weight: 30
      - archetypes: [7, 7, 10]
        weight: 30

  - id: 2
    name: "Round Type 2"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [8, 10]
        weight: 25
      - archetypes: [8, 10, 10]
        weight: 25
      - archetypes: [8, 8, 10]
        weight: 25
      - archetypes: [8, 8, 9, 10]
        weight: 25

  - id: 3
    name: "Round Type 3"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [7, 7, 10]
        weight: 30
      - archetypes: [7, 7, 9, 10]
        weight: 30
      - archetypes: [7, 8, 9, 10]
        weight: 20
      - archetypes: [7, 8, 9, 10, 10]
        weight: 20

  - id: 4
    name: "Round Type 4 Elite"
    isElite: true
    isBoss: false
    patterns:
      - eliteIds: [2004]
        weight: 50
      - eliteIds: [2004, 2005]
        weight: 50

  - id: 5
    name: "Round Type 5"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [9, 10]
        weight: 25
      - archetypes: [9, 10, 10]
        weight: 25
      - archetypes: [9, 9, 10]
        weight: 25
      - archetypes: [9, 9, 10, 10]
        weight: 25

  - id: 6
    name: "Round Type 6"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [8, 9, 10]
        weight: 30
      - archetypes: [8, 8, 9, 10]
        weight: 40
      - archetypes: [8, 9, 9, 10]
        weight: 30

  - id: 7
    name: "Round Type 7"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [9, 9, 8]
        weight: 30
      - archetypes: [9, 9, 8, 8]
        weight: 30
      - archetypes: [9, 9, 9, 8]
        weight: 20
      - archetypes: [9, 9, 9, 8, 10]
        weight: 20

  - id: 8
    name: "Round Type 8 Elite"
    isElite: true
    isBoss: false
    patterns:
      - eliteIds: [2004, 2005]
        weight: 60
      - eliteIds: [2004, 2004, 2005]
        weight: 40

  - id: 9
    name: "Round Type 9"
    isElite: false
    isBoss: false
    patterns:
      - archetypes: [7, 7, 10]
        weight: 30
      - archetypes: [7, 7, 10, 10]
        weight: 30
